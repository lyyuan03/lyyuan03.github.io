<style>
:root{--gold:#A58254;--cream:#F5F0E8;--deep:#071106;--panel:rgba(14,22,12,.9);--line:rgba(165,130,84,.24);--serif:'Noto Serif TC','Georgia',serif;--sans:'Noto Sans TC','Arial',sans-serif;--en:'Cormorant Garamond',serif}
*{box-sizing:border-box}body{margin:0;background:#071106;color:var(--cream);font-family:var(--sans);line-height:1.9;letter-spacing:.04em}a{color:inherit;text-decoration:none}.site-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 28px;background:rgba(7,17,6,.97);border-bottom:1px solid var(--line)}.logo{font-family:var(--serif);color:var(--gold);letter-spacing:.22em;font-size:20px}.site-top nav{display:flex;gap:18px;flex-wrap:wrap}.site-top a{font-size:14px;color:rgba(245,240,232,.72)}.hero{padding:74px 24px 52px;text-align:center;background:linear-gradient(180deg,rgba(7,17,6,.84),rgba(7,17,6,.96)),url('forest-path.jpg') center/cover}.hero .eyebrow{font-family:var(--en);font-size:13px;letter-spacing:.42em;color:rgba(165,130,84,.8)}h1{font-family:var(--serif);font-size:42px;font-weight:500;letter-spacing:.24em;color:var(--gold);margin:10px 0 14px}.hero p{max-width:680px;margin:0 auto;color:rgba(245,240,232,.72)}.wrap{max-width:1040px;margin:0 auto;padding:34px 24px 72px}.category-tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:30px}.category-tabs a{border:1px solid rgba(165,130,84,.28);padding:9px 14px;color:rgba(245,240,232,.66);font-size:14px}.category-tabs a.is-active,.category-tabs a:hover{background:rgba(165,130,84,.14);color:var(--gold)}.article-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.article-card{display:block;padding:24px;background:var(--panel);border:1px solid var(--line);min-height:210px}.article-card:hover{background:rgba(25,36,20,.94)}.article-card img{width:100%;aspect-ratio:16/9;object-fit:cover;margin-bottom:18px;border:1px solid rgba(165,130,84,.18)}.article-meta{font-size:12px;color:rgba(165,130,84,.86);letter-spacing:.18em}.article-card h2{font-family:var(--serif);font-size:23px;font-weight:500;letter-spacing:.1em;margin:10px 0;color:#F5F0E8}.article-card p{margin:0;color:rgba(245,240,232,.66);font-size:15px}.limited-reading-countdown{display:bloc
