<!DOCTYPE html>

<style>
:root{--gold:#A58254;--gold-light:#C5A26F;--cream:#F5F0E8;--deep:#071106;--ink:#211A14;--serif:'Noto Serif TC','Georgia',serif;--sans:'Noto Sans TC','Arial',sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#071106;color:var(--cream);font-family:var(--sans);letter-spacing:.04em}
a{text-decoration:none;color:inherit}
.preview-bar{position:sticky;top:0;z-index:20;padding:10px 18px;text-align:center;background:#A58254;color:#17120C;font-size:13px;font-weight:500;letter-spacing:.12em}
.site-nav{height:72px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(165,130,84,.2);background:rgba(7,17,6,.96)}
.site-nav-inner{width:min(980px,calc(100% - 36px));display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-family:var(--serif);font-size:20px;color:var(--gold-light);letter-spacing:.2em}
.nav-actions{display:flex;gap:10px;align-items:center}.nav-actions a{padding:9px 15px;border:1px solid rgba(165,130,84,.35);font-size:13px;color:rgba(245,240,232,.78)}
.hero{position:relative;min-height:760px;padding:62px 20px 88px;overflow:hidden;background:linear-gradient(rgba(7,17,6,.8),rgba(7,17,6,.94)),url('forest-path.jpg') center/cover fixed}
.article-shell{width:min(980px,100%);margin:0 auto;background:rgba(238,233,224,.96);color:#2b251f;min-height:620px;box-shadow:0 18px 60px rgba(0,0,0,.32)}
.article-head{padding:42px 44px 28px;border-bottom:1px solid rgba(89,79,71,.15)}
.article-head small{display:block;margin-bottom:10px;color:#8B6A41;font-size:12px;letter-spacing:.18em}.article-head h1{margin:0;font-family:var(--serif);font-size:clamp(27px,4vw,40px);line-height:1.55;letter-spacing:.08em;font-weight:500}.article-head p{margin:16px 0 0;color:#685c50;line-height:1.9;font-family:var(--serif)}
.article-body{position:relative;padding:34px 44px 74px;overflow:hidden}.article-lines{filter:blur(3px);opacity:.22;user-select:none;pointer-events:none}.article-lines span{display:block;height:14px;border-radius:20px;background:#6b6259;margin:0 0 20px}.article-lines span:nth-child(2n){width:82%}.article-lines span:nth-child(3n){width:68%}.article-lines span:nth-child(4n){width:92%}
.pay-card{position:absolute;left:50%;top:48px;transform:translateX(-50%);width:min(470px,calc(100% - 36px));padding:34px 34px 30px;text-align:center;background:rgba(250,247,241,.96);border:1px solid rgba(165,130,84,.34);box-shadow:0 18px 48px rgba(40,30,18,.22)}
.pay-symbol{width:34px;height:34px;margin:0 auto 16px;display:grid;place-items:center;border:1px solid rgba(165,130,84,.55);transform:rotate(45deg);color:#A58254}.pay-symbol span{transform:rotate(-45deg);font-size:12px}
.pay-card h2{margin:0 0 14px;font-family:var(--serif);font-size:25px;letter-spacing:.1em;color:#2A231D}.pay-card p{margin:0 auto 22px;max-width:360px;color:#5F554A;line-height:1.9;font-size:15px}
.primary-action{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:12px 18px;background:linear-gradient(135deg,#A58254,#C5A26F);color:#1F170F;font-family:var(--serif);font-size:16px;font-weight:500;letter-spacing:.12em;box-shadow:0 10px 24px rgba(165,130,84,.24);transition:transform .2s,filter .2s}.primary-action:hover{transform:translateY(-2px);filter:brightness(1.05)}
.secondary-action{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;margin-top:10px;padding:10px 18px;border:1px solid rgba(89,79,71,.28);color:#56493D;font-size:13px;letter-spacing:.08em;background:rgba(255,255,255,.26)}
.notice{margin:18px 0 0;padding:14px 15px;text-align:left;background:#EEE7DA;border-left:3px solid #A58254;color:#5C5044;font-size:13px;line-height:1.8}.notice strong{color:#352B22}.micro{margin-top:13px;color:#8E8377;font-size:11px;line-height:1.7}
.test-result{display:none;margin-top:14px;padding:10px 12px;background:#E5E8D7;color:#3E4926;font-size:12px}.test-result.show{display:block}
@media(max-width:640px){.site-nav{height:auto;padding:14px 0}.site-nav-inner{align-items:flex-start;flex-direction:column}.article-head{padding:30px 24px 22px}.article-body{padding:28px 20px 66px}.pay-card{top:36px;padding:28px 22px 24px}.pay-card h2{font-size:22px}.hero{padding:34px 12px 60px}}

</head>
