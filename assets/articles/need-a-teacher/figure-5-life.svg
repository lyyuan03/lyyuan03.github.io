<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#171d18"/>
<text x="80" y="105" fill="#d8b673" font-family="serif" font-size="56" font-weight="700">兩邊都是老師，但介入方式不同</text>
<line x1="800" y1="250" x2="800" y2="650" stroke="#a58254" stroke-width="10"/>
<line x1="430" y1="345" x2="1170" y2="345" stroke="#d8b673" stroke-width="8"/>
<path d="M430 345l-160 250h320Z" fill="#594f47" opacity=".92"/>
<path d="M1170 345l-160 250h320Z" fill="#606330" opacity=".92"/>
<circle cx="800" cy="260" r="58" fill="#d8b673"/>
<text x="430" y="690" text-anchor="middle" fill="#f3eee3" font-family="serif" font-size="38" font-weight="700">有形師</text>
<text x="430" y="742" text-anchor="middle" fill="#d9d2c3" font-family="serif" font-size="26">能直接提醒、阻止、陪伴與校正</text>
<text x="1170" y="690" text-anchor="middle" fill="#f3eee3" font-family="serif" font-size="38" font-weight="700">無形師</text>
<text x="1170" y="742" text-anchor="middle" fill="#d9d2c3" font-family="serif" font-size="26">讓你看見、給方向，但不替你做決定</text>
<text x="800" y="835" text-anchor="middle" fill="#d8b673" font-family="serif" font-size="30">修行的責任，最後仍然回到自己。</text>
</svg>