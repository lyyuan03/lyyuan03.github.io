<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d2730"/><stop offset="1" stop-color="#07151a"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#bg)"/><text x="80" y="100" font-size="56" fill="#f3d68a" font-family="serif" font-weight="700">生活，是修行最後的驗證場</text><circle cx="800" cy="450" r="120" fill="#18343a" stroke="#f0c96d" stroke-width="6"/><text x="800" y="468" text-anchor="middle" font-size="46" fill="#f5f1e8" font-family="serif" font-weight="700">生活</text><line x1="800" y1="450" x2="800" y2="180" stroke="#a98a49" stroke-width="3"/><circle cx="800" cy="180" r="86" fill="#10262c" stroke="#d5aa4b" stroke-width="4"/><text x="800" y="172" text-anchor="middle" font-size="30" fill="#f3d68a" font-family="serif">自己</text><text x="800" y="212" text-anchor="middle" font-size="21" fill="#eee8dc" font-family="serif">情緒是否穩定</text><line x1="800" y1="450" x2="1180" y2="280" stroke="#a98a49" stroke-width="3"/><circle cx="1180" cy="280" r="86" fill="#10262c" stroke="#d5aa4b" stroke-width="4"/><text x="1180" y="272" text-anchor="middle" font-size="30" fill="#f3d68a" font-family="serif">家人</text><text x="1180" y="312" text-anchor="middle" font-size="21" fill="#eee8dc" font-family="serif">是否更信任你</text><line x1="800" y1="450" x2="1200" y2="610" stroke="#a98a49" stroke-width="3"/><circle cx="1200" cy="610" r="86" fill="#10262c" stroke="#d5aa4b" stroke-width="4"/><text x="1200" y="602" text-anchor="middle" font-size="30" fill="#f3d68a" font-family="serif">關係</text><text x="1200" y="642" text-anchor="middle" font-size="21" fill="#eee8dc" font-family="serif">是否減少衝突</text><line x1="800" y1="450" x2="800" y2="735" stroke="#a98a49" stroke-width="3"/><circle cx="800" cy="735" r="86" fill="#10262c" stroke="#d5aa4b" stroke-width="4"/><text x="800" y="727" text-anchor="middle" font-size="30" fill="#f3d68a" font-family="serif">工作</text><text x="800" y="767" text-anchor="middle" font-size="21" fill="#eee8dc" font-family="serif">是否更能承擔</text><line x1="800" y1="450" x2="400" y2="610" stroke="#a98a49" stroke-width="3"/><circle cx="400" cy="610" r="86" fill="#10262c" stroke="#d5aa4b" stroke-width="4"/><text x="400" y="602" text-anchor="middle" font-size="30" fill="#f3d68a" font-family="serif">物質</text><text x="400" y="642" text-anchor="middle" font-size="21" fill="#eee8dc" font-family="serif">是否更有秩序</text><line x1="800" y1="450" x2="420" y2="280" stroke="#a98a49" stroke-width="3"/><circle cx="420" cy="280" r="86" fill="#10262c" stroke="#d5aa4b" stroke-width="4"/><text x="420" y="272" text-anchor="middle" font-size="30" fill="#f3d68a" font-family="serif">心性</text><text x="420" y="312" text-anchor="middle" font-size="21" fill="#eee8dc" font-family="serif">是否更謙虛自在</text><text x="800" y="850" text-anchor="middle" font-size="32" fill="#e8dfc8" font-family="serif">話可以包裝，生活很難包裝。</text></svg>