<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#171d18"/>
<text x="80" y="105" fill="#d8b673" font-family="serif" font-size="56" font-weight="700">有形師 × 無形師：分工，不取代</text>
<rect x="90" y="175" width="610" height="570" rx="30" fill="#242b25" stroke="#a58254" stroke-width="3"/>
<rect x="900" y="175" width="610" height="570" rx="30" fill="#202820" stroke="#606330" stroke-width="3"/>
<text x="395" y="255" text-anchor="middle" fill="#f3eee3" font-family="serif" font-size="42" font-weight="700">有形師</text>
<text x="1205" y="255" text-anchor="middle" fill="#f3eee3" font-family="serif" font-size="42" font-weight="700">無形師</text>
<text x="160" y="355" fill="#ded6c7" font-family="serif" font-size="32">陪伴與長期觀察</text><text x="160" y="425" fill="#ded6c7" font-family="serif" font-size="32">依心性校正方向</text><text x="160" y="495" fill="#ded6c7" font-family="serif" font-size="32">在現實中提醒與阻止</text><text x="160" y="565" fill="#ded6c7" font-family="serif" font-size="32">指出你看不到的死角</text>
<text x="970" y="355" fill="#ded6c7" font-family="serif" font-size="32">直指根本與心性</text><text x="970" y="425" fill="#ded6c7" font-family="serif" font-size="32">跨越時間與地點</text><text x="970" y="495" fill="#ded6c7" font-family="serif" font-size="32">靈界、因果與信仰</text><text x="970" y="565" fill="#ded6c7" font-family="serif" font-size="32">提供方向與深層提醒</text>
<circle cx="800" cy="655" r="105" fill="#594f47" stroke="#d8b673" stroke-width="4"/>
<text x="800" y="645" text-anchor="middle" fill="#fff7e7" font-family="serif" font-size="31" font-weight="700">思辨</text><text x="800" y="690" text-anchor="middle" fill="#fff7e7" font-family="serif" font-size="31" font-weight="700">驗證</text>
<path d="M695 650H590M905 650h105" stroke="#d8b673" stroke-width="6" stroke-linecap="round"/>
<text x="800" y="825" text-anchor="middle" fill="#c9c0b0" font-family="serif" font-size="28">兩邊都能教你；兩邊也都不能替你活。</text>
</svg>