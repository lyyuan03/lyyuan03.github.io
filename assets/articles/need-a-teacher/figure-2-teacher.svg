<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d2730"/><stop offset="1" stop-color="#07151a"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d88b"/><stop offset="1" stop-color="#b78532"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#bg)"/><circle cx="1180" cy="330" r="180" fill="url(#gold)" opacity=".16"/><circle cx="1180" cy="330" r="95" fill="#f4d88b" opacity=".22"/><path d="M370 720 Q430 560 500 430 Q560 330 650 260" fill="none" stroke="#d6aa52" stroke-width="8"/><circle cx="350" cy="740" r="65" fill="#172f35"/><circle cx="690" cy="240" r="70" fill="#f4d88b" opacity=".7"/><text x="80" y="110" font-size="56" fill="#f3d68a" font-family="serif" font-weight="700">老師先從教導開始，不先從名字開始</text><text x="85" y="185" font-size="30" fill="#f1eee5" font-family="serif">觀念 → 靈動 → 靈療 → 問事 → 訊息 → 反覆求證</text><line x1="220" y1="280" x2="1350" y2="280" stroke="#8f7a49" stroke-width="2"/><text x="90" y="360" font-size="34" fill="#d8c899" font-family="serif">教導在前</text><text x="90" y="420" font-size="26" fill="#e8e2d3" font-family="serif">先被教、先做、先在事情上磨。</text><text x="1060" y="650" font-size="34" fill="#d8c899" font-family="serif">名字在後</text><text x="880" y="710" font-size="26" fill="#e8e2d3" font-family="serif">真正的連結，是在一件件事情裡驗證出來。</text></svg>