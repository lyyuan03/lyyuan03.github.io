<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d2730"/><stop offset="1" stop-color="#07151a"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#bg)"/><text x="80" y="100" font-size="56" fill="#f3d68a" font-family="serif" font-weight="700">求證的迴圈：讓真實說話</text><circle cx="800" cy="470" r="125" fill="#0b1f25" stroke="#e2b85d" stroke-width="5"/><text x="800" y="458" text-anchor="middle" font-size="42" fill="#f4d88b" font-family="serif" font-weight="700">求真</text><text x="800" y="510" text-anchor="middle" font-size="26" fill="#f0ece1" font-family="serif">不是找人簽名，而是讓現實驗證</text><circle cx="800" cy="190" r="78" fill="#17333b" stroke="#d5aa4b" stroke-width="4"/><text x="800" y="200" text-anchor="middle" font-size="28" fill="#f5f1e8" font-family="serif">接收訊息</text><circle cx="1160" cy="300" r="78" fill="#17333b" stroke="#d5aa4b" stroke-width="4"/><text x="1160" y="310" text-anchor="middle" font-size="28" fill="#f5f1e8" font-family="serif">提出問題</text><circle cx="1230" cy="610" r="78" fill="#17333b" stroke="#d5aa4b" stroke-width="4"/><text x="1230" y="620" text-anchor="middle" font-size="28" fill="#f5f1e8" font-family="serif">實際操作</text><circle cx="800" cy="745" r="78" fill="#17333b" stroke="#d5aa4b" stroke-width="4"/><text x="800" y="755" text-anchor="middle" font-size="28" fill="#f5f1e8" font-family="serif">觀察結果</text><circle cx="360" cy="610" r="78" fill="#17333b" stroke="#d5aa4b" stroke-width="4"/><text x="360" y="620" text-anchor="middle" font-size="28" fill="#f5f1e8" font-family="serif">反思差異</text><circle cx="430" cy="300" r="78" fill="#17333b" stroke="#d5aa4b" stroke-width="4"/><text x="430" y="310" text-anchor="middle" font-size="28" fill="#f5f1e8" font-family="serif">再次求證</text><path d="M870 205 Q1020 220 1090 285 M1225 375 Q1280 470 1250 535 M1160 660 Q1010 735 900 745 M700 745 Q530 720 425 650 M350 535 Q320 420 390 340 M505 250 Q650 1