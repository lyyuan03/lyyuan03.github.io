<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#171d18"/>
<text x="80" y="105" fill="#d8b673" font-family="serif" font-size="56" font-weight="700">感應不是定論：讓現實加入判斷</text>
<g font-family="serif" font-size="31" text-anchor="middle">
<circle cx="305" cy="450" r="112" fill="#242b25" stroke="#a58254" stroke-width="4"/><text x="305" y="440" fill="#f3eee3">感應／訊息</text><text x="305" y="482" fill="#cfc6b6" font-size="25">先記錄，不急著定義</text>
<circle cx="650" cy="450" r="112" fill="#242b25" stroke="#a58254" stroke-width="4"/><text x="650" y="440" fill="#f3eee3">思辨</text><text x="650" y="482" fill="#cfc6b6" font-size="25">拆解條件與動機</text>
<circle cx="995" cy="450" r="112" fill="#242b25" stroke="#606330" stroke-width="4"/><text x="995" y="440" fill="#f3eee3">現實驗證</text><text x="995" y="482" fill="#cfc6b6" font-size="25">行動、結果、時間</text>
<circle cx="1340" cy="450" r="112" fill="#242b25" stroke="#606330" stroke-width="4"/><text x="1340" y="440" fill="#f3eee3">修正理解</text><text x="1340" y="482" fill="#cfc6b6" font-size="25">保留可被推翻的空間</text>
</g>
<path d="M420 450h110M765 450h110M1110 450h110" stroke="#d8b673" stroke-width="7" stroke-linecap="round"/>
<path d="M1218 650C980 790 560 790 325 650" fill="none" stroke="#8f805f" stroke-width="5" stroke-dasharray="12 14"/>
<path d="M330 650l20 2-11-18" fill="#8f805f"/>
<text x="800" y="760" text-anchor="middle" fill="#d9d2c3" font-family="serif" font-size="29">你可以相信一個訊息，也必須保留重新理解它的能力。</text>
</svg>