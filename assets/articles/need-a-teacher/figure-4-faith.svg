<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d2730"/><stop offset="1" stop-color="#07151a"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#bg)"/><text x="80" y="100" font-size="56" fill="#f3d68a" font-family="serif" font-weight="700">利用神明 vs 真正的信仰</text><rect x="90" y="180" width="650" height="570" rx="30" fill="#111b20" stroke="#87939a"/><rect x="860" y="180" width="650" height="570" rx="30" fill="#142b24" stroke="#d5aa4b"/><text x="415" y="250" text-anchor="middle" font-size="40" fill="#e5e1d7" font-family="serif">利用神明</text><text x="1185" y="250" text-anchor="middle" font-size="40" fill="#f2d381" font-family="serif">真正的信仰</text><text x="160" y="335" font-size="31" fill="#eae5dc" font-family="serif">求答案　求保護　求力量</text><text x="160" y="400" font-size="31" fill="#eae5dc" font-family="serif">求預測　求靠山　求保證</text><text x="160" y="510" font-size="34" fill="#bfc5c7" font-family="serif">「神明能給我什麼？」</text><text x="415" y="650" text-anchor="middle" font-size="48" fill="#d4d7d8" font-family="serif">依賴</text><text x="930" y="335" font-size="31" fill="#f0eadf" font-family="serif">接受教導　修正自己</text><text x="930" y="400" font-size="31" fill="#f0eadf" font-family="serif">承擔選擇　轉化性格　改變生活</text><text x="930" y="510" font-size="34" fill="#f3d68a" font-family="serif">「我因為相信祂，成為什麼樣的人？」</text><text x="1185" y="650" text-anchor="middle" font-size="48" fill="#f3d68a" font-family="serif">轉化</text></svg>