<text x="80" y="110" fill="#d8b673" font-family="serif" font-size="56" font-weight="700">老師，也可能以不同形式出現</text>
<text x="83" y="185" fill="#d9d2c3" font-family="serif" font-size="31">拉瑪那尊者把阿魯那佳拉聖山視為老師、真我與神。</text>
<text x="90" y="330" fill="#f3eee3" font-family="serif" font-size="40">形式可以不同</text>
<text x="90" y="390" fill="#cfc6b6" font-family="serif" font-size="29">人、山、神、生命中的一次翻轉，都可能成為引導。</text>
<text x="90" y="475" fill="#f3eee3" font-family="serif" font-size="40">但「被引導」這件事不能省略</text>
