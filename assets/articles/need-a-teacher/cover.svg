<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d2730"/><stop offset="1" stop-color="#07151a"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d88b"/><stop offset="1" stop-color="#b78532"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#bg)"/><path d="M0 720 L220 430 L360 610 L560 320 L760 590 L980 360 L1200 560 L1390 390 L1600 680 L1600 900 L0 900 Z" fill="#173b43" opacity=".8"/><path d="M0 810 L320 560 L500 700 L760 510 L1040 720 L1320 540 L1600 760 L1600 900 L0 900 Z" fill="#0e2a31"/><circle cx="1260" cy="180" r="62" fill="#f4d88b" opacity=".9"/><text x="90" y="155" font-size="86" fill="#f4f1e8" font-family="serif" font-weight="700">走靈修，到底需不需要老師？</text><text x="95" y="240" font-size="40" fill="#d9c48b" font-family="serif">從被帶領、求證、信仰，到最後學會自己走</text><path d="M170 735 C420 650, 700 680, 940 540 C1120 430, 1270 350, 1450 250" fill="none" stroke="#d6aa52" stroke-width="10" stroke-linecap="round"/><circle cx="170" cy="735" r="15" fill="#f1d28b"/><circle cx="1450" cy="250" r="15" fill="#f1d28b"/><text x="95" y="820" font-size="34" fill="#f2efe7" font-family="serif">初期有人帶路，後來回到內在。</text><text x="1390" y="850" text-anchor="end" font-size="28" fill="#d9c48b" font-family="serif">宇色 Osel</text></svg>