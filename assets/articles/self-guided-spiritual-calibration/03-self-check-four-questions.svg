<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F3EA"/><stop offset="1" stop-color="#E2EBE5"/></linearGradient></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<text x="80" y="84" font-family="Source Han Serif TC, Noto Serif TC, serif" font-size="34" font-weight="700" fill="#6E583A">靈性自修者的四個自我檢驗問題</text>
<g font-family="Source Han Serif TC, Noto Serif TC, serif">
<rect x="80" y="145" width="480" height="180" rx="26" fill="#fff" stroke="#D6C098" stroke-width="3"/>
<circle cx="128" cy="192" r="25" fill="#B59A65"/><text x="128" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text>
<text x="175" y="190" font-size="25" font-weight="700" fill="#665944">我真正經歷了什麼？</text><text x="175" y="234" font-size="20" fill="#756C61">先描述現象，不急著命名來源。</text><text x="175" y="270" font-size="20" fill="#756C61">夢、感受、影像、訊息，先各自留下。</text>
<rect x="640" y="145" width="480" height="180" rx="26" fill="#fff" stroke="#9BB2A5" stroke-width="3"/>
<circle cx="688" cy="192" r="25" fill="#6F8F80"/><text x="688" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text>
<text x="735" y="190" font-size="25" font-weight="700" fill="#557568">我現在怎麼解釋它？</text><text x="735" y="234" font-size="20" fill="#68716C">辨認自己的期待、恐懼與既有信念。</text><text x="735" y="270" font-size="20" fill="#68716C">不要把詮釋直接當成事實。</text>
<rect x="80" y="380" width="480" height="180" rx="26" fill="#fff" stroke="#9BB2A5" stroke-width="3"/>
<circle cx="128" cy="427" r="25" fill="#6F8F80"/><text x="128" y="435" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text>
<text x="175" y="425" font-size="25" font-weight="700" fill="#557568">還有其他可能嗎？</text><text x="175" y="469" font-size="20" fill="#68716C">允許心理、身體、情境與靈性解釋並存。</text><text x="175" y="505" font-size="20" fill="#68716C">成熟不是否定，而是保留比較。</text>
<rect x="640" y="380" width="480" height="180" rx="26" fill="#fff" stroke="#D6C098" stroke-width="3"/>
<circle cx="688" cy="427" r="25" fill="#B59A65"/><text x="688" y="435" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text>
<text x="735" y="425" font-size="25" font-weight="700" fill="#665944">什麼會讓我願意修正？</text><text x="735" y="469" font-size="20" fill="#756C61">先替自己的答案留下出口。</text><text x="735" y="505" font-size="20" fill="#756C61">沒有可能被推翻的信念，也無從檢驗。</text>
<text x="600" y="625" text-anchor="middle" font-size="22" font-weight="700" fill="#6A6258">自我檢驗不是懷疑一切，而是讓理解有能力被更新。</text>
</g></svg>