<text x="800" y="145" text-anchor="middle" fill="#725733" font-size="60" font-family="Source Han Serif TC,Noto Serif TC,serif" font-weight="600">《靈性善終》的三個轉化階段</text>
<path d="M280 455C470 360 590 545 790 445S1115 505 1320 420" fill="none" stroke="url(#flow)" stroke-width="22" stroke-linecap="round" opacity=".72"/>
<circle cx="360" cy="430" r="128" fill="#FFFDF9" stroke="#D0A15E" stroke-width="5"/>
<circle cx="800" cy="430" r="128" fill="#FFFDF9" stroke="#86A896" stroke-width="5"/>
<circle cx="1240" cy="430" r="128" fill="#FFFDF9" stroke="#88A6B8" stroke-width="5"/>
<text x="360" y="420" text-anchor="middle" fill="#9B6B2F" font-size="50" font-family="Source Han Serif TC,Noto Serif TC,serif" font-weight="600">混亂</text>
<text x="360" y="475" text-anchor="middle" fill="#6F675E" font-size="28" font-family="Source Han Serif TC,Noto Serif TC,serif">熟悉秩序鬆動</text>
<text x="800" y="420" text-anchor="middle" fill="#537568" font-size="50" font-family="Source Han Serif TC,Noto Serif TC,serif" font-weight="600">臣服</text>
<text x="800" y="475" text-anchor="middle" fill="#6F675E" font-size="28" font-family="Source Han Serif TC,Noto Serif TC,serif">停止抵抗實相</text>
<text x="1240" y="420" text-anchor="middle" fill="#58778A" font-size="50" font-family="Source Han Serif TC,Noto Serif TC,serif" font-weight="600">超越</text>
<text x="1240" y="475" text-anchor="middle" fill="#6F675E" font-size="28" font-family="Source Han Serif TC,Noto Serif TC,serif">自我邊界鬆開</text>
<text x="800" y="650" text-anchor="middle" fill="#675E53" font-size="30" font-family="Source Han Serif TC,Noto Serif TC,serif">從心智自我的解構，走向比個人生命故事更深的「存有本源」</text>
