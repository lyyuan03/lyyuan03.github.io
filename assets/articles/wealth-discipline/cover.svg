<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="607" viewBox="0 0 1080 607" role="img" aria-labelledby="title desc"><title id="title">致富的定力文章封面</title><desc id="desc">日式雜誌風格，暖米色與橘紅幾何圖形，中央為致富的定力書封示意。</desc><defs><filter id="blur"><feGaussianBlur stdDeviation="9"/></filter><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efe6d7"/><stop offset="1" stop-color="#d8d7c5"/></linearGradient></defs><rect width="1080" height="607" fill="url(#paper)"/><g opacity=".38" filter="url(#blur)"><rect x="0" y="0" width="1080" height="607" fill="#32412f"/><g fill="#d6c7a4"><rect x="55" y="42" width="72" height="510"/><rect x="143" y="64" width="53" height="488"/><rect x="213" y="34" width="84" height="518"/><rect x="316" y="88" width="64" height="464"/><rect x="398" y="44" width="78" height="508"/><rect x="500" y="73" width="51" height="479"/><rect x="568" y="27" width="91" height="525"/><rect x="682" y="61" width="62" height="491"/><rect x="761" y="39" width="76" height="513"/><rect x="859" y="74" width="55" height="478"/><rect x="933" y="45" width="92" height="507"/></g></g><rect x="0" y="0" width="1080" height="607" fill="#0d170d" opacity=".22"/><g transform="translate(590 55)"><rect width="360" height="497" rx="3" fill="#f5ead9" stroke="#d5b07d" stroke-width="2"/><g fill="#e55237"><circle cx="75" cy="70" r="64"/><circle cx="170" cy="60" r="56"/><circle cx="275" cy="76" r="71"/><circle cx="106" cy="145" r="54"/><circle cx="223" cy="151" r="68"/></g><g fill="#f1b361" opacity=".85"><circle cx="61" cy="176" r="41"/><circle cx="304" cy="171" r="44"/></g><rect x="0" y="214" width="360" height="283" fill="#f3d995" opacity=".74"/><text x="180" y="295" text-anchor="middle" font-family="Noto Serif TC, serif" font-weight="700" font-size="55" fill="#151515">致富的定力</text><text x="180" y="334" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="20" fill="#352f28">一年只要 10 小時，就能穩賺 18%</text><text x="28" y="385" font-family="Noto Serif TC, serif" font-size="21" fill="#3e342b">財富自由，不是擁有更多，</text><text x="28" y="417" font-family="Noto Serif TC, serif" font-size="21" fill="#3e342b">而是渴望更少。</text><text x="28" y="457" font-family="Noto Serif TC, serif" font-size="18" fill="#5d4b3a">陳韋峰 著</text></g><g fill="#fff8ec"><text x="76" y="119" font-family="Noto Serif TC, serif" font-size="24" letter-spacing="3">市場永遠不缺故事；</text><text x="76" y="163" font-family="Noto Serif TC, serif" font-size="24" letter-spacing="3">真正稀缺的，是一顆清醒的心。</text><line x1="76" y1="193" x2="465" y2="193" stroke="#d4b17d" stroke-width="2"/><text x="76" y="292" font-family="Noto Serif TC, serif" font-size="31" font-weight="700">投資，最後修的不是股票，</text><text x="76" y="339" font-family="Noto Serif TC, serif" font-size="31" font-weight="700">而是自己。</text><text x="76" y="426" font-family="Noto Sans TC, sans-serif" font-size="17" letter-spacing="4" fill="#d8c29c">靈元院｜思・讀物</text></g></svg>