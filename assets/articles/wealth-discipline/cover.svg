<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">致富的定力書封</title><desc id="desc">以暖米色、橘紅色幾何圖形重現致富的定力書封，確保手機縮圖能完整辨識書名。</desc><rect width="720" height="1080" fill="#F4E8D8"/><g fill="#E95436"><circle cx="110" cy="120" r="100"/><circle cx="280" cy="100" r="82"/><circle cx="495" cy="125" r="110"/><circle cx="635" cy="100" r="72"/><circle cx="205" cy="260" r="82"/><circle cx="420" cy="260" r="105"/><circle cx="620" cy="270" r="88"/></g><g fill="#F2B15A" opacity=".9"><circle cx="92" cy="300" r="58"/><circle cx="540" cy="340" r="72"/></g><g fill="#F9D8CC" opacity=".9"><circle cx="330" cy="190" r="62"/><circle cx="650" cy="220" r="50"/></g><rect y="410" width="720" height="670" fill="#F2D79A" opacity=".78"/><circle cx="360" cy="405" r="78" fill="#EFE3CC" stroke="#D5B37B" stroke-width="10"/><text x="360" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="86" fill="#C9A36C">$</text><text x="360" y="585" text-anchor="middle" font-family="Noto Serif TC, serif" font-size="92" font-weight="700" fill="#17130F">致富的定力</text><text x="360" y="650" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="34" font-weight="700" fill="#2C261F">一年只要 <tspan fill="#D84A32">10 小時</tspan>，就能穩賺 <tspan fill="#D84A32">18%</tspan></text><line x1="80" y1="690" x2="640" y2="690" stroke="#9C815A" stroke-width="3"/><text x="82" y="765" font-family="Noto Serif TC, serif" font-size="38" font-weight="700" fill="#32291F">財富自由，</text><text x="82" y="820" font-family="Noto Serif TC, serif" font-size="38" font-weight="700" fill="#32291F">不是擁有更多，而是渴望更少。</text><text x="82" y="895" font-family="Noto Serif TC, serif" font-size="36" font-weight="700" fill="#32291F">當定力勝過欲望，</text><text x="82" y="950" font-family="Noto Serif TC, serif" font-size="36" font-weight="700" fill="#32291F">就能建立一生受用的投資節奏。</text><text x="82" y="1025" font-family="Noto Serif TC, serif" font-size="30" fill="#5E4935">陳韋峰 著</text></svg>