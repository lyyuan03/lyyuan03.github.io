<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="420" viewBox="0 0 1536 420"><defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8efe4"/><stop offset=".55" stop-color="#e8d5bb"/><stop offset="1" stop-color="#d9bd90"/></linearGradient><radialGradient id="lamp"><stop offset="0" stop-color="#fff9d9" stop-opacity="1"/><stop offset="1" stop-color="#c88d39" stop-opacity="0"/></radialGradient></defs><rect width="1536" height="420" fill="url(#bg3)"/><circle cx="315" cy="210" r="175" fill="url(#lamp)"/><g fill="none" stroke="#765638" stroke-width="5" opacity=".82"><path d="M110 322h430M150 322v38h350v-38M205 322v-92h240v92M250 230v-80h150v80"/><circle cx="325" cy="130" r="34"/><path d="M285 184c24-35 56-35 80 0M325 164v50M270 280h110M255 305h140"/><path d="M155 235c30-26 60-26 90 0M405 235c30-26 60-26 90 0"/></g><g fill="#a77a3f"><ellipse cx="194" cy="260" rx="10" ry="22"/><ellipse cx="456" cy="260" rx="10" ry="22"/></g><text x="680" y="118" fill="#4a3322" font-size="52" font-family="Noto Serif TC,serif" font-weight="700">符合天命的路，不是毫無阻礙</text><text x="680" y="200" fill="#5b4835" font-size="31" font-family="Noto Serif TC,serif">而是在困難裡，你依然知道：</text><text x="680" y="250" fill="#5b4835" font-size="34" font-family="Noto Serif TC,serif" font-weight="700">這條路值得繼續走下去。</text><line x1="680" y1="292" x2="1370" y2="292" stroke="#a98555" stroke-width="2"/><text x="680" y="345" fill="#7c664f" font-size="20" font-family="Noto Sans TC,sans-serif" letter-spacing="3">當你願意先走，生命才會開始為你排序。</text></svg>