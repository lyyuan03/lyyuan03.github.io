<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#050807" stop-opacity=".96"/>
    <stop offset=".36" stop-color="#090d0b" stop-opacity=".84"/>
    <stop offset=".66" stop-color="#111511" stop-opacity=".38"/>
    <stop offset="1" stop-color="#020403" stop-opacity=".28"/>
  </linearGradient>
  <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
    <stop offset=".48" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".72"/>
  </linearGradient>
  <radialGradient id="warm" cx="72%" cy="47%" r="46%">
    <stop offset="0" stop-color="#c89143" stop-opacity=".26"/>
    <stop offset="1" stop-color="#c89143" stop-opacity="0"/>
  </radialGradient>
  <filter id="cinema" x="-10%" y="-10%" width="120%" height="120%">
    <feColorMatrix type="matrix" values="
      0.92 0 0 0 0
      0 0.83 0 0 0
      0 0 0.67 0 0
      0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="gamma" amplitude="1.05" exponent=".92" offset="0"/>
      <feFuncG type="gamma" amplitude="1.00" exponent=".98" offset="0"/>
      <feFuncB type="gamma" amplitude=".92" exponent="1.06" offset="0"/>
    </feComponentTransfer>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<rect width="1600" height="900" fill="#070a08"/>
<image href="data:image/jpeg;base64," x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice" filter="url(#cinema)"/>
<rect width="1600" height="900" fill="url(#warm)"/>
<rect width="1600" height="900" fill="url(#shade)"/>
<rect width="1600" height="900" fill="url(#bottom)"/>

<!-- subtle poster texture -->
<g opacity=".10">
  <rect x="0" y="0" width="1600" height="900" fill="#000"/>
  <path d="M0 130H1600M0 450H1600M0 770H1600" stroke="#fff" stroke-opacity=".05"/>
</g>

<!-- editorial marker -->
<rect x="112" y="116" width="8" height="172" rx="4" fill="#c9a05a"/>
<text x="148" y="142" fill="#d9c5a0" font-size="26" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" letter-spacing="5">靈元院文選｜靈修辨證</text>

<!-- title -->
<text x="146" y="248" fill="#f5f1e8" font-family="'Noto Serif TC','PingFang TC','Microsoft JhengHei',serif" font-size="68" font-weight="700">
  <tspan x="146" dy="0">怎麼判斷一位老師，</tspan>
  <tspan x="146" dy="92" fill="#d6b270">真的有祈福與加持</tspan>
  <tspan x="146" dy="92">的能力？</tspan>
</text>

<text x="150" y="575" fill="#d9d4c8" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="28" letter-spacing="2">
  名氣、儀式、神通之外，你還能看什麼？
</text>

<!-- bottom badge -->
<g transform="translate(148 682)">
  <rect width="232" height="52" rx="26" fill="#0b0e0c" fill-opacity=".78" stroke="#b89457" stroke-opacity=".72"/>
  <text x="116" y="34" text-anchor="middle" fill="#e7d5b3" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="21" letter-spacing="3">祈福與加持</text>
</g>

<!-- cinematic edge vignette -->
<rect x="14" y="14" width="1572" height="872" rx="12" fill="none" stroke="#cab17b" stroke-opacity=".16" stroke-width="2"/>
</svg>