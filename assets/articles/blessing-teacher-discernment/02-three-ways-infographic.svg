<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#19261f"/><stop offset="1" stop-color="#303829"/></linearGradient></defs><rect width="1600" height="1050" fill="url(#bg)"/>
<text x="800" y="98" text-anchor="middle" fill="#eadfc9" font-family="serif" font-size="58" font-weight="700">祈福與加持，進入一個人的三種方式</text><text x="800" y="150" text-anchor="middle" fill="#bba986" font-family="sans-serif" font-size="26">外在形式愈少，愈考驗修行者本身的狀態</text><path d="M265 530 H1335" stroke="#8d7b58" stroke-width="4" opacity=".6"/>
<g font-family="sans-serif"><rect x="95" y="260" width="410" height="560" rx="28" fill="#22332a" stroke="#8f7a52" stroke-width="2"/><circle cx="300" cy="382" r="76" fill="#a58254" opacity=".25"/><path d="M270 386 q30 -42 60 0 v70 h-60z" fill="#d3b678" opacity=".8"/><circle cx="300" cy="348" r="22" fill="#d3b678"/><text x="300" y="515" text-anchor="middle" fill="#efe5d2" font-size="40" font-weight="700">接觸</text><text x="300" y="575" text-anchor="middle" fill="#cfc1a6" font-size="25">灑淨、按頂、儀式中的身體接觸</text><text x="300" y="620" text-anchor="middle" fill="#cfc1a6" font-size="25">最容易辨識，也最容易產生體感</text><text x="300" y="700" text-anchor="middle" fill="#d6bb7b" font-size="28">重點：儀式是否專注、心神是否收攝</text>
<rect x="595" y="260" width="410" height="560" rx="28" fill="#22332a" stroke="#8f7a52" stroke-width="2"/><circle cx="800" cy="382" r="76" fill="#a58254" opacity=".25"/><path d="M747 365 h106 a20 20 0 0 1 20 20 v50 a20 20 0 0 1 -20 20 h-40 l-28 28 5-28 h-43 a20 20 0 0 1 -20-20 v-50 a20 20 0 0 1 20-20z" fill="#d3b678" opacity=".8"/><text x="800" y="515" text-anchor="middle" fill="#efe5d2" font-size="40" font-weight="700">言語</text><text x="800" y="575" text-anchor="middle" fill="#cfc1a6" font-size="25">一句話，也可能成為加持</text><text x="800" y="620" text-anchor="middle" fill="#cfc1a6" font-size="25">關鍵在說話者的心念與當下狀態</text><text x="800" y="700" text-anchor="middle" fill="#d6bb7b" font-size="28">重點：話進到心裡，能不能讓糾纏鬆開</text>
<rect x="1095" y="260" width="410" height="560" rx="28" fill="#22332a" stroke="#8f7a52" stroke-width="2"/><circle cx="1300" cy="382" r="76" fill="#a58254" opacity=".25"/><path d="M1248 390 q52 -58 104 0 q-52 45 -104 0z" fill="none" stroke="#d3b678" stroke-width="12"/><circle cx="1300" cy="390" r="16" fill="#d3b678"/><text x="1300" y="515" text-anchor="middle" fill="#efe5d2" font-size="40" font-weight="700">靜默</text><text x="1300" y="575" text-anchor="middle" fill="#cfc1a6" font-size="25">不碰你，也不需要講道理</text><text x="1300" y="620" text-anchor="middle" fill="#cfc1a6" font-size="25">可能只是一個眼神、一段安靜</text><text x="1300" y="700" text-anchor="middle" fill="#d6bb7b" font-size="28">重點：形式最少，最直接看見修持</text></g>
<text x="800" y="925" text-anchor="middle" fill="#e6d7bb" font-family="serif" font-size="34">接觸 → 言語 → 靜默</text><text x="800" y="972" text-anchor="middle" fill="#b8a687" font-family="sans-serif" font-size="24">不要只看形式有多盛大；看這股力量有沒有真的進到人的心裡。</text></svg>