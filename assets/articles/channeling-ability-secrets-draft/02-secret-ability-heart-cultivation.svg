<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="能力、心性、修行，是三個不同層次">
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF5EA"/><stop offset="1" stop-color="#F2EBDD"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBE5"/><stop offset="1" stop-color="#86A69D"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#paper)"/><circle cx="1460" cy="92" r="60" fill="#D9B66C" opacity=".64"/>
<text x="800" y="84" text-anchor="middle" fill="#755C3B" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="34">第二個你不知道的秘密</text>
<text x="800" y="154" text-anchor="middle" fill="#5F4A31" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="58" font-weight="700">能力、心性、修行，是三個不同層次</text>
<text x="800" y="205" text-anchor="middle" fill="#6F5B42" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="30">它們有關，但不能直接畫上等號</text>
<g font-family="Noto Sans TC,sans-serif" text-anchor="middle">
<rect x="70" y="285" width="450" height="355" rx="28" fill="#FBF8F2" stroke="#CCB98F" stroke-width="2.5"/><text x="295" y="350" fill="#674F36" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="42" font-weight="700">能力</text><text x="295" y="395" fill="#756B5E" font-size="22">是一種感知與接收的天賦</text><circle cx="170" cy="500" r="68" fill="#E8EFEA"/><text x="170" y="492" fill="#5F786F" font-size="25" font-weight="700">感應敏銳</text><text x="170" y="530" fill="#6E716B" font-size="18">察覺變化</text><circle cx="295" cy="500" r="68" fill="#F3E7CF"/><text x="295" y="492" fill="#8A734D" font-size="25" font-weight="700">接收訊息</text><text x="295" y="530" fill="#71675A" font-size="18">得到感知</text><circle cx="420" cy="500" r="68" fill="#E8EFEA"/><text x="420" y="492" fill="#5F786F" font-size="25" font-weight="700">可能說中</text><text x="420" y="530" fill="#6E716B" font-size="18">具體事情</text>
<path d="M535 465h55" stroke="#B99B61" stroke-width="6"/><path d="M590 465l-22-14v28z" fill="#B99B61"/>
<rect x="575" y="285" width="450" height="355" rx="28" fill="#FBF8F2" stroke="#B7C8BF" stroke-width="2.5"/><text x="800" y="350" fill="#55746B" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="42" font-weight="700">心性</text><text x="800" y="395" fill="#68756F" font-size="22">是一個人的內在品質</text><circle cx="675" cy="500" r="68" fill="#F4E7C9"/><text x="675" y="500" fill="#A17E43" font-size="27" font-weight="700">誠實</text><circle cx="800" cy="500" r="68" fill="#E7EFEA"/><text x="800" y="500" fill="#5F786F" font-size="27" font-weight="700">穩定</text><circle cx="925" cy="500" r="68" fill="#E7EFEA"/><text x="925" y="485" fill="#5F786F" font-size="23" font-weight="700">不被欲望</text><text x="925" y="520" fill="#5F786F" font-size="23" font-weight="700">牽著走</text>
<path d="M1040 465h55" stroke="#7E9F95" stroke-width="6"/><path d="M1095 465l-22-14v28z" fill="#7E9F95"/>
<rect x="1080" y="285" width="450" height="355" rx="28" fill="#FBF8F2" stroke="#AFC6BD" stroke-width="2.5"/><text x="1305" y="350" fill="#4F7066" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="42" font-weight="700">修行</text><text x="1305" y="395" fill="#68756F" font-size="22">是一條持續覺察與轉化的路</text><circle cx="1180" cy="500" r="68" fill="#E7EFEA"/><text x="1180" y="500" fill="#5F786F" font-size="25" font-weight="700">看見自己</text><circle cx="1305" cy="500" r="68" fill="#F3E7CF"/><text x="1305" y="500" fill="#8A734D" font-size="25" font-weight="700">持續轉化</text><circle cx="1430" cy="500" r="68" fill="#E7EFEA"/><text x="1430" y="500" fill="#5F786F" font-size="25" font-weight="700">走向清明</text>
</g>
<text x="800" y="700" text-anchor="middle" fill="#65533C" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="29">通靈強，不代表心性高；心性高，也不等於一定有通靈。</text>
<rect x="520" y="733" width="560" height="58" rx="20" fill="#F5E9D1" stroke="#C7A565"/><text x="800" y="771" text-anchor="middle" fill="#725938" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="27" font-weight="700">修行要走深，心性一定要提升。</text>
<path d="M0 790C220 745 405 805 605 770c205-36 365 42 565 8 163-28 282-18 430-48V900H0Z" fill="url(#sea)" opacity=".55"/>
</svg>