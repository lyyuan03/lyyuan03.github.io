<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="高層次的靈性，最後都會把人帶回自己">
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF5EA"/><stop offset="1" stop-color="#F2EBDD"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBE5"/><stop offset="1" stop-color="#86A69D"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#paper)"/><circle cx="1460" cy="92" r="60" fill="#D9B66C" opacity=".64"/>
<text x="800" y="84" text-anchor="middle" fill="#755C3B" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="34">第六個你不知道的秘密</text>
<text x="800" y="154" text-anchor="middle" fill="#5F4A31" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="56" font-weight="700">高層次的靈性，最後都會把人帶回自己</text>
<text x="800" y="205" text-anchor="middle" fill="#6F5B42" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="29">別人的神通是別人的事，你真正要顧好的，是自己的心</text>
<g font-family="Noto Sans TC,sans-serif" text-anchor="middle">
<circle cx="300" cy="480" r="190" fill="#F7F0E4" stroke="#D5C3A2" stroke-width="2.5"/><rect x="165" y="325" width="270" height="56" rx="22" fill="#EFE7D8"/><text x="300" y="363" fill="#755B38" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="31" font-weight="700">追著外在現象</text><text x="300" y="418" fill="#766B5D" font-size="20">注意力一直放在別人身上</text><circle cx="205" cy="515" r="58" fill="#E8EFEA"/><text x="205" y="520" fill="#5F786F" font-size="23" font-weight="700">誰準</text><circle cx="300" cy="515" r="58" fill="#F3E7CF"/><text x="300" y="508" fill="#8A734D" font-size="21" font-weight="700">誰有</text><text x="300" y="536" fill="#8A734D" font-size="21" font-weight="700">神通</text><circle cx="395" cy="515" r="58" fill="#E8EFEA"/><text x="395" y="520" fill="#5F786F" font-size="23" font-weight="700">誰看到</text>
<path d="M510 480h85" stroke="#B99B61" stroke-width="6"/><path d="M595 480l-22-14v28z" fill="#B99B61"/>
<circle cx="800" cy="480" r="200" fill="#F8F3E9" stroke="#B7C8BF" stroke-width="2.5"/><rect x="650" y="315" width="300" height="56" rx="22" fill="#E9F0EC"/><text x="800" y="353" fill="#4F7066" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="31" font-weight="700">回到自我探問</text><text x="800" y="410" fill="#68756F" font-size="20">把注意力轉回內在</text><text x="800" y="470" fill="#655F57" font-size="23">我為什麼執著？</text><text x="800" y="512" fill="#655F57" font-size="23">我在害怕什麼？</text><text x="800" y="554" fill="#655F57" font-size="23">我真正想要什麼？</text>
<path d="M1010 480h85" stroke="#7E9F95" stroke-width="6"/><path d="M1095 480l-22-14v28z" fill="#7E9F95"/>
<circle cx="1300" cy="480" r="190" fill="#F4EFE3" stroke="#AFC6BD" stroke-width="2.5"/><rect x="1165" y="325" width="270" height="56" rx="22" fill="#E7EFEA"/><text x="1300" y="363" fill="#4F7066" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="31" font-weight="700">內在安定</text><text x="1300" y="418" fill="#68756F" font-size="20">照見自己後，力量自然回來</text><circle cx="1205" cy="515" r="58" fill="#F3E7CF"/><text x="1205" y="520" fill="#8A734D" font-size="24" font-weight="700">清楚</text><circle cx="1300" cy="515" r="58" fill="#E7EFEA"/><text x="1300" y="520" fill="#5F786F" font-size="24" font-weight="700">穩定</text><circle cx="1395" cy="515" r="58" fill="#F3E7CF"/><text x="1395" y="520" fill="#8A734D" font-size="24" font-weight="700">自由</text></g>
<line x1="260" y1="700" x2="1340" y2="700" stroke="#C7B48B" stroke-width="2"/><circle cx="800" cy="700" r="6" fill="#B5965B"/>
<text x="800" y="754" text-anchor="middle" fill="#65533C" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="28">修行真正看的，不是你能知道多少，而是你成為了一個什麼樣的人。</text>
<path d="M0 790C220 745 405 815 605 775c205-41 365 46 565 8 163-31 282-18 430-49V900H0Z" fill="url(#sea)" opacity=".56"/>
</svg>