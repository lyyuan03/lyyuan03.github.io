<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="樂透、股票、考試，照出的其實是人的欲望">
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF5EA"/><stop offset="1" stop-color="#F2EBDD"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBE5"/><stop offset="1" stop-color="#86A69D"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#paper)"/><circle cx="1460" cy="92" r="60" fill="#D9B66C" opacity=".64"/>
<text x="800" y="84" text-anchor="middle" fill="#755C3B" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="34">第四個你不知道的秘密</text>
<text x="800" y="154" text-anchor="middle" fill="#5F4A31" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="56" font-weight="700">樂透、股票、考試，照出的其實是人的欲望</text>
<text x="800" y="205" text-anchor="middle" fill="#6F5B42" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="29">真正的問題，不是通靈能不能，而是你想用它做什麼</text>
<g font-family="Noto Sans TC,sans-serif" text-anchor="middle">
<rect x="60" y="285" width="460" height="360" rx="28" fill="#FBF8F2" stroke="#CCB98F" stroke-width="2.5"/><text x="290" y="345" fill="#674F36" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="36" font-weight="700">心裡真正想要的</text><text x="290" y="390" fill="#766B5D" font-size="20">看似不同，源自同一個心</text><circle cx="150" cy="505" r="68" fill="#E7EFEA"/><text x="150" y="500" fill="#5F786F" font-size="26" font-weight="700">少努力</text><text x="150" y="536" fill="#6E716B" font-size="17">不想那麼辛苦</text><circle cx="290" cy="505" r="68" fill="#F3E7CF"/><text x="290" y="500" fill="#8A734D" font-size="26" font-weight="700">快成功</text><text x="290" y="536" fill="#776C5E" font-size="17">更快看到結果</text><circle cx="430" cy="505" r="68" fill="#E7EFEA"/><text x="430" y="500" fill="#5F786F" font-size="26" font-weight="700">多得到</text><text x="430" y="536" fill="#6E716B" font-size="17">想拿更多好處</text>
<path d="M535 465h65" stroke="#B99B61" stroke-width="6"/><path d="M600 465l-22-14v28z" fill="#B99B61"/>
<rect x="570" y="285" width="460" height="360" rx="28" fill="#FBF8F2" stroke="#C9B991" stroke-width="2.5"/><text x="800" y="345" fill="#674F36" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="36" font-weight="700">把能力當工具</text><text x="800" y="390" fill="#766B5D" font-size="20">欲望驅使時，能力被拿來追結果</text><circle cx="660" cy="505" r="68" fill="#F3E7CF"/><text x="660" y="500" fill="#8A734D" font-size="26" font-weight="700">猜樂透</text><text x="660" y="536" fill="#776C5E" font-size="17">知道中獎號碼</text><circle cx="800" cy="505" r="68" fill="#E7EFEA"/><text x="800" y="500" fill="#5F786F" font-size="26" font-weight="700">看股票</text><text x="800" y="536" fill="#6E716B" font-size="17">預測漲跌趨勢</text><circle cx="940" cy="505" r="68" fill="#F3E7CF"/><text x="940" y="500" fill="#8A734D" font-size="26" font-weight="700">知道考題</text><text x="940" y="536" fill="#776C5E" font-size="17">取得答案與重點</text>
<path d="M1045 465h65" stroke="#7E9F95" stroke-width="6"/><path d="M1110 465l-22-14v28z" fill="#7E9F95"/>
<rect x="1080" y="285" width="460" height="360" rx="28" fill="#FBF8F2" stroke="#AFC6BD" stroke-width="2.5"/><text x="1310" y="345" fill="#4F7066" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="36" font-weight="700">最後會走向</text><text x="1310" y="390" fill="#68756F" font-size="20">看似得到，卻可能造成更深失衡</text><circle cx="1170" cy="505" r="68" fill="#E7EFEA"/><text x="1170" y="500" fill="#5F786F" font-size="25" font-weight="700">依賴答案</text><text x="1170" y="536" fill="#6E716B" font-size="17">失去自己判斷</text><circle cx="1310" cy="505" r="68" fill="#F3E7CF"/><text x="1310" y="500" fill="#8A734D" font-size="25" font-weight="700">放大貪念</text><text x="1310" y="536" fill="#776C5E" font-size="17">永遠不會滿足</text><circle cx="1450" cy="505" r="68" fill="#E7EFEA"/><text x="1450" y="500" fill="#5F786F" font-size="25" font-weight="700">忽略心性</text><text x="1450" y="536" fill="#6E716B" font-size="17">忘記真正功課</text></g>
<rect x="325" y="704" width="950" height="64" rx="22" fill="#F5E9D1" stroke="#C7A565"/><text x="800" y="746" text-anchor="middle" fill="#725938" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="29" font-weight="700">修行不是捷徑，而是看見自己為什麼一直想走捷徑。</text>
<path d="M0 785C220 742 405 812 605 774c205-39 365 44 565 7 163-30 282-18 430-48V900H0Z" fill="url(#sea)" opacity=".56"/>
</svg>