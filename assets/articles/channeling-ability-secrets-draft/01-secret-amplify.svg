<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="通靈只會放大你已經擁有的能力">
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF5EA"/><stop offset="1" stop-color="#F2EBDD"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBE5"/><stop offset="1" stop-color="#86A69D"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#paper)"/><circle cx="1460" cy="95" r="60" fill="#D9B66C" opacity=".65"/>
<text x="800" y="84" text-anchor="middle" fill="#755C3B" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="34">第一個你不知道的秘密</text>
<text x="800" y="154" text-anchor="middle" fill="#5F4A31" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="58" font-weight="700">通靈只會放大你已經擁有的能力</text>
<text x="800" y="205" text-anchor="middle" fill="#6F5B42" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="30">它不會讓一個人無中生有</text>
<rect x="80" y="278" width="500" height="350" rx="28" fill="#FBF8F2" stroke="#CCB98F" stroke-width="2.5"/>
<text x="330" y="335" text-anchor="middle" fill="#674F36" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="38" font-weight="700">現實基礎</text>
<text x="330" y="375" text-anchor="middle" fill="#766B5D" font-family="Noto Sans TC,sans-serif" font-size="21">這些是你原本就擁有的資源</text>
<g text-anchor="middle" font-family="Noto Sans TC,sans-serif">
<circle cx="180" cy="478" r="70" fill="#E9EFEA"/><text x="180" y="468" fill="#5F786F" font-size="31" font-weight="700">知識</text><text x="180" y="506" fill="#6E716B" font-size="18">累積資訊</text><text x="180" y="532" fill="#6E716B" font-size="18">拓展視野</text>
<circle cx="330" cy="478" r="70" fill="#F3E7CF"/><text x="330" y="468" fill="#8A734D" font-size="31" font-weight="700">經驗</text><text x="330" y="506" fill="#71675A" font-size="18">從生活學習</text><text x="330" y="532" fill="#71675A" font-size="18">建立判斷</text>
<circle cx="480" cy="478" r="70" fill="#E9EFEA"/><text x="480" y="468" fill="#5F786F" font-size="31" font-weight="700">訓練</text><text x="480" y="506" fill="#6E716B" font-size="18">持續練習</text><text x="480" y="532" fill="#6E716B" font-size="18">提升熟練</text></g>
<path d="M600 455h95" stroke="#C7A565" stroke-width="7" stroke-linecap="round"/><path d="M695 455l-25-17v34z" fill="#C7A565"/>
<circle cx="800" cy="455" r="135" fill="#F8F3E9" stroke="#C8B894" stroke-width="2.5"/><text x="800" y="427" text-anchor="middle" fill="#725938" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="39" font-weight="700">通靈放大</text><text x="800" y="475" text-anchor="middle" fill="#6D665C" font-family="Noto Sans TC,sans-serif" font-size="20">讓感知更敏銳</text><text x="800" y="507" text-anchor="middle" fill="#6D665C" font-family="Noto Sans TC,sans-serif" font-size="20">更容易接收到訊息</text>
<path d="M940 455h75" stroke="#84A79C" stroke-width="7" stroke-linecap="round"/><path d="M1015 455l-25-17v34z" fill="#84A79C"/>
<rect x="1040" y="278" width="480" height="350" rx="28" fill="#FBF8F2" stroke="#AFC6BD" stroke-width="2.5"/>
<text x="1280" y="335" text-anchor="middle" fill="#4F7066" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="38" font-weight="700">結果</text><text x="1280" y="375" text-anchor="middle" fill="#68756F" font-family="Noto Sans TC,sans-serif" font-size="21">在原有基礎上，看見更多可能</text>
<g text-anchor="middle" font-family="Noto Sans TC,sans-serif"><circle cx="1135" cy="478" r="70" fill="#E7EFEA"/><text x="1135" y="470" fill="#5E7D72" font-size="28" font-weight="700">判斷更細</text><text x="1135" y="510" fill="#6D786F" font-size="18">減少盲點</text><circle cx="1280" cy="478" r="70" fill="#F3E6C7"/><text x="1280" y="470" fill="#A88448" font-size="28" font-weight="700">理解更深</text><text x="1280" y="510" fill="#7A6B55" font-size="18">看懂脈絡</text><circle cx="1425" cy="478" r="70" fill="#E7EFEA"/><text x="1425" y="470" fill="#5E7D72" font-size="28" font-weight="700">選擇更準</text><text x="1425" y="510" fill="#6D786F" font-size="18">做出判斷</text></g>
<text x="800" y="672" text-anchor="middle" fill="#725938" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="30" font-weight="700">不能取代：讀書　｜　專業　｜　人格修煉</text>
<text x="800" y="724" text-anchor="middle" fill="#65533C" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="27">沒有現實基礎，訊息進來了，也未必看得懂。</text>
<path d="M0 750C220 700 400 775 600 730c210-48 360 55 560 8 165-39 286-26 440-64V900H0Z" fill="url(#sea)" opacity=".60"/><path d="M0 825c240-38 425 25 640-3 205-27 370 34 575 3 140-21 250-13 385-30v105H0Z" fill="#6F9188" opacity=".32"/>
</svg>