<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="所通之靈的層次，決定它關心什麼">
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF5EA"/><stop offset="1" stop-color="#F2EBDD"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBE5"/><stop offset="1" stop-color="#86A69D"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#paper)"/><circle cx="1460" cy="92" r="60" fill="#D9B66C" opacity=".64"/>
<text x="800" y="84" text-anchor="middle" fill="#755C3B" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="34">第三個你不知道的秘密</text>
<text x="800" y="154" text-anchor="middle" fill="#5F4A31" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="58" font-weight="700">所通之靈的層次，決定它關心什麼</text>
<text x="800" y="205" text-anchor="middle" fill="#6F5B42" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="30">不是所有「準」，都代表層次高</text>
<rect x="70" y="285" width="590" height="365" rx="28" fill="#FBF8F2" stroke="#D2BE98" stroke-width="2.5"/>
<rect x="195" y="305" width="340" height="56" rx="22" fill="#F0E2C8"/><text x="365" y="343" text-anchor="middle" fill="#755B38" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="33" font-weight="700">較低層次</text>
<text x="365" y="405" text-anchor="middle" fill="#766B5D" font-family="Noto Sans TC,sans-serif" font-size="21">多圍繞個人欲望、輸贏與控制</text>
<g text-anchor="middle" font-family="Noto Sans TC,sans-serif">
<circle cx="165" cy="515" r="66" fill="#F3E7CF"/><text x="165" y="510" fill="#8A734D" font-size="25" font-weight="700">求財</text><text x="165" y="544" fill="#776C5E" font-size="17">金錢利益</text>
<circle cx="300" cy="515" r="66" fill="#EAEFDF"/><text x="300" y="510" fill="#5F786F" font-size="25" font-weight="700">報明牌</text><text x="300" y="544" fill="#6E716B" font-size="17">追逐結果</text>
<circle cx="435" cy="515" r="66" fill="#F1DFD8"/><text x="435" y="510" fill="#8A625A" font-size="24" font-weight="700">控制感情</text><text x="435" y="544" fill="#776A67" font-size="17">操弄依賴</text>
<circle cx="570" cy="515" r="66" fill="#E8E3DA"/><text x="570" y="497" fill="#6B6258" font-size="21" font-weight="700">用恐懼</text><text x="570" y="529" fill="#6B6258" font-size="21" font-weight="700">綁住人</text></g>
<circle cx="800" cy="470" r="128" fill="#F8F3E9" stroke="#C7B895" stroke-width="2.5"/><text x="800" y="430" text-anchor="middle" fill="#725938" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="34" font-weight="700">關注點</text><text x="800" y="478" text-anchor="middle" fill="#5F4A31" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="31">比分辨「準不準」</text><text x="800" y="524" text-anchor="middle" fill="#5F4A31" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="31">更重要</text>
<rect x="940" y="285" width="590" height="365" rx="28" fill="#FBF8F2" stroke="#AFC6BD" stroke-width="2.5"/>
<rect x="1065" y="305" width="340" height="56" rx="22" fill="#E7EFEA"/><text x="1235" y="343" text-anchor="middle" fill="#4F7066" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="33" font-weight="700">較高層次</text>
<text x="1235" y="405" text-anchor="middle" fill="#68756F" font-family="Noto Sans TC,sans-serif" font-size="21">著眼內在成長、成熟與清明</text>
<g text-anchor="middle" font-family="Noto Sans TC,sans-serif">
<circle cx="1035" cy="515" r="66" fill="#E7EFEA"/><text x="1035" y="510" fill="#5F786F" font-size="24" font-weight="700">看見心性</text><text x="1035" y="544" fill="#6E716B" font-size="17">照見自己</text>
<circle cx="1170" cy="515" r="66" fill="#F3E7CF"/><text x="1170" y="510" fill="#8A734D" font-size="24" font-weight="700">提醒方向</text><text x="1170" y="544" fill="#776C5E" font-size="17">提供角度</text>
<circle cx="1305" cy="515" r="66" fill="#E7EFEA"/><text x="1305" y="510" fill="#5F786F" font-size="24" font-weight="700">幫助成熟</text><text x="1305" y="544" fill="#6E716B" font-size="17">承擔生命</text>
<circle cx="1440" cy="515" r="66" fill="#E7EFEA"/><text x="1440" y="510" fill="#5F786F" font-size="24" font-weight="700">回到平靜</text><text x="1440" y="544" fill="#6E716B" font-size="17">減少執著</text></g>
<text x="800" y="712" text-anchor="middle" fill="#65533C" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="27">越圍繞貪念與輸贏運作，越不能只因為準，就判定它很高。</text>
<path d="M0 755C220 710 405 800 605 752c205-49 365 54 565 8 163-38 282-24 430-58V900H0Z" fill="url(#sea)" opacity=".58"/>
</svg>