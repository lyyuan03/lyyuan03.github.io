<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="準確不等於層次高">
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF5EA"/><stop offset="1" stop-color="#F2EBDD"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBE5"/><stop offset="1" stop-color="#86A69D"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#paper)"/><circle cx="1460" cy="92" r="60" fill="#D9B66C" opacity=".64"/>
<text x="800" y="84" text-anchor="middle" fill="#755C3B" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="34">第五個你不知道的秘密</text>
<text x="800" y="154" text-anchor="middle" fill="#5F4A31" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="60" font-weight="700">「準」和「層次高」，一定要分開</text>
<text x="800" y="205" text-anchor="middle" fill="#6F5B42" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="30">能說中小事，和能不能帶人走向成熟，是兩回事</text>
<rect x="90" y="285" width="570" height="370" rx="28" fill="#FBF8F2" stroke="#CCB98F" stroke-width="2.5"/>
<text x="375" y="345" text-anchor="middle" fill="#674F36" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="38" font-weight="700">「準」是在看什麼？</text>
<text x="375" y="390" text-anchor="middle" fill="#766B5D" font-family="Noto Sans TC,sans-serif" font-size="21">具體資訊有沒有命中</text>
<g font-family="Noto Sans TC,sans-serif" text-anchor="middle">
<circle cx="205" cy="505" r="72" fill="#F3E7CF"/><text x="205" y="495" fill="#8A734D" font-size="27" font-weight="700">號碼</text><text x="205" y="535" fill="#776C5E" font-size="18">猜中明牌</text>
<circle cx="375" cy="505" r="72" fill="#E7EFEA"/><text x="375" y="495" fill="#5F786F" font-size="27" font-weight="700">結果</text><text x="375" y="535" fill="#6E716B" font-size="18">事情說中</text>
<circle cx="545" cy="505" r="72" fill="#F3E7CF"/><text x="545" y="495" fill="#8A734D" font-size="27" font-weight="700">預測</text><text x="545" y="535" fill="#776C5E" font-size="18">短期命中</text></g>
<circle cx="800" cy="470" r="118" fill="#F8F3E9" stroke="#C7B895" stroke-width="2.5"/><text x="800" y="440" text-anchor="middle" fill="#725938" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="32">不能直接</text><text x="800" y="487" text-anchor="middle" fill="#5F4A31" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="38" font-weight="700">畫上等號</text><text x="800" y="530" text-anchor="middle" fill="#756B5E" font-family="Noto Sans TC,sans-serif" font-size="19">準 ≠ 高層次</text>
<rect x="940" y="285" width="570" height="370" rx="28" fill="#FBF8F2" stroke="#AFC6BD" stroke-width="2.5"/>
<text x="1225" y="345" text-anchor="middle" fill="#4F7066" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="38" font-weight="700">「層次」是在看什麼？</text>
<text x="1225" y="390" text-anchor="middle" fill="#68756F" font-family="Noto Sans TC,sans-serif" font-size="21">它最後把人帶向哪裡</text>
<g font-family="Noto Sans TC,sans-serif" text-anchor="middle">
<circle cx="1055" cy="505" r="72" fill="#E7EFEA"/><text x="1055" y="495" fill="#5F786F" font-size="27" font-weight="700">自主</text><text x="1055" y="535" fill="#6E716B" font-size="18">減少依賴</text>
<circle cx="1225" cy="505" r="72" fill="#F3E7CF"/><text x="1225" y="495" fill="#8A734D" font-size="27" font-weight="700">成熟</text><text x="1225" y="535" fill="#776C5E" font-size="18">看見責任</text>
<circle cx="1395" cy="505" r="72" fill="#E7EFEA"/><text x="1395" y="495" fill="#5F786F" font-size="27" font-weight="700">清明</text><text x="1395" y="535" fill="#6E716B" font-size="18">回到自己</text></g>
<text x="800" y="706" text-anchor="middle" fill="#65533C" font-family="Source Han Serif TC,Noto Serif TC,serif" font-size="28">真正好的引導，會讓人更能面對人生，而不是越來越離不開答案。</text>
<path d="M0 755C220 710 405 800 605 752c205-49 365 54 565 8 163-38 282-24 430-58V900H0Z" fill="url(#sea)" opacity=".58"/>
</svg>