name: One-time update annual spend label

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-time-update-annual-spend-label.yml"

permissions:
  contents: write

concurrency:
  group: one-time-update-annual-spend-label
  cancel-in-progress: false

jobs:
  patch-member-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update annual spend card label
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("member-dashboard.html")
          text = path.read_text(encoding="utf-8")
          old = '<div class="stat-label">本年度重新累積</div>'
          new = '<div class="stat-label">晉升次年度【靈極會員】已累積</div>'
          if old not in text:
              raise SystemExit("Expected annual spend label not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-update-annual-spend-label.yml
          git add member-dashboard.html
          git commit -m "修改會員中心靈極累積標題"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
