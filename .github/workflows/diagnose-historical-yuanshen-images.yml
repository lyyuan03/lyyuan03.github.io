name: Diagnose Historical Yuanshen Image Sources
on:
  push:
    branches:
      - fix/historical-yuanshen-broken-inline-images-20261027
    paths:
      - '.github/workflows/diagnose-historical-yuanshen-images.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check exact four source URLs without exposing article content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error
          urls = {
            'photo_ai': 'https://d2ol7oe51mr4n9.cloudfront.net/user_3CC8OMVTj8bkUz71eKrO5BtBL9Y/27cce1b9-4809-4686-9ee6-f7fd273d90e4.png',
            'photo_original': 'https://d2ol7oe51mr4n9.cloudfront.net/user_3CC8OMVTj8bkUz71eKrO5BtBL9Y/b13e09e5-c7fb-49cc-8a62-cf6cfcbb1f15.jpg',
            'illustration_spirit': 'https://raw.githubusercontent.com/lyyuan03/lyyuan03.github.io/e4d6c7f19e09ebce143204736a84c002315befaa/assets/articles/historical-yuanshen-destiny-cultivation/01-spirit-body.jpg',
            'illustration_everyday': 'https://raw.githubusercontent.com/lyyuan03/lyyuan03.github.io/e4d6c7f19e09ebce143204736a84c002315befaa/assets/articles/historical-yuanshen-destiny-cultivation/02-everyday-cultivation.jpg'
          }
          failures = 0
          for label, url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; WebsiteImageAudit/1.0)','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'})
              with urllib.request.urlopen(req,timeout=20) as response:
                data=response.read(40)
                ct=response.headers.get('Content-Type','')
                size=response.headers.get('Content-Length','unknown')
                print(f'{label}: status={response.status} type={ct} size={size} magic={data[:8].hex()}')
                if response.status!=200 or not ct.startswith('image/'): failures += 1
            except Exception as exc:
              print(f'{label}: FAILED {type(exc).__name__}: {str(exc)[:120]}')
              failures += 1
          print(f'IMAGE_URL_FAILURE_COUNT={failures}')
          PY
