name: Clean yuanqin article image text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-yuanqin-images.yml'

permissions:
  contents: write

concurrency:
  group: clean-yuanqin-images-once
  cancel-in-progress: false

jobs:
  clean-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install OCR and image tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-chi-tra
          python -m pip install --disable-pip-version-check --quiet opencv-python-headless pytesseract pillow numpy

      - name: Remove text from all yuanqin article images
        shell: bash
        run: |
          set -euo pipefail
          python scripts/clean-yuanqin-images.py

      - name: Verify image files and publication state
        shell: bash
        run: |
          set -euo pipefail
          file assets/articles/yuanqin-debt-heart/*.webp
          grep -n 'status: "published"' article-yuanqin-debt-heart.js
          grep -n 'publishedAt:' article-yuanqin-debt-heart.js
          grep -n 'clean-text-1' article-yuanqin-debt-heart.js
          git diff --check

      - name: Remove one-time cleanup automation
        shell: bash
        run: |
          rm -f scripts/clean-yuanqin-images.py
          rm -f .github/workflows/clean-yuanqin-images.yml

      - name: Commit cleaned images and publish article
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Remove text from yuanqin article images and publish'
          git push origin main
