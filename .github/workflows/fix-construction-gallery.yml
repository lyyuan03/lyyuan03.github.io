name: Fix construction gallery images

on:
  push:
    paths:
      - '.github/workflows/fix-construction-gallery.yml'

permissions:
  contents: write

jobs:
  fix-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode real JPEG assets
        shell: bash
        run: |
          set -euo pipefail
          dir='assets/construction/2026-lineage-lamp'
          base64 -d "$dir/entrance-path-720.jpg.b64" > "$dir/entrance-path.jpg"
          base64 -d "$dir/garden-corridor-500.jpg.b64" > "$dir/garden-corridor.jpg"
          base64 -d "$dir/shrine-hall-500.jpg.b64" > "$dir/shrine-hall.jpg"
          file "$dir/entrance-path.jpg" "$dir/garden-corridor.jpg" "$dir/shrine-hall.jpg"

      - name: Replace gallery loader with direct JPEG URLs
        shell: bash
        run: |
          cat > construction-record-extra-images.js <<'JS'
          const params = new URLSearchParams(location.search);
          const activeId = params.get('id') || '';
          if (activeId === '2026-lineage-lamp-building-record') installExtraConstructionImages();

          function installExtraConstructionImages(){
            const style=document.createElement('style');
            style.textContent=`
              .construction-record-mode .construction-record-view .construction-extra-render{position:relative;margin:34px 0 40px;overflow:hidden;border:1px solid rgba(139,104,63,.24);background:rgba(165,130,84,.045)}
              .construction-record-mode .construction-record-view .construction-extra-render::after{display:none!important}
              .construction-record-mode .construction-record-view .construction-extra-render img{display:block;width:100%;height:auto;border:0!important;box-shadow:none!important;background:#d8d0c2}
              .construction-record-mode .construction-record-view .construction-extra-render figcaption{padding:13px 16px 15px;color:#725b43;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:12px;line-height:1.75;letter-spacing:.04em;border-top:1px solid rgba(139,104,63,.18)}
              @media(max-width:760px){.construction-record-mode .construction-record-view .construction-extra-render{margin:28px 0 32px}.construction-record-mode .construction-record-view .construction-extra-render figcaption{padding:11px 13px 13px;font-size:11px}}
            `;
            document.head.appendChild(style);

            const specs=[
              {id:'entrance-path',src:'assets/construction/2026-lineage-lamp/entrance-path.jpg?v=20260822-fixed-1',alt:'靈元院入口與石徑動線 3D 設計示意',caption:'入口與石徑動線｜由入口穿越植栽與木構廊架，逐步進入院區的空間設計示意。',anchor:/dizhi-render-exterior\.jpg/i},
              {id:'garden-corridor',src:'assets/construction/2026-lineage-lamp/garden-corridor.jpg?v=20260822-fixed-1',alt:'靈元院庭園與廊道 3D 設計示意',caption:'庭園與廊道｜木構建築、植栽與步道彼此銜接，呈現院區安定而內斂的行走尺度。',anchor:/dizhi-render-garden\.jpg/i},
              {id:'shrine-hall',src:'assets/construction/2026-lineage-lamp/shrine-hall.jpg?v=20260822-fixed-1',alt:'靈元院內部修持空間 3D 設計示意',caption:'內部修持空間｜以木格柵、柔和光線與水景構成沉靜的核心空間，作為未來修持與禮敬場域的設計想像。',heading:/(主殿|殿內|內殿|修持|神尊)/}
            ];

            function makeFigure(s){
              const f=document.createElement('figure');f.className='construction-extra-render';f.dataset.constructionExtra=s.id;
              const img=document.createElement('img');img.src=s.src;img.alt=s.alt;img.loading='lazy';img.decoding='async';
              const cap=document.createElement('figcaption');cap.textContent=s.caption;f.append(img,cap);return f;
            }
            function sectionEnd(h){let n=h.nextElementSibling,last=h;while(n&&!/^H2$/i.test(n.tagName)){last=n;n=n.nextElementSibling}return last}
            function ensure(){
              const article=document.querySelector(`.article-view[data-article-id="${CSS.escape(activeId)}"]`);const body=article?.querySelector('.article-body');if(!body)return false;
              specs.forEach(s=>{
                if(body.querySelector(`[data-construction-extra="${s.id}"]`))return;
                const f=makeFigure(s);
                if(s.anchor){const img=[...body.querySelectorAll('img')].find(i=>s.anchor.test(i.getAttribute('src')||''));if(img){(img.closest('figure')||img.closest('p')||img).after(f);return}}
                if(s.heading){const h=[...body.querySelectorAll('h2,h3')].find(x=>s.heading.test(x.textContent||''));if(h){sectionEnd(h).after(f);return}}
                body.appendChild(f);
              });
              return true;
            }
            ensure();setTimeout(ensure,350);setTimeout(ensure,1200);
            const root=document.getElementById('article-root')||document.documentElement;let queued=false;
            new MutationObserver(()=>{if(queued)return;queued=true;setTimeout(()=>{queued=false;ensure()},40)}).observe(root,{childList:true,subtree:true});
          }
          JS

      - name: Bust gallery script cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('articles.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/construction-record-extra-images.js?v=20260822-1','/construction-record-extra-images.js?v=20260822-fixed-2')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove broken temporary image files
        shell: bash
        run: |
          rm -f assets/construction/2026-lineage-lamp/entrance-path.webp \
                assets/construction/2026-lineage-lamp/garden-corridor.webp \
                assets/construction/2026-lineage-lamp/shrine-hall.webp

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles.html construction-record-extra-images.js assets/construction/2026-lineage-lamp/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix construction gallery images permanently'
            git push origin main
          fi
