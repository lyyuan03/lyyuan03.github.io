name: Publish concise love article practices (protected)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-love-concise-methods-20261115.yml
      - functions/publish-love-concise-methods-20261115.mjs
      - secure-imports/love-concise-four-methods-20261115.enc.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix functions ci
      - name: Update only the four daily practice paragraphs in protected Firestore body
        run: node functions/publish-love-concise-methods-20261115.mjs