name: Refine sponsor count once

on:
  push:
    branches:
      - fix/simple-sponsor-links-no-functions
    paths:
      - scripts/refine_sponsor_count_once.py
      - .github/workflows/refine-sponsor-count-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-sponsor-links-no-functions
          fetch-depth: 0
      - run: python3 scripts/refine_sponsor_count_once.py
      - run: |
          node --check membership-admin.js
          grep -q '優惠會員人數上限' membership-admin.js
          grep -q '已加入 ${used} 人' membership-admin.js
      - run: rm -f scripts/refine_sponsor_count_once.py .github/workflows/refine-sponsor-count-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refine sponsor member count wording"
          git push origin HEAD:fix/simple-sponsor-links-no-functions
