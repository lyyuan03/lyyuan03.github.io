# Trigger restoration after workflow registration.
name: Restore sponsor card before sync removal once

on:
  push:
    branches:
      - fix/restore-sponsor-card-before-sync-removal
    paths:
      - scripts/restore_sponsor_card_before_sync_removal_once.py
      - .github/workflows/restore-sponsor-card-before-sync-removal-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-sponsor-card-before-sync-removal
          fetch-depth: 0
      - run: python3 scripts/restore_sponsor_card_before_sync_removal_once.py
      - run: |
          node --check sponsor-checkout.js
          grep -q '名額與付款連結已同步' sponsor-checkout.js
          grep -q 'sponsor-offer-sync' sponsor-checkout.js
          grep -q '20260806-restore-sponsor-card-1' articles.html
      - run: rm -f scripts/restore_sponsor_card_before_sync_removal_once.py .github/workflows/restore-sponsor-card-before-sync-removal-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "restore sponsor card before sync text removal"
          git push origin HEAD:fix/restore-sponsor-card-before-sync-removal
