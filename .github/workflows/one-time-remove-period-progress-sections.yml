name: One-time remove member period and progress sections

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-time-remove-period-progress-sections.yml"

permissions:
  contents: write

concurrency:
  group: one-time-remove-period-progress-sections
  cancel-in-progress: false

jobs:
  patch-member-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove membership period and annual progress sections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("member-dashboard.html")
          text = path.read_text(encoding="utf-8")
          marker = "</style>"
          css = "\n/* hide removed member dashboard sections */\n.period-section,.progress-section{display:none!important}\n"
          if css.strip() in text:
              raise SystemExit("Sections already hidden")
          if marker not in text:
              raise SystemExit("Style closing tag not found")
          text = text.replace(marker, css + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-remove-period-progress-sections.yml
          git add member-dashboard.html
          git commit -m "移除會籍效期與本年度累積進度區塊"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
