name: Fix official Gmail sender once

on:
  push:
    branches:
      - feature/sponsor-activation-email
    paths:
      - scripts/fix_official_gmail_sender_once.py
      - .github/workflows/fix-official-gmail-sender-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sponsor-activation-email
          fetch-depth: 0
      - run: python3 scripts/fix_official_gmail_sender_once.py
      - run: |
          node --check membership-admin.js
          grep -q 'OFFICIAL_SENDER_EMAIL = "lyyuan03@gmail.com"' membership-admin.js
          grep -q 'authuser=' membership-admin.js
          grep -q 'officialGmailComposeUrl(email, subject, body)' membership-admin.js
          grep -q '20260806-official-sender-1' admin.html
      - run: rm -f scripts/fix_official_gmail_sender_once.py .github/workflows/fix-official-gmail-sender-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix member notices to use official Gmail account"
          git push origin HEAD:feature/sponsor-activation-email
