name: Finalize yuanshen binary assets

on:
  push:
    branches:
      - repair-yuanshen-binaries-complete-20260807

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-yuanshen-binaries-complete-20260807
          fetch-depth: 0
      - name: Restore dangling JPEG blobs and validate all images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, os, urllib.request

          out = Path('assets/articles/yuanshen-destiny-archetype')
          out.mkdir(parents=True, exist_ok=True)

          blobs = {
              'stone-origin.jpg': ('c89bdb972acbe9e763c12df7cc11a799d03e276c', 12323),
              'nine-tailed-bird.jpg': ('a96aa05975760194e3306af77a62f52b01302872', 10528),
          }
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          for filename, (sha, expected) in blobs.items():
              url = f"https://api.github.com/repos/{os.environ['GH_REPO']}/git/blobs/{sha}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  payload = json.load(r)
              data = base64.b64decode(payload['content'])
              if len(data) != expected or not data.startswith(b'\xff\xd8') or not data.endswith(b'\xff\xd9'):
                  raise SystemExit(f'Invalid {filename}: size={len(data)}')
              (out / filename).write_bytes(data)

          expected_all = {
              'book-cover.jpg': 13196,
              'stone-origin.jpg': 12323,
              'roc-awakening.jpg': 12020,
              'nine-tailed-bird.jpg': 10528,
          }
          for filename, expected in expected_all.items():
              data = (out / filename).read_bytes()
              if len(data) != expected or not data.startswith(b'\xff\xd8') or not data.endswith(b'\xff\xd9'):
                  raise SystemExit(f'Validation failed {filename}: size={len(data)}')
              print(filename, len(data), 'JPEG OK')

          for name in [
              'book-cover.jpg.txt', 'stone-origin.jpg.txt', 'roc-awakening.jpg.txt', 'nine-tailed-bird.jpg.txt',
              'stone-origin.svg', 'roc-awakening.svg', 'nine-tailed-bird.svg', 'test-fix.txt'
          ]:
              (out / name).unlink(missing_ok=True)
          tmp = Path('.tmp-yuanshen')
          if tmp.exists():
              for p in tmp.iterdir(): p.unlink()
              tmp.rmdir()
          Path('.github/workflows/finalize-yuanshen-binaries.yml').unlink(missing_ok=True)
          PY
      - name: Commit final binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize complete yuanshen JPEG assets"
          git push origin HEAD:repair-yuanshen-binaries-complete-20260807
