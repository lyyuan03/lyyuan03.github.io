name: Force Update Yaochi Event Title Once

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/force-update-yaochi-title-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force update title and subtitle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('yaochi-event-v2.html')
          s = p.read_text(encoding='utf-8')

          main_title = '無極瑤池金母聖誕祝壽暨解冤赦業・護法續脈遠距祝壽懺儀'
          subtitle = '一念連靈山・十方聚願力・共成建院聖業'

          # Update browser/SEO titles as well.
          s = re.sub(r'<title>.*?</title>', f'<title>{main_title}｜靈元院</title>', s, count=1, flags=re.S)
          s = re.sub(r'<meta name="description" content="[^"]*">', f'<meta name="description" content="2026年8月29日｜{main_title}。{subtitle}">', s, count=1)
          s = re.sub(r'<meta property="og:title" content="[^"]*">', f'<meta property="og:title" content="{main_title}｜靈元院">', s, count=1)
          s = re.sub(r'<meta property="og:description" content="[^"]*">', f'<meta property="og:description" content="{subtitle}｜2026/8/29">', s, count=1)

          # Add explicit no-cache meta tags to reduce stale browser copies.
          cache_tags = '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta http-equiv="Pragma" content="no-cache">\n<meta http-equiv="Expires" content="0">'
          if 'http-equiv="Cache-Control"' not in s:
              s = s.replace('<meta name="viewport" content="width=device-width, initial-scale=1.0">', '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' + cache_tags, 1)

          # Add a dedicated subtitle style so the requested subtitle is visibly distinct.
          if '.hero-subtitle{' not in s:
              s = s.replace('.hero h1 small{', '.hero-subtitle{display:block;margin:16px 0 0;font-family:var(--serif);font-size:18px;font-weight:400;line-height:1.8;letter-spacing:.08em;color:#ead7b5}.hero h1 small{', 1)
              s = s.replace('@media(max-width:640px){body{background-attachment:scroll}', '@media(max-width:640px){body{background-attachment:scroll}.hero-subtitle{font-size:15px;line-height:1.75}', 1)

          new_hero = ('<h1 id="event-title" data-hero="2">'
                      '無極瑤池金母聖誕祝壽<br>'
                      '暨解冤赦業・護法續脈<br>'
                      '遠距祝壽懺儀'
                      '</h1>'
                      f'<div class="hero-subtitle" data-hero="2">{subtitle}</div>')

          s, n = re.subn(r'<h1 id="event-title" data-hero="2">.*?</h1>(?:<div class="hero-subtitle"[^>]*>.*?</div>)?', new_hero, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate hero title block')

          revision = '<!-- YAOCHI-TITLE-REVISION: 2026-08-17-1538 -->'
          s = re.sub(r'<!-- YAOCHI-TITLE-REVISION: .*? -->\n?', '', s)
          s = s.replace('<body>', '<body>\n' + revision, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit update and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/force-update-yaochi-title-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yaochi-event-v2.html .github/workflows/force-update-yaochi-title-once.yml
          git commit -m 'Force update Yaochi event title and subtitle'
          git pull --rebase origin main
          git push origin HEAD:main
