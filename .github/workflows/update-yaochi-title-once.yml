name: Update Yaochi Event Title Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-yaochi-title-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update main title and subtitle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('yaochi-event-v2.html')
          s = p.read_text(encoding='utf-8')

          old = '<h1 id="event-title" data-hero="2">無極瑤池金母<br>聖誕祝壽暨解冤赦業法儀<small>遠距祈福 · LING YUAN YUAN</small></h1>'
          new = '<h1 id="event-title" data-hero="2">無極瑤池金母聖誕祝壽<br>暨解冤赦業・護法續脈<br>遠距祝壽懺儀<small>一念連靈山・十方聚願力・共成建院聖業</small></h1>'

          if old not in s:
              raise SystemExit('Expected current hero title block was not found; no changes made.')

          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit update and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-yaochi-title-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yaochi-event-v2.html .github/workflows/update-yaochi-title-once.yml
          git commit -m 'Update Yaochi event title and subtitle'
          git pull --rebase origin main
          git push origin HEAD:main
