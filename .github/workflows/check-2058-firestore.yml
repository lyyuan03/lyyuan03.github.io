name: Check 2058 Firestore

on:
  push:
    branches:
      - check-2058-firestore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase Admin SDK
        run: npm install --silent firebase-admin
      - name: Read Firestore article document
        run: |
          node <<'NODE'
          const { initializeApp, applicationDefault } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');
          initializeApp({ credential: applicationDefault(), projectId: 'lyyuan03-membership' });
          (async () => {
            const ref = getFirestore().collection('articles').doc('2058-future-person-prophecy');
            const snap = await ref.get();
            console.log(`DOCUMENT_EXISTS=${snap.exists}`);
            if (snap.exists) {
              const data = snap.data() || {};
              const out = {
                id: snap.id,
                coverImage: data.coverImage ?? null,
                thumbnailImage: data.thumbnailImage ?? null,
                status: data.status ?? null,
                staticSyncRevision: data.staticSyncRevision ?? null,
                staticSourceUpdatedAt: data.staticSourceUpdatedAt ?? null
              };
              console.log('ARTICLE_FIELDS=' + JSON.stringify(out));
            }
          })().catch((error) => {
            console.error('FIRESTORE_CHECK_FAILED=' + (error?.stack || error));
            process.exit(1);
          });
          NODE
