name: Check 2058 Firestore

on:
  push:
    branches:
      - check-2058-firestore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read published Firestore article document
        run: |
          node <<'NODE'
          const apiKey = 'AIzaSyAgHy-nPOErzs7NDJossVGPITbenXOfjQY';
          const path = 'projects/lyyuan03-membership/databases/(default)/documents/articles/2058-future-person-prophecy';
          const url = `https://firestore.googleapis.com/v1/${path}?key=${apiKey}`;
          const unwrap = (field) => {
            if (!field || typeof field !== 'object') return null;
            for (const key of ['stringValue','integerValue','doubleValue','booleanValue','timestampValue','nullValue']) {
              if (key in field) return field[key];
            }
            return field;
          };
          (async () => {
            const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
            const body = await response.json().catch(() => ({}));
            console.log(`HTTP_STATUS=${response.status}`);
            if (response.status === 404) {
              console.log('DOCUMENT_EXISTS=false');
              return;
            }
            if (!response.ok) {
              console.log('DOCUMENT_READABLE=false');
              console.log('FIRESTORE_ERROR=' + JSON.stringify(body.error || body));
              process.exit(2);
            }
            const fields = body.fields || {};
            const out = {
              id: '2058-future-person-prophecy',
              coverImage: unwrap(fields.coverImage),
              thumbnailImage: unwrap(fields.thumbnailImage),
              status: unwrap(fields.status),
              staticImageSyncRevision: unwrap(fields.staticImageSyncRevision),
              staticImageSourceUpdatedAt: unwrap(fields.staticImageSourceUpdatedAt)
            };
            console.log('DOCUMENT_EXISTS=true');
            console.log('ARTICLE_FIELDS=' + JSON.stringify(out));
          })().catch((error) => {
            console.error('FIRESTORE_CHECK_FAILED=' + (error?.stack || error));
            process.exit(1);
          });
          NODE
