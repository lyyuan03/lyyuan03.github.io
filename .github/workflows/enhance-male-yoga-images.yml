name: Enhance male yoga course images

on:
  push:
    branches:
      - "feature/male-yoga-hq-images-20260930"

permissions:
  contents: write

jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore valid source photos from main
        run: |
          git checkout origin/main --             assets/course-male-yoga-backbend.webp             assets/course-male-yoga-seated.webp             assets/course-male-yoga-instructor.webp

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Enhance and localize all course photography
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          from urllib.request import Request, urlopen
          import io

          root = Path(".")
          assets = root / "assets"
          html_path = root / "courses" / "male-yoga-energy.html"

          def enhance_file(path, target_long, quality=92, sharpen=90):
              im = Image.open(path).convert("RGB")
              original = im.size
              w, h = original
              long_side = max(w, h)
              if long_side < target_long:
                  scale = target_long / long_side
                  im = im.resize((round(w*scale), round(h*scale)), Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=0.8, percent=sharpen, threshold=3))
              im.save(path, "WEBP", quality=quality, method=6)
              return original, im.size

          def download_image(url, destination, target_long=2200):
              req = Request(url, headers={
                  "User-Agent":"Mozilla/5.0",
                  "Referer":"https://kinkiosel.pixnet.net/"
              })
              with urlopen(req, timeout=45) as res:
                  data = res.read()
              im = Image.open(io.BytesIO(data)).convert("RGB")
              original = im.size
              w, h = original
              long_side = max(w, h)
              if long_side < target_long:
                  scale = target_long / long_side
                  im = im.resize((round(w*scale), round(h*scale)), Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=0.8, percent=85, threshold=3))
              im.save(destination, "WEBP", quality=92, method=6)
              return original, im.size

          jobs = [
              ("backbend", assets / "course-male-yoga-backbend.webp", 2400, 92, 85),
              ("seated", assets / "course-male-yoga-seated.webp", 2400, 92, 85),
              ("instructor", assets / "course-male-yoga-instructor.webp", 2400, 92, 105),
          ]
          for name, path, target, quality, sharpen in jobs:
              before, after = enhance_file(path, target, quality, sharpen)
              print(f"{name}: {before[0]}x{before[1]} -> {after[0]}x{after[1]}")

          classroom_url = "https://pimg.1px.tw/kinkiosel/1527583780-3589111223.jpg?v=1527583782"
          rest_url = "https://pimg.1px.tw/kinkiosel/1527583912-560556329.jpg?v=1527583917"
          classroom_file = assets / "course-male-yoga-classroom-hq.webp"
          rest_file = assets / "course-male-yoga-rest-hq.webp"

          before, after = download_image(classroom_url, classroom_file)
          print(f"classroom: {before[0]}x{before[1]} -> {after[0]}x{after[1]}")
          before, after = download_image(rest_url, rest_file)
          print(f"rest: {before[0]}x{before[1]} -> {after[0]}x{after[1]}")

          html = html_path.read_text(encoding="utf-8")
          html = html.replace(
              "https://pimg.1px.tw/kinkiosel/1527583780-3589111223.jpg?v=1527583782",
              "/assets/course-male-yoga-classroom-hq.webp?v=20260930-hq3"
          )
          html = html.replace(
              "https://pimg.1px.tw/kinkiosel/1527583912-560556329.jpg?v=1527583917",
              "/assets/course-male-yoga-rest-hq.webp?v=20260930-hq3"
          )
          html = html.replace("course-male-yoga-backbend.webp?v=20260930-1", "course-male-yoga-backbend.webp?v=20260930-hq3")
          html = html.replace("course-male-yoga-seated.webp?v=20260930-1", "course-male-yoga-seated.webp?v=20260930-hq3")
          html = html.replace("course-male-yoga-instructor.webp?v=20260930-1", "course-male-yoga-instructor.webp?v=20260930-hq3")
          html = html.replace("course-male-yoga-backbend.webp?v=20260930-hq2", "course-male-yoga-backbend.webp?v=20260930-hq3")
          html = html.replace("course-male-yoga-seated.webp?v=20260930-hq2", "course-male-yoga-seated.webp?v=20260930-hq3")
          html = html.replace("course-male-yoga-instructor.webp?v=20260930-hq2", "course-male-yoga-instructor.webp?v=20260930-hq3")
          html_path.write_text(html, encoding="utf-8")
          PY

      - name: Commit enhanced images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/course-male-yoga-backbend.webp                   assets/course-male-yoga-seated.webp                   assets/course-male-yoga-instructor.webp                   assets/course-male-yoga-classroom-hq.webp                   assets/course-male-yoga-rest-hq.webp                   courses/male-yoga-energy.html
          git commit -m "media: enhance all male yoga course photos" || exit 0
          git push origin HEAD
