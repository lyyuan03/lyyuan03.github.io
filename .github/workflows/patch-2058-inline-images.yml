name: Patch 2058 Inline Images

on:
  push:
    branches:
      - fix-2058-inline-images
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-2058-inline-images
      - name: Apply patch
        run: python tools/patch-2058-inline-images.py
      - name: Verify patch
        run: |
          grep -F 'verification.webp?v=20260812-2' article-admin-core.js
          grep -F 'consciousness-network.webp?v=20260812-2' article-admin-core.js
          grep -F 'verification.webp?v=20260812-2' article-inline-image-admin.js
          grep -F 'consciousness-network.webp?v=20260812-2' article-inline-image-admin.js
          grep -F '20260812-2058-inline-image-sync-1' admin.html
      - name: Commit clean patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-2058-inline-images.yml tools/patch-2058-inline-images.py
          git add admin.html article-admin.js article-admin-core.js article-inline-image-admin.js firebase-config.js static-articles.js
          git commit -m 'Fix 2058 inline images in admin'
          git push origin HEAD:fix-2058-inline-images
