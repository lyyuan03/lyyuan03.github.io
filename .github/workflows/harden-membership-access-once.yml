name: Harden membership access once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harden-membership-access-once.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply strict membership access rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "articles.js",
              '  if (accessType === "paid" && hasPaidAccess()) {\n',
              '  if (accessType === "paid" && hasPaidAccess(articleId)) {\n'
          )

          replace_once(
              "articles.js",
              '''function hasPaidAccess() {
            if (isAdminEmail(currentUser?.email)) return true;
            if (!currentMemberAccess || currentMemberAccess.status !== "active") return false;
            const expiry = currentMemberAccess.expiresAt?.toDate?.()
              || (currentMemberAccess.expiresAt ? new Date(currentMemberAccess.expiresAt) : null);
            return Boolean(expiry && !Number.isNaN(expiry.getTime()) && expiry > new Date());
          }
          ''',
              '''function memberAccessDate(value) {
            if (!value) return null;
            const date = value?.toDate?.() || new Date(value);
            return Number.isNaN(date.getTime()) ? null : date;
          }

          function hasPaidAccess(articleId = "") {
            if (isAdminEmail(currentUser?.email)) return true;
            if (!currentUser?.email || !currentMemberAccess) return false;

            const userEmail = currentUser.email.trim().toLowerCase();
            const recordEmail = String(currentMemberAccess.email || "").trim().toLowerCase();
            if (!recordEmail || recordEmail !== userEmail) return false;
            if (currentMemberAccess.status !== "active") return false;
            if (currentMemberAccess.paymentStatus !== "paid") return false;
            if (currentMemberAccess.revokedAt || currentMemberAccess.suspended === true || currentMemberAccess.disabled === true) return false;

            const memberType = currentMemberAccess.memberType;
            const isSponsorMember = memberType === "sponsor-member";
            const isWellnessMember = memberType === "wellness-channel"
              || currentMemberAccess.wellnessAccess === true
              || ["wellness", "lingji"].includes(currentMemberAccess.memberLevel);
            if (!isSponsorMember && !isWellnessMember) return false;

            // 新資料一律以 articleAccess 明確授權；既有贊助會員僅在身分類型、付款、狀態與效期均正確時相容放行。
            if (currentMemberAccess.articleAccess !== true && !isSponsorMember) return false;

            const now = new Date();
            const startsAt = memberAccessDate(currentMemberAccess.startsAt);
            const expiresAt = memberAccessDate(currentMemberAccess.expiresAt);
            if (startsAt && startsAt > now) return false;
            if (!expiresAt || expiresAt <= now) return false;

            const deniedArticleIds = Array.isArray(currentMemberAccess.deniedArticleIds)
              ? currentMemberAccess.deniedArticleIds.map(String)
              : [];
            if (articleId && deniedArticleIds.includes(String(articleId))) return false;

            const allowedArticleIds = Array.isArray(currentMemberAccess.allowedArticleIds)
              ? currentMemberAccess.allowedArticleIds.map(String)
              : [];
            if (allowedArticleIds.length > 0 && (!articleId || !allowedArticleIds.includes(String(articleId)))) return false;

            return true;
          }
          '''
          )

          replace_once(
              "articles.js",
              '''    const snapshot = await getDoc(doc(db, "memberAccess", email));
              if (snapshot.exists()) currentMemberAccess = snapshot.data();
          ''',
              '''    const snapshot = await getDoc(doc(db, "memberAccess", email));
              if (!snapshot.exists()) return;
              const record = snapshot.data() || {};
              const recordEmail = String(record.email || snapshot.id || "").trim().toLowerCase();
              if (recordEmail !== email) {
                console.warn("會員閱讀資格 Email 與登入帳號不一致，已拒絕授權。");
                return;
              }
              currentMemberAccess = { ...record, email: recordEmail };
          '''
          )

          replace_once(
              "articles.js",
              '''document.addEventListener("visibilitychange", () => {
            if (document.visibilityState !== "visible") return;
            const now = Date.now();
            if (now - lastVisibleRefreshAt < 1500) return;
            lastVisibleRefreshAt = now;
            loadArticles().catch((error) => console.error("重新載入文章失敗：", error));
          });
          ''',
              '''document.addEventListener("visibilitychange", async () => {
            if (document.visibilityState !== "visible") return;
            const now = Date.now();
            if (now - lastVisibleRefreshAt < 1500) return;
            lastVisibleRefreshAt = now;
            try {
              await loadMemberAccess(auth.currentUser);
              await loadArticles();
            } catch (error) {
              console.error("重新確認會員資格失敗：", error);
              currentMemberAccess = null;
              renderCurrentView();
            }
          });
          '''
          )

          replace_once(
              "membership-admin.js",
              '''  const status = paymentStatus || document.getElementById("member-payment-status").value;
            return {
              email,
              name: document.getElementById("member-name").value.trim(),
              memberType: "sponsor-member",
              articleAccess: true,
              wellnessAccess: false,
          ''',
              '''  const status = paymentStatus || document.getElementById("member-payment-status").value;
            const isPaid = status === "paid";
            return {
              email,
              name: document.getElementById("member-name").value.trim(),
              memberType: "sponsor-member",
              articleAccess: isPaid,
              wellnessAccess: false,
          '''
          )

          replace_once(
              "membership-admin.js",
              '''async function saveMember(event) {
            event.preventDefault();
            const payload = memberPayload();
            if (!payload.email) return;
            const original = normalizeEmail(document.getElementById("member-original-email").value);
            await setDoc(doc(db, "memberAccess", payload.email), payload, { merge: true });
            if (original && original !== payload.email) await deleteDoc(doc(db, "memberAccess", original));
            statusEl.textContent = payload.paymentStatus === "paid" ? "會員資料已更新；若要新增一筆付費人次，請使用「確認付款並開通」" : "會員資料已儲存";
            await loadMembers();
            resetMemberForm();
          }
          ''',
              '''async function saveMember(event) {
            event.preventDefault();
            const original = normalizeEmail(document.getElementById("member-original-email").value);
            const existing = members.find((item) => item.email === original);
            const selectedPaymentStatus = document.getElementById("member-payment-status").value;
            const alreadyActivePaid = existing?.paymentStatus === "paid" && existing?.status === "active";
            if (selectedPaymentStatus === "paid" && !alreadyActivePaid) {
              statusEl.textContent = "為避免誤開權限，新增或待付款會員不能用「儲存會員資料」直接改成已付款；請使用「確認付款並開通」。";
              return;
            }

            const payload = memberPayload(alreadyActivePaid ? "paid" : "pending");
            if (!payload.email) return;
            await setDoc(doc(db, "memberAccess", payload.email), payload, { merge: true });
            if (original && original !== payload.email) await deleteDoc(doc(db, "memberAccess", original));
            statusEl.textContent = alreadyActivePaid ? "會員基本資料已更新，既有閱讀資格與效期維持不變" : "待付款會員資料已儲存，尚未開放閱讀權限";
            await loadMembers();
            resetMemberForm();
          }
          '''
          )

          replace_once(
              "membership-admin.js",
              '''    const active = member.status === "active" && expiry && expiry > now;
              const label = member.paymentStatus === "pending" ? "待付款" : active ? "有效" : "已到期";
          ''',
              '''    const active = member.status === "active"
              && member.paymentStatus === "paid"
              && member.articleAccess === true
              && expiry
              && expiry > now;
              const label = member.paymentStatus === "pending"
                ? "待付款／未開權限"
                : active
                  ? "有效"
                  : member.status === "active"
                    ? "權限資料不完整"
                    : "已到期";
          '''
          )

          replace_once(
              "functions/index.js",
              '''      memberType: "sponsor-member",
                planMonths,
                amount,
                paymentStatus: "pending",
          ''',
              '''      memberType: "sponsor-member",
                articleAccess: false,
                wellnessAccess: false,
                planMonths,
                amount,
                paymentStatus: "pending",
          '''
          )

          replace_once(
              "functions/index.js",
              '''        if (order.memberType !== "sponsor-member") {
                  activeMember.wellnessAccess = true;
                  activeMember.memberLevel = order.memberLevel;
                  activeMember.wellnessLevel = order.memberLevel;
                  activeMember.articleAccess = order.memberLevel === "lingji" || order.articleAccess === true;
                }
          ''',
              '''        if (order.memberType === "sponsor-member") {
                  activeMember.articleAccess = true;
                  activeMember.wellnessAccess = false;
                } else {
                  activeMember.wellnessAccess = true;
                  activeMember.memberLevel = order.memberLevel;
                  activeMember.wellnessLevel = order.memberLevel;
                  activeMember.articleAccess = order.memberLevel === "lingji" || order.articleAccess === true;
                }
          '''
          )

          replace_once(
              "firestore.rules",
              '''    function isActiveWellnessMember() {
                return signedIn()
                  && wellnessMember().data.status == "active"
                  && wellnessMember().data.memberType != "sponsor-member"
                  && (wellnessMember().data.wellnessAccess == true
                    || wellnessMember().data.memberType == "wellness-channel"
                    || wellnessMember().data.memberLevel in ["wellness", "lingji"]);
              }
          ''',
              '''    function isActiveWellnessMember() {
                return signedIn()
                  && request.auth.token.email_verified == true
                  && wellnessMember().data.email == request.auth.token.email
                  && wellnessMember().data.status == "active"
                  && wellnessMember().data.paymentStatus == "paid"
                  && wellnessMember().data.expiresAt > request.time
                  && wellnessMember().data.memberType != "sponsor-member"
                  && wellnessMember().data.disabled != true
                  && wellnessMember().data.suspended != true
                  && (wellnessMember().data.wellnessAccess == true
                    || wellnessMember().data.memberType == "wellness-channel"
                    || wellnessMember().data.memberLevel in ["wellness", "lingji"]);
              }
          '''
          )

          replace_once(
              "firestore.rules",
              '''      allow read: if isAdmin()
                || (signedIn() && request.auth.token.email == memberEmail);
          ''',
              '''      allow read: if isAdmin()
                || (signedIn()
                  && request.auth.token.email_verified == true
                  && request.auth.token.email == memberEmail
                  && resource.data.email == memberEmail);
          '''
          )

          replace_once(
              "articles.html",
              '<script type="module" src="articles.js?v=20260802-email-link-login-1"></script>',
              '<script type="module" src="articles.js?v=20260803-paid-access-hardening-1"></script>'
          )

          replace_once(
              "admin.html",
              '<script type="module" src="membership-admin.js?v=20260802-sponsor-type-fix-1"></script>',
              '<script type="module" src="membership-admin.js?v=20260803-paid-access-hardening-1"></script>'
          )
          PY

      - name: Validate JavaScript syntax and hardening markers
        shell: bash
        run: |
          node --check articles.js
          node --check membership-admin.js
          node --check functions/index.js
          grep -q 'paymentStatus !== "paid"' articles.js
          grep -q 'articleAccess = true' functions/index.js
          grep -q 'email_verified == true' firestore.rules

      - name: Commit hardened access controls
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.js articles.html membership-admin.js admin.html functions/index.js firestore.rules
          git commit -m "fix: harden paid article membership authorization"
          git push origin HEAD:main
