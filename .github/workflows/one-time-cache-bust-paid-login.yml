name: One-time paid login cache bust

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-cache-bust-paid-login.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update both cache version strings
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "20260811-article-tags-1"
          new = "20260812-paid-login-modal-fix-1"
          targets = {
              "articles.html": 'src="articles-v6.js?v=' + old + '"',
              "articles-v6.js": 'import "./articles-core-20260810-v6.js?v=' + old + '";',
          }

          for filename, needle in targets.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f"{filename}: expected exactly one target, found {count}")
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
              print(f"updated {filename}")
          PY

      - name: Verify synchronized version and JS syntax
        run: |
          grep -F 'articles-v6.js?v=20260812-paid-login-modal-fix-1' articles.html
          grep -F 'articles-core-20260810-v6.js?v=20260812-paid-login-modal-fix-1' articles-v6.js
          if grep -Fq 'articles-v6.js?v=20260811-article-tags-1' articles.html; then exit 1; fi
          if grep -Fq 'articles-core-20260810-v6.js?v=20260811-article-tags-1' articles-v6.js; then exit 1; fi
          node --check articles-v6.js
          node --check articles-core-20260810-v6.js

      - name: Commit cache bust and remove one-time workflow
        run: |
          git config user.name "lyyuan03"
          git config user.email "lyyuan03@gmail.com"
          git rm .github/workflows/one-time-cache-bust-paid-login.yml
          git add articles.html articles-v6.js
          git commit -m "fix: bust paid article login cache"
          git pull --rebase origin main
          git push origin main
