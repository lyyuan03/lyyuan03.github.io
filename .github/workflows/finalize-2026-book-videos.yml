name: Finalize 2026 Book Videos

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-2026-book-videos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download final responsive video assets
        env:
          DESKTOP_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-d5b8-820b-9f7b-300a2dd250f5/raw?se=2026-08-13T10%3A21%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=cd3b64f7-bcc9-5b7e-aa74-19f74e549ba1&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-13T00%3A50%3A24Z&ske=2026-08-14T00%3A50%3A24Z&sks=b&skv=2026-02-06&sig=KZHoxJ%2BY%2Bo5CJ2Ro79scX0Bo9z6zfVXd3X3a%2Bnc/UGA%3D'
          MOBILE_URL: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-a878-81f8-9a5a-a6a48aefa72e/raw?se=2026-08-13T10%3A21%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=a2a0df61-20f5-5159-8b0f-1bd0cff7c21b&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-13T04%3A28%3A40Z&ske=2026-08-14T04%3A28%3A40Z&sks=b&skv=2026-02-06&sig=8ZC/C8tzlwYwl%2BYpKDNrXdDeZHhSxLajk65D8DSl8Zc%3D'
        run: |
          set -euo pipefail
          mkdir -p assets/videos
          curl --fail --location --retry 3 --retry-delay 1 "$DESKTOP_URL" -o assets/videos/osel-awakening-2026-desktop.mp4
          curl --fail --location --retry 3 --retry-delay 1 "$MOBILE_URL" -o assets/videos/osel-awakening-2026-mobile.mp4
          python - <<'PY'
          from pathlib import Path
          expected = {
              Path('assets/videos/osel-awakening-2026-desktop.mp4'): 319619,
              Path('assets/videos/osel-awakening-2026-mobile.mp4'): 255986,
          }
          for path, min_size in expected.items():
              data = path.read_bytes()
              if len(data) < min_size:
                  raise SystemExit(f'{path} too small: {len(data)} bytes')
              if b'ftyp' not in data[:64]:
                  raise SystemExit(f'{path} is not a valid MP4')
              print(f'{path}: {len(data)} bytes OK')
          PY

      - name: Bust video cache and remove temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('analytics.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('/assets/videos/osel-awakening-2026-mobile.mp4?v=20260813-1', '/assets/videos/osel-awakening-2026-mobile.mp4?v=20260813-2')
          text = text.replace('/assets/videos/osel-awakening-2026-desktop.mp4?v=20260813-1', '/assets/videos/osel-awakening-2026-desktop.mp4?v=20260813-2')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/import-2026-book-videos.yml
          rm -f .github/workflows/finalize-2026-book-videos.yml

      - name: Commit final published assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/videos analytics.js .github/workflows
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'feat(books): 上架 2026 新書桌機與手機宣傳影片'
          git push origin HEAD:main
