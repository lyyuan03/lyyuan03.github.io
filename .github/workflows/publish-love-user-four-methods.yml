name: Publish user supplied four practices to protected love article
# Fresh Pages deployment; earlier run had a GitHub artifact race and a retry collision.
on:
  push:
    branches: [main]
    paths:
      - functions/publish-love-user-four-methods.mjs
      - secure-imports/love-four-methods-v4.enc.json
      - .github/workflows/publish-love-user-four-methods.yml
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - name: Publish only four-method section without touching other article fields
        run: node functions/publish-love-user-four-methods.mjs