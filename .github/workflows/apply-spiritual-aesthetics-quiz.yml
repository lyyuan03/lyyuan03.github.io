name: Apply spiritual aesthetics quiz

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-spiritual-aesthetics-quiz.yml'

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch preview page
        shell: python
        run: |
          from pathlib import Path

          path = Path('spiritual-aesthetics-preview.html')
          html = path.read_text(encoding='utf-8')

          css_link = '<link rel="stylesheet" href="assets/spiritual-aesthetics-quiz.css">'
          if css_link not in html:
              html = html.replace('</head>', f'{css_link}\n</head>', 1)

          old_hero = '''    <div class="hero-art reveal" aria-hidden="true">
                <div class="orbit one"></div><div class="orbit two"></div>
                <div class="ema-frame"><img class="ema-logo" src="logo.png" alt=""><p class="ema-title">靈性美學館</p><div class="ema-rule"></div><p class="ema-copy">一念祈願<br>一物承心<br>讓守護回到日常</p></div>
              </div>'''

          new_hero = '''    <div class="hero-art reveal">
                <div class="orbit one"></div><div class="orbit two"></div>
                <section class="energy-quiz" id="energyQuiz" aria-labelledby="quizTitle">
                  <div class="quiz-inner">
                    <img class="quiz-mark" src="logo.png" alt="靈元院">
                    <p class="quiz-kicker">INNER ENERGY · OMAMORI</p>
                    <h2 class="quiz-title" id="quizTitle">此刻，你需要哪一種守護？</h2>
                    <p class="quiz-sub">以四個生活狀態進行自我覺察，找出此刻最需要補足的能量。</p>
                    <div class="quiz-rule"></div>
                    <div class="quiz-panel quiz-start active" data-panel="start">
                      <div class="quiz-start-symbol"></div>
                      <button class="quiz-start-btn" type="button" id="quizStart">開始能量檢測</button>
                      <p class="quiz-notice">約 1 分鐘完成。請依照最近一個月最常出現的感受作答。</p>
                    </div>
                    <div class="quiz-panel" data-panel="question">
                      <div class="quiz-progress-row"><span id="quizStep">第 1 題</span><span>共 4 題</span></div>
                      <div class="quiz-progress"><i id="quizProgress"></i></div>
                      <h3 class="quiz-question" id="quizQuestion"></h3>
                      <div class="quiz-options" id="quizOptions"></div>
                      <button class="quiz-next-btn" type="button" id="quizNext" disabled>下一題</button>
                    </div>
                    <div class="quiz-panel" data-panel="result">
                      <span class="result-energy" id="resultEnergy"></span>
                      <h3 class="result-name" id="resultName"></h3>
                      <p class="result-lead" id="resultLead"></p>
                      <p class="result-copy" id="resultCopy"></p>
                      <div class="result-actions">
                        <button class="quiz-result-btn" type="button" id="resultProduct">查看適合我的御守</button>
                        <button class="quiz-restart" type="button" id="quizRestart">重新檢測</button>
                      </div>
                    </div>
                    <p class="quiz-disclaimer">本測驗為日常自我覺察與選物參考，不屬於醫療、心理或宗教認證診斷。</p>
                  </div>
                </section>
              </div>'''

          if 'id="energyQuiz"' not in html:
              if old_hero not in html:
                  raise SystemExit('Hero card block not found; preview page was not changed.')
              html = html.replace(old_hero, new_hero, 1)

          replacements = [
              ('<article class="product-card reveal" data-category="omamori">', '<article class="product-card reveal" id="product-spirit" data-category="omamori" data-product="spirit">'),
              ('<article class="product-card reveal" data-category="omamori">', '<article class="product-card reveal" id="product-wealth" data-category="omamori" data-product="wealth">'),
              ('<article class="product-card reveal" data-category="omamori">', '<article class="product-card reveal" id="product-career" data-category="omamori" data-product="career">'),
              ('<article class="product-card reveal" data-category="omamori">', '<article class="product-card reveal" id="product-love" data-category="omamori" data-product="love">'),
              ('<article class="product-card reveal" data-category="incense">', '<article class="product-card reveal" id="product-incense" data-category="incense" data-product="incense">')
          ]
          for old, new in replacements:
              if new not in html:
                  if old not in html:
                      raise SystemExit(f'Product card block not found: {new}')
                  html = html.replace(old, new, 1)

          old_promise = '<article class="promise reveal"><b>商品資訊一目了然</b><span>御守與護香分區呈現，點選商品圖片或按鈕，即可前往綠界表單選購。</span></article>'
          new_promise = '<article class="promise reveal"><b>御守能量自我覺察</b><span>首頁測驗依照近期生活狀態，提供四款御守之中較適合此刻的祈願方向。</span></article>'
          html = html.replace(old_promise, new_promise, 1)

          quiz_script = '<script src="assets/spiritual-aesthetics-quiz.js" defer></script>'
          if quiz_script not in html:
              html = html.replace('</body>', f'{quiz_script}\n</body>', 1)

          path.write_text(html, encoding='utf-8')
      - name: Commit updated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spiritual-aesthetics-preview.html
          git diff --cached --quiet && exit 0
          git commit -m "Add interactive omamori energy quiz preview"
          git push
