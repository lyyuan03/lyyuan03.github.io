name: Import Audited Gmail Event Permissions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/jinmu-permission-import.yml
      - .github/private-imports/jinmu-permissions.enc.json
permissions:
  contents: read
concurrency:
  group: jinmu-permission-import
  cancel-in-progress: false
jobs:
  audited-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - run: npm --prefix functions test
      - run: python3 -B .github/scripts/test-member-entitlements.py
      - name: Check existing infrastructure without enabling APIs
        run: node functions/jinmu-permission-import.mjs infrastructure
      - name: Prepare private one-time transport
        if: hashFiles('.github/private-imports/jinmu-permissions.enc.json') == ''
        run: node functions/jinmu-permission-import.mjs prepare
      - name: Merge audited Gmail permissions and verify preserved membership
        if: hashFiles('.github/private-imports/jinmu-permissions.enc.json') != ''
        run: node functions/jinmu-permission-import.mjs import
