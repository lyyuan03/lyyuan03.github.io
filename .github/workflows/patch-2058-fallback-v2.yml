name: Patch 2058 Fallback V2

on:
  push:
    branches:
      - fix-2058-published-fallback
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-2058-published-fallback
      - name: Apply patch
        run: python tools/patch_2058_fallback.py
      - name: Validate
        run: |
          grep -q 'publishedFuturePerson2058ProphecyArticle' static-articles.js
          grep -q 'allow2058PublishedFallback' articles-core-20260810-v6.js
          grep -q '20260812-2058-fallback-1' articles-v6.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix 2058 published fallback'
          git push
