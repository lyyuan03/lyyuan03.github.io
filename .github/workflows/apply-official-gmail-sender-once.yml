name: Apply official Gmail sender once

on:
  push:
    branches:
      - fix/official-gmail-sender
    paths:
      - scripts/apply_official_gmail_sender_once.py
      - .github/workflows/apply-official-gmail-sender-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/official-gmail-sender
          fetch-depth: 0
      - run: python3 scripts/apply_official_gmail_sender_once.py
      - run: |
          node --check membership-admin.js
          grep -q 'OFFICIAL_SENDER_EMAIL = "lyyuan03@gmail.com"' membership-admin.js
          grep -q 'authuser=' membership-admin.js
          grep -q '寄發開通通知' membership-admin.js
          grep -q '20260806-official-sender-1' admin.html
      - run: rm -f scripts/apply_official_gmail_sender_once.py .github/workflows/apply-official-gmail-sender-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix membership emails to use official Gmail sender"
          git push origin HEAD:fix/official-gmail-sender
