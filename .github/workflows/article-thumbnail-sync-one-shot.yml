name: One-shot article thumbnail sync fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/article-thumbnail-sync-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact thumbnail sync fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          article_path = Path('articles.html')
          auth_path = Path('site-auth-nav.js')

          article = article_path.read_text(encoding='utf-8')
          thumbnail_line = '<script type="module" src="/article-thumbnail-display.js?v=20260807-thumbnail-sync-1"></script>'
          auth_line_old = '<script type="module" src="/site-auth-nav.js?v=20260805-manual-ecpay-1"></script>'
          if thumbnail_line not in article:
              if auth_line_old not in article:
                  raise SystemExit('articles.html: expected site-auth-nav script line not found')
              article = article.replace(auth_line_old, thumbnail_line + '\n' + auth_line_old, 1)
              article_path.write_text(article, encoding='utf-8')

          auth = auth_path.read_text(encoding='utf-8')
          css_lines = [
              '    .article-card[data-article-id="reading-you-can-not-fear-death"] .article-card-media{display:block;overflow:hidden;background:#EEE9DF!important}',
              '    .article-card[data-article-id="reading-you-can-not-fear-death"] .article-card-media img{position:absolute!important;inset:0!important;width:100%!important;max-width:none!important;height:100%!important;max-height:none!important;padding:0!important;margin:0!important;object-fit:cover!important;object-position:50% 47%!important;filter:none!important;transform:scale(2.18)!important;transform-origin:center!important}',
              '    .article-card[data-article-id="reading-you-can-not-fear-death"]:hover .article-card-media img{transform:scale(2.23)!important}',
              '    .article-card[data-article-id="reading-you-can-not-fear-death"] .article-list-title{text-align:center}',
              '      .article-card[data-article-id="reading-you-can-not-fear-death"] .article-card-media img{object-position:center!important;transform:scale(1.04)!important}',
              '      .article-card[data-article-id="reading-you-can-not-fear-death"]:hover .article-card-media img{transform:scale(1.04)!important}',
          ]
          missing = [line for line in css_lines if line not in auth]
          if missing:
              raise SystemExit('site-auth-nav.js: one or more expected hard-coded CSS lines were not found')
          for line in css_lines:
              auth = auth.replace(line + '\n', '', 1)
          auth_path.write_text(auth, encoding='utf-8')

          old = 'site-auth-nav.js?v=20260805-manual-ecpay-1'
          new = 'site-auth-nav.js?v=20260807-thumbnail-cleanup-1'
          changed_html = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed_html.append(str(path))

          remaining = []
          for path in Path('.').rglob('*.html'):
              if old in path.read_text(encoding='utf-8'):
                  remaining.append(str(path))
          if remaining:
              raise SystemExit('old site-auth-nav version still present in: ' + ', '.join(remaining))

          article = article_path.read_text(encoding='utf-8')
          if thumbnail_line not in article:
              raise SystemExit('articles.html: thumbnail display script was not added')
          if 'site-auth-nav.js?v=20260807-thumbnail-cleanup-1' not in article:
              raise SystemExit('articles.html: site-auth-nav version was not updated')

          auth = auth_path.read_text(encoding='utf-8')
          if 'reading-you-can-not-fear-death' in '\n'.join(line for line in auth.splitlines() if '.article-card[data-article-id=' in line):
              raise SystemExit('site-auth-nav.js: hard-coded article-card CSS remains')

          print('HTML files with version bump:')
          for path in changed_html:
              print(path)
          PY

      - name: Commit exact fix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/article-thumbnail-sync-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix article thumbnail frontend sync"
          git pull --rebase origin main
          git push origin HEAD:main
