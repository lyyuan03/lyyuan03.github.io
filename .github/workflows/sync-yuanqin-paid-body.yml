name: Sync Yuanqin Paid Draft Body

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-yuanqin-paid-body.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase Admin dependencies
        run: npm --prefix functions ci

      - name: Export private draft body from secure Drive document
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          HTTP_STATUS="$(curl --silent --show-error --location             --output /tmp/yuanqin-paid-body.txt             --write-out "%{http_code}"             --header "Authorization: Bearer $ACCESS_TOKEN"             "https://www.googleapis.com/drive/v3/files/13QQARey5rt2vjn_EcwyAGCZjSJPRivC-rftb4U49kMw/export?mimeType=text%2Fplain")"
          test "$HTTP_STATUS" -ge 200
          test "$HTTP_STATUS" -lt 300
          test -s /tmp/yuanqin-paid-body.txt

      - name: Write and verify private paid body
        env:
          GOOGLE_CLOUD_PROJECT: lyyuan03-membership
          GCLOUD_PROJECT: lyyuan03-membership
        run: |
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import { createRequire } from "node:module";
          const root = process.cwd();
          const functionsRequire = createRequire(path.join(root, "functions", "package.json"));
          const { getApps, initializeApp } = functionsRequire("firebase-admin/app");
          const { FieldValue, getFirestore } = functionsRequire("firebase-admin/firestore");
          if (!getApps().length) initializeApp();
          const db = getFirestore();
          const articleId = "yuanqin-debt-heart";
          const title = "為什麼冤親債主永遠度不完？";
          const content = fs.readFileSync("/tmp/yuanqin-paid-body.txt", "utf8").trim();
          if (!content.startsWith("## 法會裡的解冤，真正處理的是什麼？")) throw new Error("Unexpected private body start");
          if (!content.endsWith("而是自己心裡那個始終沒有放下的結。")) throw new Error("Unexpected private body end");
          const contentHash = crypto.createHash("sha256").update(content).digest("hex");
          const privateRef = db.collection("paidArticleBodies").doc(articleId);
          const previous = await privateRef.get();
          const previousData = previous.data() || {};
          const contentVersion = previousData.contentHash === contentHash
            ? Math.max(1, Number(previousData.contentVersion || 1))
            : Math.max(1, Number(previousData.contentVersion || 0) + 1);
          await privateRef.set({
            articleId,
            title,
            status: "draft",
            content,
            contentHash,
            contentVersion,
            source: "secure-drive-sync:20260828-yuanqin-final-article",
            active: true,
            updatedAt: FieldValue.serverTimestamp()
          }, { merge: true });
          const verify = await privateRef.get();
          const verifyData = verify.data() || {};
          if (!verify.exists || verifyData.content !== content || verifyData.contentHash !== contentHash) {
            throw new Error("Private paid body verification failed");
          }
          await db.collection("articles").doc(articleId).set({
            title,
            status: "draft",
            accessType: "paid",
            privatePaidContent: true,
            paidContentHash: contentHash,
            paidContentVersion: contentVersion,
            updatedAt: FieldValue.serverTimestamp()
          }, { merge: true });
          console.log("yuanqin private paid body verified; version=" + contentVersion);
          NODE

      - name: Record success
        run: |
          set -euo pipefail
          mkdir -p .github/deploy-triggers
          {
            echo "yuanqin paid draft body sync: success"
            echo "run id: $GITHUB_RUN_ID"
            echo "source commit: $GITHUB_SHA"
            echo "completed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > .github/deploy-triggers/yuanqin-paid-body-sync-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/deploy-triggers/yuanqin-paid-body-sync-success.txt
          git commit -m "Record yuanqin paid body sync success" || true
          git pull --rebase origin main
          git push origin HEAD:main
