name: One-time membership order-date renewal fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-membership-order-date-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/membership-renewal-from-order-date-20260806
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Update membership policy and calculation
        shell: python
        run: |
          from pathlib import Path

          membership_path = Path('membership.html')
          membership = membership_path.read_text(encoding='utf-8')
          old_membership = '''        <article class="rights-branch">
          <small class="branch-label">舊會員續會</small><span class="amount">NT$6,000</span>
          <h3>延長 4 個月會籍</h3>
          <p>單筆購買營養補品滿額，不需重修課程，也不需重新申請。</p>
          <div class="branch-rule">從原到期日往後延長<br>例：2026/7/30 → 2026/11/30</div>
        </article>'''
          new_membership = '''        <article class="rights-branch">
          <small class="branch-label">舊會員續會</small><span class="amount">NT$6,000</span>
          <h3>自訂購日起算 4 個月</h3>
          <p>單筆購買營養補品滿額，不需重修課程，也不需重新申請。新會期以本次訂購日為起日。</p>
          <div class="branch-rule">不沿用原到期日，改由訂購日起算<br>例：原到期 2026/8/6，訂購日 2026/8/1<br>新會期：2026/8/1－2026/12/1</div>
        </article>'''
          if membership.count(old_membership) != 1:
              raise SystemExit('membership.html target block not found exactly once')
          membership_path.write_text(membership.replace(old_membership, new_membership, 1), encoding='utf-8')

          backend_path = Path('functions/index.js')
          backend = backend_path.read_text(encoding='utf-8')
          old_date_logic = '''        const now = new Date();
        const existingExpiry = member.expiresAt?.toDate?.()
          || (member.expiresAt ? new Date(member.expiresAt) : null);
        const startAt = existingExpiry && existingExpiry > now ? existingExpiry : now;
        const expiresAt = addMonths(startAt, Number(order.planMonths));
        const nowTimestamp = Timestamp.fromDate(now);
        const expiryTimestamp = Timestamp.fromDate(expiresAt);'''
          new_date_logic = '''        const now = new Date();
        const existingExpiry = member.expiresAt?.toDate?.()
          || (member.expiresAt ? new Date(member.expiresAt) : null);
        const orderDate = order.createdAt?.toDate?.()
          || (order.createdAt ? new Date(order.createdAt) : now);
        const validOrderDate = Number.isNaN(orderDate.getTime()) ? now : orderDate;
        const startAt = order.memberType === "sponsor-member"
          ? (existingExpiry && existingExpiry > now ? existingExpiry : now)
          : validOrderDate;
        const expiresAt = addMonths(startAt, Number(order.planMonths));
        const nowTimestamp = Timestamp.fromDate(now);
        const startTimestamp = Timestamp.fromDate(startAt);
        const expiryTimestamp = Timestamp.fromDate(expiresAt);'''
          if backend.count(old_date_logic) != 1:
              raise SystemExit('functions/index.js date logic target not found exactly once')
          backend = backend.replace(old_date_logic, new_date_logic, 1)

          old_start = '''          startsAt: nowTimestamp,'''
          new_start = '''          startsAt: order.memberType === "sponsor-member" ? nowTimestamp : startTimestamp,'''
          if backend.count(old_start) != 1:
              raise SystemExit('functions/index.js startsAt target not found exactly once')
          backend_path.write_text(backend.replace(old_start, new_start, 1), encoding='utf-8')

      - name: Remove branch copy of one-time workflow
        run: rm .github/workflows/one-time-membership-order-date-fix.yml

      - name: Verify backend
        run: npm --prefix functions ci && npm --prefix functions test && npm --prefix functions run lint

      - name: Commit changes to fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add membership.html functions/index.js .github/workflows/one-time-membership-order-date-fix.yml
          git commit -m "fix: calculate wellness membership from order date"
          git push origin HEAD:fix/membership-renewal-from-order-date-20260806
