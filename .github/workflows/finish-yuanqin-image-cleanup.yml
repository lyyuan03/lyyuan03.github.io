name: Finish yuanqin image cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-yuanqin-image-cleanup.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-chi-tra
          python -m pip install --quiet opencv-python-headless pytesseract pillow numpy
      - name: Clean residual text
        run: python scripts/finish-yuanqin-image-cleanup.py
      - name: Verify
        run: |
          file assets/articles/yuanqin-debt-heart/*.webp
          grep -n 'status: "published"' article-yuanqin-debt-heart.js
          grep -n '20260828-clean-text-2' article-yuanqin-debt-heart.js
          git diff --check
      - name: Remove one-time files
        run: |
          rm -f scripts/finish-yuanqin-image-cleanup.py
          rm -f .github/workflows/finish-yuanqin-image-cleanup.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish yuanqin text-free image cleanup'
          git push origin main
