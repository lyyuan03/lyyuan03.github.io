name: Deploy Article Status Backend

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/article-status-backend.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply backend patch
        run: python3 scripts/patch_article_status_backend.py

      - name: Validate backend code
        run: |
          node --check functions/index.js
          git diff --check
          grep -F 'match /articlePublicationStatus/' firestore.rules
          grep -F 'exports.syncArticlePublicationStatus' functions/index.js

      - name: Install dependencies
        run: npm --prefix functions ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy rules and sync function
        run: firebase deploy --only firestore:rules,functions:syncArticlePublicationStatus --project lyyuan03-membership --non-interactive

      - name: Backfill current article statuses
        working-directory: functions
        run: |
          node - <<'NODE'
          const { applicationDefault, initializeApp } = require('firebase-admin/app');
          const { FieldValue, getFirestore } = require('firebase-admin/firestore');
          initializeApp({ credential: applicationDefault(), projectId: 'lyyuan03-membership' });
          const db = getFirestore();
          async function main() {
            const snapshot = await db.collection('articles').get();
            for (let start = 0; start < snapshot.docs.length; start += 400) {
              const batch = db.batch();
              snapshot.docs.slice(start, start + 400).forEach((item) => {
                const article = item.data() || {};
                batch.set(db.collection('articlePublicationStatus').doc(item.id), {
                  status: article.status === 'published' ? 'published' : 'draft',
                  hidden: article.hidden === true,
                  systemRecord: article.systemRecord === true,
                  updatedAt: FieldValue.serverTimestamp()
                });
              });
              await batch.commit();
            }
            console.log(`Backfilled ${snapshot.docs.length} article status documents.`);
          }
          main().then(() => process.exit(0)).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'feat: add secure article publication status index'
          file_pattern: 'firestore.rules functions/index.js'
