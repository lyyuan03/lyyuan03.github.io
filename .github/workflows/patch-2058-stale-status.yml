name: Patch 2058 Stale Status

on:
  push:
    branches:
      - fix-2058-stale-status-fallback
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-2058-stale-status-fallback
      - name: Apply patch
        run: python tools/patch_2058_stale_status.py
      - name: Validate
        run: |
          grep -q 'keep2058StaticFallback' articles-core-20260810-v6.js
          grep -q '20260812-2058-fallback-2' articles-v6.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ignore stale status for 2058 fallback'
          git push
