name: One-time member dashboard header fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-time-fix-member-dashboard-header.yml"

permissions:
  contents: write

concurrency:
  group: one-time-member-dashboard-header-fix
  cancel-in-progress: false

jobs:
  fix-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep navigation and account button in one fixed row
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("member-dashboard.html")
          text = path.read_text(encoding="utf-8")
          marker = "nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(18,23,15,.96);border-bottom:1px solid rgba(165,130,84,.18);backdrop-filter:blur(18px)}"
          patch = marker + "\nbody>nav{position:fixed!important;top:0!important;left:0!important;right:0!important;z-index:1200!important;transform:none!important;visibility:visible!important;opacity:1!important}\nhtml body.site-auth-enabled{padding-top:0!important}\n@media(min-width:769px){html body #site-auth-bar{position:fixed!important;top:0!important;left:auto!important;right:0!important;width:auto!important;min-width:132px!important;height:56px!important;padding:0 24px!important;background:transparent!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;z-index:1201!important}html body #site-auth-bar .site-auth-actions{pointer-events:auto!important}.nav-inner{padding-left:132px;padding-right:132px}}"

          if "one-time-member-dashboard-header-fix-applied" not in text:
              if marker not in text:
                  raise SystemExit("Member dashboard navigation style marker not found")
              text = text.replace(marker, patch + "\n/* one-time-member-dashboard-header-fix-applied */", 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-fix-member-dashboard-header.yml
          git add member-dashboard.html
          git commit -m "固定會員中心導覽列並合併會員按鈕"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
