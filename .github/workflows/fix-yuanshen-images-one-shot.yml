name: One-shot yuanshen article image fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-yuanshen-images-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Firestore-rendered and static yuanshen images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cover = 'https://www.books.com.tw/img/001/106/00/0011060075.jpg?utm_source=chatgpt.com'

          # 1) Static article source: direct JPGs only, no SVG wrappers.
          p = Path('article-yuanshen-destiny-archetype.js')
          text = p.read_text(encoding='utf-8')
          old_cover = 'coverImage: "assets/articles/yuanshen-destiny-archetype/book-cover.svg?v=20260807-1"'
          new_cover = f'coverImage: "{cover}"'
          if old_cover not in text and new_cover not in text:
              raise SystemExit('Static article coverImage target not found')
          text = text.replace(old_cover, new_cover)
          replacements = {
              'assets/articles/yuanshen-destiny-archetype/stone-origin.svg?v=20260807-1': 'assets/articles/yuanshen-destiny-archetype/stone-origin.jpg?v=20260807-direct-2',
              'assets/articles/yuanshen-destiny-archetype/roc-awakening.svg?v=20260807-1': 'assets/articles/yuanshen-destiny-archetype/roc-awakening.jpg?v=20260807-direct-2',
              'assets/articles/yuanshen-destiny-archetype/nine-tailed-bird.svg?v=20260807-1': 'assets/articles/yuanshen-destiny-archetype/nine-tailed-bird.jpg?v=20260807-direct-2',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          # 2) Firestore is source of truth for this article. Normalize only its image fields after fetch.
          p = Path('articles.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'import { staticArticles } from "./static-articles.js?v=20260807-article-sync-1";',
              'import { staticArticles } from "./static-articles.js?v=20260807-yuanshen-images-1";'
          )
          marker = '''  const normalizedArticles = merged.map((article) => {\n    if (article.id === "celebrity-death-dream-spirit-five-checks") {'''
          injected = f'''  const normalizedArticles = merged.map((article) => {{\n    if (article.id === "yuanshen-destiny-archetype") {{\n      const fixedContent = String(article.content || "")\n        .replace(/stone-origin\\.svg(?:\\?[^)\\s\"']*)?/g, "stone-origin.jpg?v=20260807-direct-2")\n        .replace(/roc-awakening\\.svg(?:\\?[^)\\s\"']*)?/g, "roc-awakening.jpg?v=20260807-direct-2")\n        .replace(/nine-tailed-bird\\.svg(?:\\?[^)\\s\"']*)?/g, "nine-tailed-bird.jpg?v=20260807-direct-2");\n      return {{ ...article, coverImage: "{cover}", content: fixedContent }};\n    }}\n    if (article.id === "celebrity-death-dream-spirit-five-checks") {{'''
          if 'if (article.id === "yuanshen-destiny-archetype") {' not in text:
              if marker not in text:
                  raise SystemExit('articles.js normalization insertion point not found')
              text = text.replace(marker, injected, 1)
          p.write_text(text, encoding='utf-8')

          # 3) Bust article renderer cache.
          p = Path('articles.html')
          text = p.read_text(encoding='utf-8')
          old = 'articles.js?v=20260807-nested-cache-fix-1'
          new = 'articles.js?v=20260807-yuanshen-images-1'
          if old not in text and new not in text:
              raise SystemExit('articles.html articles.js version target not found')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          # 4) Bust static article module cache as well.
          p = Path('static-articles.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              './article-yuanshen-destiny-archetype.js?v=20260807-1',
              './article-yuanshen-destiny-archetype.js?v=20260807-images-2'
          )
          p.write_text(text, encoding='utf-8')

          # 5) Social preview metadata uses the same requested real cover URL.
          p = Path('article/yuanshen-destiny-archetype.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'https://lyyuan.tw/assets/articles/yuanshen-destiny-archetype/book-cover.svg?v=20260807-1',
              cover
          )
          p.write_text(text, encoding='utf-8')

          # Validation.
          static = Path('article-yuanshen-destiny-archetype.js').read_text(encoding='utf-8')
          for bad in ['stone-origin.svg', 'roc-awakening.svg', 'nine-tailed-bird.svg', 'book-cover.svg']:
              if bad in static:
                  raise SystemExit(f'Static article still contains {bad}')
          if cover not in static:
              raise SystemExit('Static article does not contain requested cover URL')

          renderer = Path('articles.js').read_text(encoding='utf-8')
          if 'yuanshen-destiny-archetype' not in renderer or 'stone-origin.jpg?v=20260807-direct-2' not in renderer or cover not in renderer:
              raise SystemExit('Firestore renderer override validation failed')
          if 'articles.js?v=20260807-yuanshen-images-1' not in Path('articles.html').read_text(encoding='utf-8'):
              raise SystemExit('articles.html cache version validation failed')
          PY

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-yuanshen-images-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix yuanshen article images and book cover"
          git pull --rebase origin main
          git push origin HEAD:main
