name: Publish secured Guanyin Renunciation article

on:
  push:
    branches: [main]
    paths:
      - "functions/publish-guanyin-renunciation.mjs"
      - "scripts/build-guanyin-illustrations.py"
      - "secure-imports/guanyin-renunciation-20261103.sealed.json"
      - "assets/articles/2026-guanyin-renunciation-suffering/**"
      - ".github/workflows/publish-guanyin-renunciation.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: secure-guanyin-renunciation-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout merged production source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Setup Python for illustration processing
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert secured article does not appear in public assets
        run: |
          test -s secure-imports/guanyin-renunciation-20261103.sealed.json
          if grep -RFl '拜觀世音菩薩的人，心裡往往藏著一個不太敢問出口的疑惑。' \
              articles.html static-articles.js assets/articles/2026-guanyin-renunciation-suffering 2>/dev/null; then
            echo "Private article text found in public site"
            exit 1
          fi
          node --check functions/publish-guanyin-renunciation.mjs
          node scripts/lock-paid-article-access-policy.mjs
          node scripts/audit-paid-article-runtime.mjs
          node scripts/audit-production-stability.mjs
      - name: Build first-party assets from author-provided images
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build-guanyin-illustrations.py
      - name: Create protected-review branch for the eight website assets
        id: images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles/2026-guanyin-renunciation-suffering/*.webp
          if git diff --cached --quiet; then
            echo "needs_pr=0" >> "$GITHUB_OUTPUT"
            echo "First-party images already committed"
          else
            echo "needs_pr=1" >> "$GITHUB_OUTPUT"
            branch="feat/guanyin-illustrations-20261103"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Image branch already exists; review and merge it through a pull request"
            else
              git checkout -b "$branch"
              git commit -m "Add the eight Guanyin article illustrations"
              git push origin HEAD:"$branch"
              echo "Created image-only branch; production remains locked until protected PR merge"
            fi
          fi
      - name: Stop publication until image PR has been merged
        if: steps.images.outputs.needs_pr == '1'
        run: echo "Images await protected PR merge. Private Firestore article not yet published."
      - name: Start Pages deployment including article images
        if: steps.images.outputs.needs_pr != '1'
        run: gh workflow run deploy.yml --ref main
      - name: Wait for public first-party images
        if: steps.images.outputs.needs_pr != '1'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 65); do
            cover_status="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 14 \
              "https://lyyuan.tw/assets/articles/2026-guanyin-renunciation-suffering/cover.webp?check=20261103" || true)"
            last_status="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 14 \
              "https://lyyuan.tw/assets/articles/2026-guanyin-renunciation-suffering/06-guanyin.webp?check=20261103" || true)"
            thumb_status="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 14 \
              "https://lyyuan.tw/assets/articles/2026-guanyin-renunciation-suffering/thumbnail-9x16.webp?check=20261103" || true)"
            if [[ "$cover_status" == 200 && "$last_status" == 200 && "$thumb_status" == 200 ]]; then
              echo "Cover, body illustrations and thumbnail are live"
              exit 0
            fi
            echo "Waiting for Pages... $attempt (cover $cover_status, body $last_status, thumb $thumb_status)"
            sleep 9
          done
          echo "Missing deployed images, refusing to publish article metadata"
          exit 1
      - name: Install Firebase admin dependencies
        if: steps.images.outputs.needs_pr != '1'
        run: npm --prefix functions ci
      - name: Publish Firestore public metadata plus private activity-only article body
        if: steps.images.outputs.needs_pr != '1'
        run: node functions/publish-guanyin-renunciation.mjs
      - name: Verify public article URL responds
        if: steps.images.outputs.needs_pr != '1'
        run: |
          curl -fIL --max-time 25 \
            "https://lyyuan.tw/article/guanyin-renunciation-suffering.html"
