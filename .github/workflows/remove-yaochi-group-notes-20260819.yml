name: Remove Yaochi group notes

on:
  push:
    paths:
      - '.github/workflows/remove-yaochi-group-notes-20260819.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove requested lines only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('yaochi-event-v2.html')
          s = p.read_text(encoding='utf-8')
          old = '''              <p>以上所有點燈芳名，均入疏文宣讀迴向。</p>\n              <p>以上護持功德金，請洽本院行政團隊 <a href="https://t.me/lyyuan" target="_blank" rel="noopener">Telegram</a>。</p>\n'''
          if old not in s:
              raise SystemExit('Target text not found; no change made')
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yaochi-event-v2.html
          git commit -m 'fix: remove duplicate yaochi group notes'
          git push
