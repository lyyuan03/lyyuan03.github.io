name: Production membership expiry migration

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Preview only, or back up and apply expiry conversions
        default: dry-run
        options: [dry-run, apply]
  push:
    branches: [fix/legacy-membership-expiry]
    paths: [.github/workflows/member-expiry-preflight.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: expiry-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    if: github.repository == 'lyyuan03/lyyuan03.github.io' && github.ref == 'refs/heads/fix/legacy-membership-expiry'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPLY_EXPIRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.operation == 'apply') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[apply-expiry-migration]')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful PR checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=pull_request&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Test membership expiry security" or .name == "Deploy to GitHub Pages")] | group_by(.name) | map(max_by(.id))' \
              > "$RUNNER_TEMP/expiry-checks.json"
            if jq -e 'length == 2 and all(.[]; .status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/expiry-checks.json" >/dev/null; then
              echo "Both PR workflows passed at $GITHUB_SHA."
              exit 0
            fi
            if jq -e 'any(.[]; .status == "completed" and .conclusion != "success")' "$RUNNER_TEMP/expiry-checks.json" >/dev/null; then
              echo "A required check failed. Production preview was not started."
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for successful PR checks."
          exit 1
      - name: Authenticate using the existing Firebase deployment identity
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read-only expiry preview
        run: >-
          python3 -B scripts/normalize-member-expiry.py
          --project lyyuan03-membership
          --report "$RUNNER_TEMP/member-expiry-preview.json"
      - name: Back up original dates privately and apply conversions
        if: env.APPLY_EXPIRY == 'true'
        run: >-
          python3 -B scripts/normalize-member-expiry.py
          --project lyyuan03-membership
          --report "$RUNNER_TEMP/member-expiry-applied.json"
          --backup-id "expiry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --apply
      - name: Verify no convertible or invalid dates remain
        if: env.APPLY_EXPIRY == 'true'
        shell: bash
        run: |
          python3 -B scripts/normalize-member-expiry.py \
            --project lyyuan03-membership --report "$RUNNER_TEMP/member-expiry-verified.json"
          jq -e '(.changes | length) == 0 and (.invalid | length) == 0' \
            "$RUNNER_TEMP/member-expiry-verified.json" >/dev/null
      - name: Rebuild canonical member entitlements after verified migration
        if: env.APPLY_EXPIRY == 'true'
        shell: bash
        run: |
          if ! python3 -B .github/scripts/rebuild-member-entitlements.py > "$RUNNER_TEMP/expiry-entitlements.log" 2>&1; then
            echo "Entitlement rebuild failed; detailed private log retained on this runner."
            exit 1
          fi
          grep '^Member entitlement rebuild complete:' "$RUNNER_TEMP/expiry-entitlements.log"
      - name: Publish counts only
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/member-expiry-preview.json" ]; then
            jq '{project, scanned, convertible: (.changes | length), invalid: (.invalid | length)}' \
              "$RUNNER_TEMP/member-expiry-preview.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/member-expiry-verified.json" ]; then
            jq '{phase: "after apply", project, scanned, convertible: (.changes | length), invalid: (.invalid | length)}' \
              "$RUNNER_TEMP/member-expiry-verified.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Full reports contain member identifiers: never publish them as Actions artifacts.
          # Apply requires an explicit dispatch choice or commit marker, and never deploys rules.
