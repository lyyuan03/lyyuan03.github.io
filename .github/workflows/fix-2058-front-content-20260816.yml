name: Fix 2058 frontend content source

on:
  push:
    paths:
      - ".github/workflows/fix-2058-front-content-20260816.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use latest GitHub body for 2058 article
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          core = 'articles-core-20260810-v6.js'
          replace(core,
              'import { staticArticles } from "./static-articles.js?v=20260816-six-images-1";',
              'import { staticArticles } from "./static-articles.js?v=20260816-2058-content-force-1";')
          replace(core,
              'if (future2058Static && future2058Firestore && future2058Firestore.staticSyncRevision !== "20260816-six-images-1") {',
              'if (future2058Static && future2058Firestore) {')
          replace(core,
              'const fixedContent = String(article.content || staticArticle?.content || "");',
              'const fixedContent = String(staticArticle?.content || article.content || "");')

          replace('static-articles.js',
              'import { futurePerson2058ProphecyArticle } from "./article-2058-future-person-prophecy.js?v=20260816-six-images-1";',
              'import { futurePerson2058ProphecyArticle } from "./article-2058-future-person-prophecy.js?v=20260816-2058-content-force-1";')

          replace('articles-v6.js',
              'await import("./articles-core-20260810-v6.js?v=20260816-six-images-1");',
              'await import("./articles-core-20260810-v6.js?v=20260816-2058-content-force-1");')

          replace('articles.html',
              '<script type="module" src="articles-v6.js?v=20260816-six-images-1"></script>',
              '<script type="module" src="articles-v6.js?v=20260816-2058-content-force-1"></script>')
          PY

      - name: Verify fix
        run: |
          grep -F 'if (future2058Static && future2058Firestore) {' articles-core-20260810-v6.js
          grep -F 'const fixedContent = String(staticArticle?.content || article.content || "");' articles-core-20260810-v6.js
          grep -F '20260816-2058-content-force-1' articles-core-20260810-v6.js static-articles.js articles-v6.js articles.html
          grep -F '一個人，同時說中了奧運金牌數、股災爆發的月份' article-2058-future-person-prophecy.js
          if grep -Fq '## 27，不是25，也不是28' article-2058-future-person-prophecy.js; then
            echo 'Old heading still exists in static article' >&2
            exit 1
          fi

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles-core-20260810-v6.js static-articles.js articles-v6.js articles.html
          git rm -f .github/workflows/fix-2058-front-content-20260816.yml
          git commit -m "Force latest 2058 article body on frontend"
          git pull --rebase origin main
          git push origin HEAD:main
