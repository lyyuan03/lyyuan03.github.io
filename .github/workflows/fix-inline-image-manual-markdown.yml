name: Fix inline image manual markdown editing

on:
  push:
    paths:
      - ".github/workflows/fix-inline-image-manual-markdown.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop editor from rewriting image Markdown
        shell: python
        run: |
          from pathlib import Path

          path = Path("article-inline-image-admin.js")
          text = path.read_text()
          old = "  const repairedContent = repairKnownArticleImages(input.value, activeId);\n  if (repairedContent !== input.value) input.value = repairedContent;\n  syncImages(input.value, activeId);"
          new = "  // 文章正文圖片 Markdown 以管理員手動編輯內容為準。\n  // 圖片管理器只讀取圖片與顯示設定，不得自動補回、換掉或依順序改寫圖片語法。\n  syncImages(input.value, activeId);"
          if old not in text:
              raise SystemExit("auto-repair render block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Verify behavior
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'const repairedContent = repairKnownArticleImages(input.value, activeId);' article-inline-image-admin.js
          ! grep -Fq 'if (repairedContent !== input.value) input.value = repairedContent;' article-inline-image-admin.js
          grep -Fq '圖片 Markdown 以管理員手動編輯內容為準' article-inline-image-admin.js
          grep -Fq 'syncImages(input.value, activeId);' article-inline-image-admin.js
          grep -Fq 'data-action="move"' article-inline-image-admin.js
          grep -Fq 'data-action="remove"' article-inline-image-admin.js
          grep -Fq 'saveSettings' article-inline-image-admin.js

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-inline-image-manual-markdown.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article-inline-image-admin.js .github/workflows/fix-inline-image-manual-markdown.yml
          git commit -m "停止後台自動改寫文章圖片語法"
          git pull --rebase origin main
          git push origin HEAD:main
