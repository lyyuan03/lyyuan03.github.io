name: Fix inline image manual markdown editing

on:
  push:
    paths:
      - ".github/workflows/fix-inline-image-manual-markdown.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove automatic Markdown image rewriting
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("article-inline-image-admin.js")
          text = path.read_text()
          original = text

          text, count_map = re.subn(
              r'const KNOWN_ARTICLE_IMAGE_REPAIRS = \{.*?\n\};\n\n',
              '',
              text,
              count=1,
              flags=re.S,
          )
          text, count_fn = re.subn(
              r'function repairKnownArticleImages\(content = "", id = ""\) \{.*?\n\}\n\n(?=function syncImages)',
              '',
              text,
              count=1,
              flags=re.S,
          )
          old_render = '''  activeId = articleId();
          const repairedContent = repairKnownArticleImages(input.value, activeId);
          if (repairedContent !== input.value) input.value = repairedContent;
          syncImages(input.value, activeId);'''
          new_render = '''  activeId = articleId();
          // 文章正文的圖片 Markdown 以管理員手動編輯內容為準。
          // 圖片管理器只讀取與管理顯示設定，不得自動補圖、換圖或改寫順序。
          syncImages(input.value, activeId);'''
          if old_render not in text:
              raise SystemExit("render auto-repair block not found")
          text = text.replace(old_render, new_render, 1)

          if count_map != 1 or count_fn != 1:
              raise SystemExit(f"unexpected repair block counts: map={count_map}, function={count_fn}")
          if "repairKnownArticleImages" in text or "KNOWN_ARTICLE_IMAGE_REPAIRS" in text:
              raise SystemExit("automatic repair code still remains")
          if text == original:
              raise SystemExit("no changes produced")

          path.write_text(text)

      - name: Verify behavior
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'repairKnownArticleImages' article-inline-image-admin.js
          ! grep -Fq 'KNOWN_ARTICLE_IMAGE_REPAIRS' article-inline-image-admin.js
          grep -Fq '圖片 Markdown 以管理員手動編輯內容為準' article-inline-image-admin.js
          grep -Fq 'syncImages(input.value, activeId);' article-inline-image-admin.js
          grep -Fq 'data-action="move"' article-inline-image-admin.js
          grep -Fq 'data-action="remove"' article-inline-image-admin.js
          grep -Fq 'saveSettings' article-inline-image-admin.js

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-inline-image-manual-markdown.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article-inline-image-admin.js .github/workflows/fix-inline-image-manual-markdown.yml
          git commit -m "停止後台自動改寫文章圖片語法"
          git pull --rebase origin main
          git push origin HEAD:main
