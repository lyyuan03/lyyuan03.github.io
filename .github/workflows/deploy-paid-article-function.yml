name: Deploy Secure Paid Article Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/paid-article-functions.js'
      - 'functions/main.js'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - '.github/workflows/deploy-paid-article-function.yml'

jobs:
  deploy-paid-article-function:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Verify backend source
        run: npm --prefix functions ci && npm --prefix functions test && npm --prefix functions run lint

      - name: Deploy only secure paid article callable
        run: |
          gcloud functions deploy getPaidArticleBody \
            --gen2 \
            --project=lyyuan03-membership \
            --region=asia-east1 \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=getPaidArticleBody \
            --trigger-http \
            --allow-unauthenticated \
            --quiet

      - name: Record successful secure function deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          mkdir -p .github/deploy-triggers
          {
            echo "secure paid article function: success"
            echo "run id: $GITHUB_RUN_ID"
            echo "source commit: $GITHUB_SHA"
            echo "completed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > .github/deploy-triggers/paid-article-function-success.txt
          rm -f .github/deploy-triggers/paid-article-function-failed.txt
          git add -A .github/deploy-triggers
          git commit -m "Record secure paid article function deployment" || true
          git push origin HEAD:main

      - name: Record secure function deployment failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .github/deploy-triggers
          {
            echo "secure paid article function: failed"
            echo "run id: $GITHUB_RUN_ID"
            echo "source commit: $GITHUB_SHA"
            echo "failed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > .github/deploy-triggers/paid-article-function-failed.txt
          git add .github/deploy-triggers/paid-article-function-failed.txt
          git commit -m "Record failed secure paid article function deployment" || true
          git push origin HEAD:main
