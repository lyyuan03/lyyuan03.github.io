name: Yuanshen Old Manuscript Limited Reading

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/yuanshen-old-manuscript-paid-draft.yml'
      - '.github/deploy-triggers/yuanshen-old-manuscript-limited-reading.txt'
  schedule:
    - cron: '0 14 30 8 *'

permissions:
  contents: read

concurrency:
  group: yuanshen-old-manuscript-limited-reading
  cancel-in-progress: false

jobs:
  transition:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: lyyuan03-membership
      ARTICLE_ID: yuanshen-awakening-old-manuscript
      ARTICLE_FILE: article-yuanshen-awakening-old-manuscript.js
      PUBLISHED_AT: '2026-08-30T02:00:00.000Z'
      EXPIRES_AT: '2026-08-30T14:00:00.000Z'
      TARGET_DATE_UTC: '2026-08-30'

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Resolve open or paid mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(date -u +%F)" != "$TARGET_DATE_UTC" ]]; then
            echo "mode=noop" >> "$GITHUB_OUTPUT"
            echo "The one-time transition date has passed; scheduled run is a no-op."
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          expires_epoch="$(date -u -d "$EXPIRES_AT" +%s)"
          if (( now_epoch >= expires_epoch )); then
            echo "mode=paid" >> "$GITHUB_OUTPUT"
            echo "The limited reading window has ended; sponsor-only access will be enforced."
          else
            echo "mode=open" >> "$GITHUB_OUTPUT"
            echo "The 12-hour limited reading window is active."
          fi

      - name: Prepare sanitized public preview
        if: steps.mode.outputs.mode != 'noop'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          source = Path(os.environ['ARTICLE_FILE']).read_text(encoding='utf-8')
          prefix = '  content: `'
          start = source.find(prefix)
          end = source.rfind('`\n};')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Article template literal not found.')

          body = source[start + len(prefix):end].strip()
          marker = '<!-- paid-only -->'
          if body.count(marker) != 1:
              raise SystemExit('The public article source must contain exactly one paid marker.')

          public, leaked_private = body.split(marker, 1)
          if leaked_private.strip():
              raise SystemExit('Private sponsor content must not remain in the public GitHub source.')
          if not public.strip():
              raise SystemExit('The public preview is empty.')

          Path('/tmp/public-preview.txt').write_text(public.strip() + '\n\n' + marker, encoding='utf-8')
          PY

      - name: Authenticate to Google Cloud
        if: steps.mode.outputs.mode != 'noop'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: steps.mode.outputs.mode != 'noop'
        uses: google-github-actions/setup-gcloud@v2

      - name: Load and verify secure sponsor body
        if: steps.mode.outputs.mode != 'noop'
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          PRIVATE_URL="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/paidArticleBodies/$ARTICLE_ID"
          HTTP_STATUS="$(curl --silent --show-error --output /tmp/private-current.json --write-out '%{http_code}' --header "Authorization: Bearer $ACCESS_TOKEN" "$PRIVATE_URL")"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            cat /tmp/private-current.json
            exit 1
          fi
          jq -r '.fields.content.stringValue // ""' /tmp/private-current.json > /tmp/private-content.txt
          test -s /tmp/private-content.txt
          test "$(jq -r '.fields.active.booleanValue // false' /tmp/private-current.json)" = "true"

          ARTICLE_READ_URL="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/articles/$ARTICLE_ID"
          HTTP_STATUS="$(curl --silent --show-error --output /tmp/article-before-restore.json --write-out '%{http_code}' --header "Authorization: Bearer $ACCESS_TOKEN" "$ARTICLE_READ_URL")"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            cat /tmp/article-before-restore.json
            exit 1
          fi
          jq -r '.fields.limitedReadingPreservedPublicPreview.stringValue // .fields.previousContentBackup.stringValue // ""' /tmp/article-before-restore.json > /tmp/restored-public-preview.txt
          test -s /tmp/restored-public-preview.txt
          test "$(grep -o '<!-- paid-only -->' /tmp/restored-public-preview.txt | wc -l | tr -d ' ')" = "1"
          mv /tmp/restored-public-preview.txt /tmp/public-preview.txt

      - name: Publish full article for the limited window
        if: steps.mode.outputs.mode == 'open'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          preview = Path('/tmp/public-preview.txt').read_text(encoding='utf-8').strip()
          private = Path('/tmp/private-content.txt').read_text(encoding='utf-8').strip()
          marker = '<!-- paid-only -->'
          if not preview.endswith(marker) or not private:
              raise SystemExit('Unable to assemble the limited-reading article safely.')
          Path('/tmp/limited-open-content.txt').write_text(preview + '\n\n' + private, encoding='utf-8')
          PY

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          NOW_ISO="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --rawfile content /tmp/limited-open-content.txt \
            --rawfile preview /tmp/public-preview.txt \
            --arg published "$PUBLISHED_AT" \
            --arg expires "$EXPIRES_AT" \
            --arg now "$NOW_ISO" \
            '{fields:{status:{stringValue:"published"},accessType:{stringValue:"open"},content:{stringValue:$content},privatePaidContent:{booleanValue:false},publishedAt:{timestampValue:$published},limitedReadingStartedAt:{timestampValue:$published},limitedReadingUntil:{timestampValue:$expires},limitedReadingDurationHours:{integerValue:"12"},postLimitedAccessType:{stringValue:"paid"},limitedReadingMode:{stringValue:"full-open-then-paid"},promotionType:{stringValue:"book-launch"},limitedReadingPreservedPublicPreview:{stringValue:$preview},updatedAt:{timestampValue:$now}}}' \
            > /tmp/article-open.json

          ARTICLE_URL="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/articles/$ARTICLE_ID?updateMask.fieldPaths=status&updateMask.fieldPaths=accessType&updateMask.fieldPaths=content&updateMask.fieldPaths=privatePaidContent&updateMask.fieldPaths=publishedAt&updateMask.fieldPaths=limitedReadingStartedAt&updateMask.fieldPaths=limitedReadingUntil&updateMask.fieldPaths=limitedReadingDurationHours&updateMask.fieldPaths=postLimitedAccessType&updateMask.fieldPaths=limitedReadingMode&updateMask.fieldPaths=promotionType&updateMask.fieldPaths=limitedReadingPreservedPublicPreview&updateMask.fieldPaths=updatedAt"
          HTTP_STATUS="$(curl --silent --show-error --output /tmp/article-open-response.json --write-out '%{http_code}' --request PATCH --header "Authorization: Bearer $ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/article-open.json "$ARTICLE_URL")"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            cat /tmp/article-open-response.json
            exit 1
          fi
          test "$(jq -r '.fields.status.stringValue' /tmp/article-open-response.json)" = "published"
          test "$(jq -r '.fields.accessType.stringValue' /tmp/article-open-response.json)" = "open"
          test "$(jq -r '.fields.privatePaidContent.booleanValue' /tmp/article-open-response.json)" = "false"

      - name: Convert article to sponsor-only access
        if: steps.mode.outputs.mode == 'paid'
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          NOW_ISO="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --rawfile content /tmp/public-preview.txt \
            --arg published "$PUBLISHED_AT" \
            --arg expires "$EXPIRES_AT" \
            --arg now "$NOW_ISO" \
            '{fields:{status:{stringValue:"published"},accessType:{stringValue:"paid"},content:{stringValue:$content},privatePaidContent:{booleanValue:true},publishedAt:{timestampValue:$published},limitedReadingStartedAt:{timestampValue:$published},limitedReadingUntil:{timestampValue:$expires},limitedReadingDurationHours:{integerValue:"12"},postLimitedAccessType:{stringValue:"paid"},limitedReadingMode:{stringValue:"full-open-then-paid"},limitedReadingCompletedAt:{timestampValue:$now},promotionType:{stringValue:"book-launch"},limitedReadingPreservedPublicPreview:{stringValue:$content},updatedAt:{timestampValue:$now}}}' \
            > /tmp/article-paid.json

          ARTICLE_URL="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/articles/$ARTICLE_ID?updateMask.fieldPaths=status&updateMask.fieldPaths=accessType&updateMask.fieldPaths=content&updateMask.fieldPaths=privatePaidContent&updateMask.fieldPaths=publishedAt&updateMask.fieldPaths=limitedReadingStartedAt&updateMask.fieldPaths=limitedReadingUntil&updateMask.fieldPaths=limitedReadingDurationHours&updateMask.fieldPaths=postLimitedAccessType&updateMask.fieldPaths=limitedReadingMode&updateMask.fieldPaths=limitedReadingCompletedAt&updateMask.fieldPaths=promotionType&updateMask.fieldPaths=limitedReadingPreservedPublicPreview&updateMask.fieldPaths=updatedAt"
          HTTP_STATUS="$(curl --silent --show-error --output /tmp/article-paid-response.json --write-out '%{http_code}' --request PATCH --header "Authorization: Bearer $ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/article-paid.json "$ARTICLE_URL")"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            cat /tmp/article-paid-response.json
            exit 1
          fi
          test "$(jq -r '.fields.status.stringValue' /tmp/article-paid-response.json)" = "published"
          test "$(jq -r '.fields.accessType.stringValue' /tmp/article-paid-response.json)" = "paid"
          test "$(jq -r '.fields.privatePaidContent.booleanValue' /tmp/article-paid-response.json)" = "true"

      - name: Synchronize every article record with the same slug
        if: steps.mode.outputs.mode != 'noop'
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          QUERY_URL="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents:runQuery"

          jq -n --arg slug "$ARTICLE_ID" '{
            structuredQuery: {
              from: [{collectionId: "articles"}],
              where: {
                fieldFilter: {
                  field: {fieldPath: "slug"},
                  op: "EQUAL",
                  value: {stringValue: $slug}
                }
              }
            }
          }' > /tmp/article-slug-query.json

          HTTP_STATUS="$(curl --silent --show-error --output /tmp/article-slug-results.json --write-out '%{http_code}' --request POST --header "Authorization: Bearer $ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/article-slug-query.json "$QUERY_URL")"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            cat /tmp/article-slug-results.json
            exit 1
          fi

          jq -r '.[].document.name // empty' /tmp/article-slug-results.json > /tmp/article-targets.txt
          echo "projects/$PROJECT_ID/databases/(default)/documents/articles/$ARTICLE_ID" >> /tmp/article-targets.txt
          sort -u /tmp/article-targets.txt -o /tmp/article-targets.txt
          test -s /tmp/article-targets.txt

          if [[ "${{ steps.mode.outputs.mode }}" == "open" ]]; then
            PAYLOAD=/tmp/article-open.json
            MASK='updateMask.fieldPaths=status&updateMask.fieldPaths=accessType&updateMask.fieldPaths=content&updateMask.fieldPaths=privatePaidContent&updateMask.fieldPaths=publishedAt&updateMask.fieldPaths=limitedReadingStartedAt&updateMask.fieldPaths=limitedReadingUntil&updateMask.fieldPaths=limitedReadingDurationHours&updateMask.fieldPaths=postLimitedAccessType&updateMask.fieldPaths=limitedReadingMode&updateMask.fieldPaths=promotionType&updateMask.fieldPaths=limitedReadingPreservedPublicPreview&updateMask.fieldPaths=updatedAt'
            EXPECTED_ACCESS=open
            EXPECTED_PRIVATE=false
          else
            PAYLOAD=/tmp/article-paid.json
            MASK='updateMask.fieldPaths=status&updateMask.fieldPaths=accessType&updateMask.fieldPaths=content&updateMask.fieldPaths=privatePaidContent&updateMask.fieldPaths=publishedAt&updateMask.fieldPaths=limitedReadingStartedAt&updateMask.fieldPaths=limitedReadingUntil&updateMask.fieldPaths=limitedReadingDurationHours&updateMask.fieldPaths=postLimitedAccessType&updateMask.fieldPaths=limitedReadingMode&updateMask.fieldPaths=limitedReadingCompletedAt&updateMask.fieldPaths=promotionType&updateMask.fieldPaths=limitedReadingPreservedPublicPreview&updateMask.fieldPaths=updatedAt'
            EXPECTED_ACCESS=paid
            EXPECTED_PRIVATE=true
          fi

          MATCH_COUNT=0
          while IFS= read -r document_name; do
            [[ -n "$document_name" ]] || continue
            MATCH_COUNT=$((MATCH_COUNT + 1))
            PATCH_URL="https://firestore.googleapis.com/v1/$document_name?$MASK"
            HTTP_STATUS="$(curl --silent --show-error --output /tmp/article-slug-patch.json --write-out '%{http_code}' --request PATCH --header "Authorization: Bearer $ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @"$PAYLOAD" "$PATCH_URL")"
            if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
              cat /tmp/article-slug-patch.json
              exit 1
            fi
            test "$(jq -r '.fields.status.stringValue' /tmp/article-slug-patch.json)" = "published"
            test "$(jq -r '.fields.accessType.stringValue' /tmp/article-slug-patch.json)" = "$EXPECTED_ACCESS"
            test "$(jq -r '.fields.privatePaidContent.booleanValue' /tmp/article-slug-patch.json)" = "$EXPECTED_PRIVATE"
          done < /tmp/article-targets.txt

          echo "Synchronized $MATCH_COUNT article record(s) for slug $ARTICLE_ID."

      - name: Keep secure sponsor body active
        if: steps.mode.outputs.mode != 'noop'
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          NOW_ISO="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PRIVATE_URL="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/paidArticleBodies/$ARTICLE_ID"
          jq -n --arg now "$NOW_ISO" '{fields:{status:{stringValue:"published"},active:{booleanValue:true},updatedAt:{timestampValue:$now}}}' > /tmp/private-meta.json
          PATCH_URL="$PRIVATE_URL?updateMask.fieldPaths=status&updateMask.fieldPaths=active&updateMask.fieldPaths=updatedAt"
          HTTP_STATUS="$(curl --silent --show-error --output /tmp/private-meta-response.json --write-out '%{http_code}' --request PATCH --header "Authorization: Bearer $ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/private-meta.json "$PATCH_URL")"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            cat /tmp/private-meta-response.json
            exit 1
          fi
          test "$(jq -r '.fields.status.stringValue' /tmp/private-meta-response.json)" = "published"
          test "$(jq -r '.fields.active.booleanValue' /tmp/private-meta-response.json)" = "true"

      - name: Report final mode
        if: steps.mode.outputs.mode != 'noop'
        run: echo "Article transition completed in ${{ steps.mode.outputs.mode }} mode; deadline is 2026-08-30 22:00 Asia/Taipei."
