name: Yuanshen Old Manuscript Paid Draft Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'article-yuanshen-awakening-old-manuscript.js'

permissions:
  contents: write

jobs:
  sync-paid-draft:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: lyyuan03-membership
      ARTICLE_ID: yuanshen-awakening-old-manuscript
      ARTICLE_FILE: article-yuanshen-awakening-old-manuscript.js
      STATIC_FILE: static-articles.js
      TITLE: 一段被拿掉的舊稿

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare sponsor draft split
        id: split
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re

          path = Path(os.environ['ARTICLE_FILE'])
          source = path.read_text(encoding='utf-8')
          marker = '<!-- paid-only -->'
          prefix = '  content: `'
          start = source.find(prefix)
          end = source.rfind('`\n};')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Article template literal not found.')
          body_start = start + len(prefix)
          body = source[body_start:end]

          if marker not in body:
              raise SystemExit('Paid marker missing.')
          public, private = body.split(marker, 1)
          public = public.strip()
          private = private.strip()

          if not public:
              raise SystemExit('Sponsor draft must keep a public preview before paid marker.')

          if not private:
              Path('/tmp/state').write_text('already-sanitized', encoding='utf-8')
              Path('/tmp/public-content.txt').write_text(public + '\n\n' + marker, encoding='utf-8')
              raise SystemExit(0)

          digest = hashlib.sha256(private.encode('utf-8')).hexdigest()
          safe = public + '\n\n' + marker
          Path('/tmp/private-content.txt').write_text(private, encoding='utf-8')
          Path('/tmp/public-content.txt').write_text(safe, encoding='utf-8')
          Path('/tmp/content-hash.txt').write_text(digest, encoding='utf-8')
          Path('/tmp/state').write_text('convert', encoding='utf-8')

          clean = source[:body_start] + safe + source[end:]
          clean = re.sub(r'  updatedAt: "[^"]+",', '  updatedAt: "2026-08-29T00:55:00.000Z",', clean, count=1)
          Path('/tmp/sanitized-article.js').write_text(clean, encoding='utf-8')
          PY
          echo "state=$(cat /tmp/state)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync secure sponsor draft to Firestore
        if: steps.split.outputs.state == 'convert'
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          NOW_ISO="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          HASH="$(cat /tmp/content-hash.txt)"
          PRIVATE_URL="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/paidArticleBodies/$ARTICLE_ID"

          CURRENT_STATUS="$(curl --silent --show-error --output /tmp/private-current.json --write-out '%{http_code}' --header "Authorization: Bearer $ACCESS_TOKEN" "$PRIVATE_URL")"
          if [[ "$CURRENT_STATUS" == "200" ]]; then
            PREVIOUS_HASH="$(jq -r '.fields.contentHash.stringValue // ""' /tmp/private-current.json)"
            PREVIOUS_VERSION="$(jq -r '.fields.contentVersion.integerValue // "0"' /tmp/private-current.json)"
          elif [[ "$CURRENT_STATUS" == "404" ]]; then
            PREVIOUS_HASH=""
            PREVIOUS_VERSION=0
          else
            cat /tmp/private-current.json
            exit 1
          fi

          if [[ "$PREVIOUS_HASH" == "$HASH" && "$PREVIOUS_VERSION" -gt 0 ]]; then
            VERSION="$PREVIOUS_VERSION"
          else
            VERSION=$((PREVIOUS_VERSION + 1))
          fi

          jq -n             --rawfile content /tmp/private-content.txt             --arg articleId "$ARTICLE_ID"             --arg title "$TITLE"             --arg hash "$HASH"             --arg version "$VERSION"             --arg now "$NOW_ISO"             '{fields:{articleId:{stringValue:$articleId},title:{stringValue:$title},status:{stringValue:"draft"},content:{stringValue:$content},contentHash:{stringValue:$hash},contentVersion:{integerValue:$version},source:{stringValue:"github-paid-draft-sync:20260829"},active:{booleanValue:true},updatedAt:{timestampValue:$now}}}'             > /tmp/private-write.json

          PRIVATE_PATCH_URL="$PRIVATE_URL?updateMask.fieldPaths=articleId&updateMask.fieldPaths=title&updateMask.fieldPaths=status&updateMask.fieldPaths=content&updateMask.fieldPaths=contentHash&updateMask.fieldPaths=contentVersion&updateMask.fieldPaths=source&updateMask.fieldPaths=active&updateMask.fieldPaths=updatedAt"
          HTTP_STATUS="$(curl --silent --show-error --output /tmp/private-response.json --write-out '%{http_code}' --request PATCH --header "Authorization: Bearer $ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/private-write.json "$PRIVATE_PATCH_URL")"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            cat /tmp/private-response.json
            exit 1
          fi
          test "$(jq -r '.fields.contentHash.stringValue' /tmp/private-response.json)" = "$HASH"

          jq -n             --rawfile content /tmp/public-content.txt             --arg hash "$HASH"             --arg version "$VERSION"             --arg now "$NOW_ISO"             '{fields:{title:{stringValue:"一段被拿掉的舊稿"},slug:{stringValue:"yuanshen-awakening-old-manuscript"},category:{stringValue:"spiritual"},displayCategory:{stringValue:"靈修"},series:{stringValue:"靈修辨證"},status:{stringValue:"draft"},accessType:{stringValue:"paid"},content:{stringValue:$content},privatePaidContent:{booleanValue:true},paidContentHash:{stringValue:$hash},paidContentVersion:{integerValue:$version},coverImage:{stringValue:"https://wsrv.nl/?w=1200&output=webp&q=90&url=https%3A%2F%2Fwww.books.com.tw%2Fimg%2F001%2F106%2F00%2F0011060075.jpg"},excerpt:{stringValue:"一本剛出版的新書，讓我重新想起二十多年前一段曾被出版社拿掉的舊稿。多年後再看，那件事留下的影響，早已不是當年的爭議本身。"},readingLevel:{stringValue:"深度"},bookTitle:{stringValue:"我在人間的元神覺醒"},bookAuthor:{stringValue:"宇色 Osel"},bookPublisher:{stringValue:"柿子文化"},bookPurchaseUrl:{stringValue:"https://www.books.com.tw/products/0011060075?sloc=main"},bookCoverImage:{stringValue:"https://wsrv.nl/?w=480&output=webp&q=88&url=https%3A%2F%2Fwww.books.com.tw%2Fimg%2F001%2F106%2F00%2F0011060075.jpg"},topics:{arrayValue:{values:[{stringValue:"元神覺醒"},{stringValue:"靈修辨識"},{stringValue:"自我認識"}]}},updatedAt:{timestampValue:$now}}}'             > /tmp/article-write.json

          ARTICLE_URL="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/articles/$ARTICLE_ID"
          HTTP_STATUS="$(curl --silent --show-error --output /tmp/article-response.json --write-out '%{http_code}' --request PATCH --header "Authorization: Bearer $ACCESS_TOKEN" --header 'Content-Type: application/json' --data-binary @/tmp/article-write.json "$ARTICLE_URL")"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            cat /tmp/article-response.json
            exit 1
          fi
          test "$(jq -r '.fields.status.stringValue' /tmp/article-response.json)" = "draft"
          test "$(jq -r '.fields.accessType.stringValue' /tmp/article-response.json)" = "paid"
          test "$(jq -r '.fields.privatePaidContent.booleanValue' /tmp/article-response.json)" = "true"

      - name: Sanitize public source and refresh cache
        if: steps.split.outputs.state == 'convert'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/sanitized-article.js "$ARTICLE_FILE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('static-articles.js')
          text = p.read_text(encoding='utf-8')
          old = './article-yuanshen-awakening-old-manuscript.js?v=20260828-five-story-images-1'
          new = './article-yuanshen-awakening-old-manuscript.js?v=20260829-paid-draft-format-1'
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected cache token not found.')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
          node --check "$ARTICLE_FILE"
          node --check "$STATIC_FILE"
          test "$(grep -c '<!-- paid-only -->' "$ARTICLE_FILE")" = "1"
          grep -F 'status: "draft"' "$ARTICLE_FILE"
          grep -F 'accessType: "paid"' "$ARTICLE_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ARTICLE_FILE" "$STATIC_FILE"
          git diff --cached --quiet && exit 0
          git commit -m "Secure yuanshen old manuscript sponsor draft"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify already-sanitized draft
        if: steps.split.outputs.state == 'already-sanitized'
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          PRIVATE_URL="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/paidArticleBodies/$ARTICLE_ID"
          HTTP_STATUS="$(curl --silent --show-error --output /tmp/private-existing.json --write-out '%{http_code}' --header "Authorization: Bearer $ACCESS_TOKEN" "$PRIVATE_URL")"
          test "$HTTP_STATUS" = "200"
          test "$(jq -r '.fields.status.stringValue' /tmp/private-existing.json)" = "draft"
          test -n "$(jq -r '.fields.content.stringValue // empty' /tmp/private-existing.json)"
