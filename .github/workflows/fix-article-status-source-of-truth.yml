name: Fix article status source of truth

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-article-status-source-of-truth.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Firestore article status authoritative
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('articles.js')
          text = path.read_text(encoding='utf-8')

          old_import = 'import { collection, doc, getDoc, getDocs, query, runTransaction, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";'
          new_import = 'import { collection, doc, getDoc, getDocs, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";'

          old_block = '''  let articles = [];
          try {
            const publishedQuery = query(collection(db, "articles"), where("status", "==", "published"));
            const snapshot = await getDocs(publishedQuery);
            articles = snapshot.docs
              .map((item) => ({ id: item.id, ...item.data() }))
              .filter((article) => article.hidden !== true && article.systemRecord !== true)
              .sort(sortPublished);
          } catch (error) {
            console.warn("Firebase 文章暫時無法載入，改顯示靜態文章。", error);
          }
          // 同 ID 文章採最後更新版本；時間相同時以 Firestore 為準，靜態文章仍可作為備援。
          const mergedById = new Map(staticArticles.map((article) => [article.id, article]));
          articles.forEach((article) => {
            const staticArticle = mergedById.get(article.id);
            const firestoreTime = getTimeValue(article.updatedAt) || getTimeValue(article.publishedAt);
            const staticTime = getTimeValue(staticArticle?.updatedAt) || getTimeValue(staticArticle?.publishedAt);
            if (!staticArticle || firestoreTime >= staticTime) mergedById.set(article.id, article);
          });
          const merged = [...mergedById.values()];'''

          new_block = '''  let firestoreArticles = [];
          try {
            const snapshot = await getDocs(collection(db, "articles"));
            firestoreArticles = snapshot.docs
              .map((item) => ({ id: item.id, ...item.data() }));
          } catch (error) {
            console.warn("Firebase 文章暫時無法載入，改顯示靜態文章。", error);
          }
          // Firestore 只要存在同 ID 文件，就一律覆蓋靜態資料；靜態文章僅在 Firestore 無該文件時備援。
          const mergedById = new Map(staticArticles.map((article) => [article.id, article]));
          firestoreArticles.forEach((article) => {
            mergedById.set(article.id, article);
          });
          const merged = [...mergedById.values()].filter((article) =>
            article.status === "published"
            && article.hidden !== true
            && article.systemRecord !== true
          );'''

          if text.count(old_import) != 1:
            raise SystemExit(f'Expected exactly one old Firestore import, found {text.count(old_import)}')
          if text.count(old_block) != 1:
            raise SystemExit(f'Expected exactly one old load/merge block, found {text.count(old_block)}')

          text = text.replace(old_import, new_import, 1)
          text = text.replace(old_block, new_block, 1)

          if 'where(' in text or 'query(' in text:
            raise SystemExit('Unused Firestore query helpers remain after patch')
          if 'article.status === "published"' not in text:
            raise SystemExit('Published-status filter was not installed')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax and patch
        run: |
          node --check articles.js
          git diff --check
          grep -F 'const snapshot = await getDocs(collection(db, "articles"));' articles.js
          grep -F 'article.status === "published"' articles.js
          ! grep -F 'where(' articles.js
          ! grep -F 'query(' articles.js

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: make Firestore article status authoritative'
          file_pattern: articles.js
