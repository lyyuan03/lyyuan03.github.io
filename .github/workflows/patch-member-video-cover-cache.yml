name: Patch member video cover cache

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-member-video-cover-cache.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "member-video-cover-patch"
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch cache versions and cover field compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "admin.html": [
                  ("member-video-admin.js?v=20260801-private-youtube-1", "member-video-admin.js?v=20260805-cover-upload-4"),
              ],
              "member-videos.html": [
                  ("member-videos.js?v=20260802-sponsor-exclusive-1", "member-videos.js?v=20260805-cover-display-4"),
              ],
              "member-videos.js": [
                  ("const coverUrl = safeHttpsUrl(video.coverImageUrl);", "const coverUrl = safeHttpsUrl(video.coverImageUrl || video.coverUrl || video.thumbnailUrl || video.coverImage || \"\");"),
              ],
              "member-video-admin.js": [
                  ("coverUrlInput.value = safeCoverUrl(video.coverImageUrl || \"\");", "coverUrlInput.value = safeCoverUrl(video.coverImageUrl || video.coverUrl || video.thumbnailUrl || video.coverImage || \"\");"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/patch-member-video-cover-cache.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html member-videos.html member-videos.js member-video-admin.js .github/workflows/patch-member-video-cover-cache.yml
          git commit -m "修正會員影片封面載入與快取"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
