name: One-time sponsor qualification confirmation fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-sponsor-confirm-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove duplicate checkout loader and bump cache versions
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) 文選入口只保留購買框 UI addon；付款判定只由 sponsor-checkout.js 啟動一次。
          path = Path('articles-v6.js')
          text = path.read_text(encoding='utf-8')
          duplicate = '    ["贊助方案", "./sponsor-checkout-v3.js?v=20260812-static-first-fix-6"],\n'
          if duplicate not in text:
              raise SystemExit('articles-v6.js: duplicate sponsor checkout import target not found')
          text = text.replace(duplicate, '', 1)
          path.write_text(text, encoding='utf-8')

          # 2) sponsor-checkout.js 指向新的唯一版本，避免瀏覽器沿用舊模組快取。
          path = Path('sponsor-checkout.js')
          text = path.read_text(encoding='utf-8')
          old = 'import "./sponsor-checkout-v3.js?v=20260808-email-renewal-1";'
          new = 'import "./sponsor-checkout-v3.js?v=20260812-confirm-fix-8";'
          if old not in text:
              raise SystemExit('sponsor-checkout.js: old version target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 3) 最外層兩個入口一起換 cache key，確保正式站抓到本次修正版。
          path = Path('articles.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'articles-v6.js?v=20260812-2058-visual-1': 'articles-v6.js?v=20260812-confirm-fix-8',
              '/sponsor-checkout.js?v=20260805-public-sync-1': '/sponsor-checkout.js?v=20260812-confirm-fix-8',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'articles.html: expected one {old}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify the duplicate loader is gone
        run: |
          if grep -Fq 'sponsor-checkout-v3.js' articles-v6.js; then
            echo 'articles-v6.js still loads sponsor-checkout-v3.js directly' >&2
            exit 1
          fi
          grep -F 'sponsor-checkout-v3.js?v=20260812-confirm-fix-8' sponsor-checkout.js
          grep -F 'articles-v6.js?v=20260812-confirm-fix-8' articles.html
          grep -F '/sponsor-checkout.js?v=20260812-confirm-fix-8' articles.html
          node --check articles-v6.js
          node --check sponsor-checkout.js
          node --check sponsor-checkout-v3.js

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "lyyuan03"
          git config user.email "lyyuan03@gmail.com"
          git rm .github/workflows/one-time-sponsor-confirm-fix.yml
          git add articles-v6.js sponsor-checkout.js articles.html
          git commit -m "fix: stop duplicate sponsor checkout qualification loop"
          git pull --rebase origin main
          git push origin main
