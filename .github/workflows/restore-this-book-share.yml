name: Restore this-book article share bar

on:
  push:
    paths:
      - '.github/workflows/restore-this-book-share.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message == 'Trigger share restoration workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore share bar
        shell: python
        run: |
          from pathlib import Path

          path = Path('article/this-book-took-thirty-years-v5.html')
          text = path.read_text(encoding='utf-8')

          if 'id="article-share-restored-v1"' not in text:
              share_css = r'''
<style id="article-share-restored-v1">
.article-share-restored{margin:34px 0 30px;padding:20px 0 4px;border-top:1px solid rgba(89,79,71,.18)}
.article-share-restored-title{margin:0 0 12px;color:#725c42;font:500 12px/1.5 var(--sans);letter-spacing:.12em}
.article-share-restored-actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px}
.article-share-restored .article-share-icon{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:1px solid rgba(89,79,71,.2);border-radius:50%;color:#fff;text-decoration:none;cursor:pointer;font:700 13px/1 Arial,sans-serif;box-shadow:0 3px 9px rgba(48,42,35,.12);transition:transform .2s,filter .2s,opacity .2s}
.article-share-restored .article-share-icon:hover,.article-share-restored .article-share-icon:focus-visible{transform:translateY(-2px);filter:brightness(1.06);outline:none}
.article-share-restored .facebook{background:#1877F2}.article-share-restored .instagram{background:linear-gradient(135deg,#833AB4 5%,#C13584 38%,#E1306C 60%,#F77737 82%,#FCAF45 100%)}.article-share-restored .line{background:#06C755}.article-share-restored .telegram{background:#229ED9}.article-share-restored .email{background:#D86A4A}.article-share-restored .copy{background:#8B683F}
.article-share-restored-status{min-height:1.4em;margin-top:9px;color:#5f4a33;font:500 12px/1.4 var(--sans);letter-spacing:.04em}
@media(max-width:520px){.article-share-restored{margin-top:28px}.article-share-restored .article-share-icon{width:42px;height:42px}}
</style>
'''
              text = text.replace('</head>', share_css + '\n</head>', 1)

          if 'class="article-share-restored"' not in text:
              share_html = r'''
<div class="article-share-restored" aria-label="文章分享">
  <p class="article-share-restored-title">分享這篇文章</p>
  <div class="article-share-restored-actions">
    <a class="article-share-icon facebook" href="https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Flyyuan.tw%2Farticle%2Fthis-book-took-thirty-years.html" target="_blank" rel="noopener noreferrer" aria-label="分享到 Facebook" title="Facebook">f</a>
    <a class="article-share-icon instagram" href="https://www.instagram.com/lyyuan03/" target="_blank" rel="noopener noreferrer" aria-label="前往靈元院 Instagram" title="Instagram">◎</a>
    <a class="article-share-icon line" href="https://social-plugins.line.me/lineit/share?url=https%3A%2F%2Flyyuan.tw%2Farticle%2Fthis-book-took-thirty-years.html" target="_blank" rel="noopener noreferrer" aria-label="分享到 LINE" title="LINE">L</a>
    <a class="article-share-icon telegram" href="https://t.me/share/url?url=https%3A%2F%2Flyyuan.tw%2Farticle%2Fthis-book-took-thirty-years.html&text=%E9%80%99%E6%9C%AC%E6%9B%B8%EF%BC%8C%E6%88%91%E5%AF%AB%E4%BA%86%E4%B8%89%E5%8D%81%E5%B9%B4" target="_blank" rel="noopener noreferrer" aria-label="分享到 Telegram" title="Telegram">T</a>
    <a class="article-share-icon email" href="mailto:?subject=%E9%80%99%E6%9C%AC%E6%9B%B8%EF%BC%8C%E6%88%91%E5%AF%AB%E4%BA%86%E4%B8%89%E5%8D%81%E5%B9%B4&body=https%3A%2F%2Flyyuan.tw%2Farticle%2Fthis-book-took-thirty-years.html" aria-label="用 Email 分享" title="Email">@</a>
    <button class="article-share-icon copy article-share-copy-restored" type="button" data-share-url="https://lyyuan.tw/article/this-book-took-thirty-years.html" aria-label="複製文章連結" title="複製連結">⧉</button>
  </div>
  <div class="article-share-restored-status" role="status" aria-live="polite"></div>
</div>
'''
              marker = '<div class="article-book-link-wrap">'
              if marker not in text:
                  raise SystemExit('article book link marker not found')
              text = text.replace(marker, share_html + '\n' + marker, 1)

          if 'article-share-copy-restored' in text and 'bindRestoredArticleShare' not in text:
              share_js = r'''
<script>
(function bindRestoredArticleShare(){
  const button=document.querySelector('.article-share-copy-restored');
  const status=document.querySelector('.article-share-restored-status');
  if(!button)return;
  button.addEventListener('click',async()=>{
    const url=button.dataset.shareUrl;
    try{
      await navigator.clipboard.writeText(url);
      if(status)status.textContent='已複製連結';
    }catch(error){
      window.prompt('請複製文章連結',url);
    }
  });
})();
</script>
'''
              text = text.replace('</body>', share_js + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit restored share bar
        run: |
          if git diff --quiet -- article/this-book-took-thirty-years-v5.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article/this-book-took-thirty-years-v5.html
          git commit -m "Restore article share actions"
          git push