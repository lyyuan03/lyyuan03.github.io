name: Debug live article

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/debug-live-article.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect live files and browser execution
        shell: bash
        run: |
          set -u
          URL='https://lyyuan.tw/articles.html?id=how-to-judge-true-lingxiu-understanding&debug=202608051710'
          echo '=== PAGE HEADERS ==='
          curl -sSIL "$URL" || true
          echo '=== LIVE SCRIPT TAGS ==='
          curl -sS "$URL" | grep -oE 'src="[^"]+"' | tail -n 10 || true
          echo '=== LIVE ARTICLES.JS RENDER BLOCK ==='
          curl -sS 'https://lyyuan.tw/articles.js?v=20260805-loading-fix-1' | grep -A12 -B5 '文章內容優先顯示' || true

          python -m pip install --quiet selenium
          python - <<'PY'
          import json
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          urls = [
              'https://lyyuan.tw/articles.html?id=how-to-judge-true-lingxiu-understanding',
              'https://lyyuan.tw/articles.html?id=how-to-judge-true-lingxiu-understanding&debug=202608051710',
          ]

          for url in urls:
              print('\n=== BROWSER TEST', url, '===')
              options = Options()
              options.add_argument('--headless=new')
              options.add_argument('--no-sandbox')
              options.add_argument('--disable-dev-shm-usage')
              options.add_argument('--disable-gpu')
              options.add_argument('--window-size=1600,1200')
              options.set_capability('goog:loggingPrefs', {'browser': 'ALL'})
              driver = webdriver.Chrome(options=options)
              try:
                  driver.get(url)
                  time.sleep(15)
                  result = driver.execute_script('''
                    const root = document.getElementById('article-root');
                    const tabs = document.getElementById('category-tabs');
                    return {
                      readyState: document.readyState,
                      title: document.title,
                      rootText: root ? root.innerText.slice(0, 1200) : null,
                      rootHTMLStart: root ? root.innerHTML.slice(0, 500) : null,
                      tabsHidden: tabs ? tabs.hidden : null,
                      bodyClass: document.body.className,
                      scripts: [...document.scripts].map(s => s.src).filter(Boolean),
                    };
                  ''')
                  print(json.dumps(result, ensure_ascii=False, indent=2))
                  logs = driver.get_log('browser')
                  print('=== CONSOLE LOGS ===')
                  print(json.dumps(logs, ensure_ascii=False, indent=2))
                  driver.save_screenshot('/tmp/article-debug.png')
              finally:
                  driver.quit()
          PY
