name: Publish Wuji chanyi 2026 protected full text
on:
  push:
    branches: [main]
    paths:
      - functions/publish-wuji-chanyi-2026.mjs
      - secure-imports/wuji-chanyi-2026.enc.json
      - .github/workflows/publish-wuji-chanyi-2026.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - name: Write protected chanyi full text (articles shell + eventArticleBodies)
        run: node functions/publish-wuji-chanyi-2026.mjs
