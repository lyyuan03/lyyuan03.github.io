name: Add 2058 article generated images

on:
  push:
    paths:
      - ".github/workflows/add-2058-article-images-20260816.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Decode and validate generated images
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          src = Path('.github/image-rebuild-temp')
          dst = Path('assets/articles/2058-future-person-prophecy')
          dst.mkdir(parents=True, exist_ok=True)

          def read(name):
              return (src / name).read_text(encoding='utf-8').strip()

          encoded = {
              'fictional-female-politician.webp': (
                  read('add2058-female.00.b64')[:3000]
                  + ''.join(read(f'add2058-female.{i:02d}.b64') for i in range(1, 6))
              ),
              'japanese-stadium-championship.webp': ''.join(
                  read(f'add2058-sports.{i:02d}.b64') for i in range(10)
              ),
              'collective-consciousness-network.webp': (
                  ''.join(read(f'add2058-collective.{i:02d}.b64') for i in range(3))
                  + read('add2058-collective.03.b64')[:12000]
                  + read('add2058-collective.04.b64')
              ),
          }

          expected_sizes = {
              'fictional-female-politician.webp': 13126,
              'japanese-stadium-championship.webp': 41584,
              'collective-consciousness-network.webp': 42268,
          }

          def webp_dimensions(data):
              fourcc = data[12:16]
              chunk = data[20:]
              if fourcc == b'VP8 ':
                  if len(chunk) < 10 or chunk[3:6] != b'\x9d\x01\x2a':
                      raise ValueError('invalid VP8 frame header')
                  return int.from_bytes(chunk[6:8], 'little') & 0x3fff, int.from_bytes(chunk[8:10], 'little') & 0x3fff
              if fourcc == b'VP8L':
                  if len(chunk) < 5 or chunk[0] != 0x2f:
                      raise ValueError('invalid VP8L frame header')
                  w = 1 + (((chunk[2] & 0x3f) << 8) | chunk[1])
                  h = 1 + (((chunk[4] & 0x0f) << 10) | (chunk[3] << 2) | ((chunk[2] & 0xc0) >> 6))
                  return w, h
              if fourcc == b'VP8X':
                  if len(chunk) < 10:
                      raise ValueError('invalid VP8X frame header')
                  return 1 + int.from_bytes(chunk[4:7], 'little'), 1 + int.from_bytes(chunk[7:10], 'little')
              raise ValueError(f'unsupported WebP chunk {fourcc!r}')

          for name, b64 in encoded.items():
              data = base64.b64decode(b64, validate=True)
              expected_size = expected_sizes[name]
              if len(data) != expected_size:
                  raise SystemExit(f'{name}: size {len(data)} != {expected_size}')
              if not (data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
                  raise SystemExit(f'{name}: invalid WebP header')
              declared = int.from_bytes(data[4:8], 'little') + 8
              if declared != len(data):
                  raise SystemExit(f'{name}: RIFF declares {declared}, actual {len(data)}')
              width, height = webp_dimensions(data)
              if (width, height) != (800, 450):
                  raise SystemExit(f'{name}: dimensions {width}x{height} != 800x450')
              sha = hashlib.sha256(data).hexdigest()
              (dst / name).write_bytes(data)
              print(f'OK {name}: {len(data)} bytes, {width}x{height}, sha256={sha}')
          PY

      - name: Commit images and clean staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles/2058-future-person-prophecy/fictional-female-politician.webp \
                  assets/articles/2058-future-person-prophecy/japanese-stadium-championship.webp \
                  assets/articles/2058-future-person-prophecy/collective-consciousness-network.webp
          git rm -f .github/image-rebuild-temp/add2058-*.b64
          git rm -f .github/workflows/add-2058-article-images-20260816.yml
          git commit -m "Add generated 2058 article images"
          git pull --rebase origin main
          git push origin HEAD:main
