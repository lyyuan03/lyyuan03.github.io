name: Add 2058 article generated images

on:
  push:
    paths:
      - ".github/workflows/add-2058-article-images-20260816.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Decode and validate generated images
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          src = Path('.github/image-rebuild-temp')
          dst = Path('assets/articles/2058-future-person-prophecy')
          dst.mkdir(parents=True, exist_ok=True)

          specs = {
              'add2058-female': ('fictional-female-politician.webp', 13126),
              'add2058-sports': ('japanese-stadium-championship.webp', 41584),
              'add2058-collective': ('collective-consciousness-network.webp', 42268),
          }

          def webp_dimensions(data):
              fourcc = data[12:16]
              chunk = data[20:]
              if fourcc == b'VP8 ':
                  if len(chunk) < 10 or chunk[3:6] != b'\x9d\x01\x2a':
                      raise ValueError('invalid VP8 frame header')
                  return int.from_bytes(chunk[6:8], 'little') & 0x3fff, int.from_bytes(chunk[8:10], 'little') & 0x3fff
              if fourcc == b'VP8L':
                  if len(chunk) < 5 or chunk[0] != 0x2f:
                      raise ValueError('invalid VP8L frame header')
                  w = 1 + (((chunk[2] & 0x3f) << 8) | chunk[1])
                  h = 1 + (((chunk[4] & 0x0f) << 10) | (chunk[3] << 2) | ((chunk[2] & 0xc0) >> 6))
                  return w, h
              if fourcc == b'VP8X':
                  if len(chunk) < 10:
                      raise ValueError('invalid VP8X frame header')
                  return 1 + int.from_bytes(chunk[4:7], 'little'), 1 + int.from_bytes(chunk[7:10], 'little')
              raise ValueError(f'unsupported WebP chunk {fourcc!r}')

          for prefix, (name, expected_size) in specs.items():
              parts = sorted(src.glob(f'{prefix}.*.b64'))
              if not parts:
                  raise SystemExit(f'No chunks for {prefix}')
              all_b64 = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              needed_chars = ((expected_size + 2) // 3) * 4
              decoded = base64.b64decode(all_b64[:needed_chars], validate=True)
              if len(decoded) < expected_size:
                  raise SystemExit(f'{name}: decoded only {len(decoded)} bytes, need {expected_size}')
              data = decoded[:expected_size]
              if not (data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
                  raise SystemExit(f'{name}: invalid WebP header')
              declared = int.from_bytes(data[4:8], 'little') + 8
              if declared != expected_size:
                  raise SystemExit(f'{name}: RIFF declares {declared} != {expected_size}')
              width, height = webp_dimensions(data)
              if width < 800 or height < 450 or width * 9 != height * 16:
                  raise SystemExit(f'{name}: invalid 16:9 dimensions {width}x{height}')
              sha = hashlib.sha256(data).hexdigest()
              (dst / name).write_bytes(data)
              print(f'OK {name}: {len(data)} bytes, {width}x{height}, sha256={sha}')
          PY

      - name: Commit images and clean staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles/2058-future-person-prophecy/fictional-female-politician.webp \
                  assets/articles/2058-future-person-prophecy/japanese-stadium-championship.webp \
                  assets/articles/2058-future-person-prophecy/collective-consciousness-network.webp
          git rm -f .github/image-rebuild-temp/add2058-*.b64
          git rm -f .github/workflows/add-2058-article-images-20260816.yml
          git commit -m "Add generated 2058 article images"
          git pull --rebase origin main
          git push origin HEAD:main
