name: One-time gauge unit fix

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-gauge-unit.yml'

permissions:
  contents: write

jobs:
  fix-gauge-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Change gauge unit to yuan
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('member-dashboard.html')
          text = path.read_text(encoding='utf-8')
          old = '單位：萬元'
          new = '單位：元'
          if old not in text:
              raise SystemExit('Gauge unit text not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-fix-gauge-unit.yml
          git add member-dashboard.html
          git commit -m '修正會員中心累積消費指針單位為元'
          git push
