name: Import 2026 Book Videos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-2026-book-videos.yml

permissions:
  contents: write

jobs:
  import-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Google auth dependencies
        run: python -m pip install --quiet google-auth requests

      - name: Download responsive book videos from Drive
        env:
          DESKTOP_FILE_ID: 1i_EdvHltC2dYJV3NFwA5ruCc9yqOckEQ
          MOBILE_FILE_ID: 1N8rdIng4PxOcYJJG6_OmEPSII3SfHs8o
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          credentials_path = os.environ.get("GOOGLE_APPLICATION_CREDENTIALS")
          if not credentials_path:
              raise SystemExit("GOOGLE_APPLICATION_CREDENTIALS is not set")

          credentials = service_account.Credentials.from_service_account_file(
              credentials_path,
              scopes=["https://www.googleapis.com/auth/drive.readonly"],
          )
          credentials.refresh(Request())
          print(f"Drive reader service account: {credentials.service_account_email}")

          targets = [
              (os.environ["DESKTOP_FILE_ID"], Path("assets/videos/osel-awakening-2026-desktop.mp4")),
              (os.environ["MOBILE_FILE_ID"], Path("assets/videos/osel-awakening-2026-mobile.mp4")),
          ]

          headers = {"Authorization": f"Bearer {credentials.token}"}
          for file_id, destination in targets:
              destination.parent.mkdir(parents=True, exist_ok=True)
              url = f"https://www.googleapis.com/drive/v3/files/{file_id}?alt=media"
              with requests.get(url, headers=headers, stream=True, timeout=180) as response:
                  response.raise_for_status()
                  with destination.open("wb") as handle:
                      for chunk in response.iter_content(chunk_size=1024 * 1024):
                          if chunk:
                              handle.write(chunk)
              if destination.stat().st_size < 100_000:
                  raise RuntimeError(f"Downloaded file looks too small: {destination}")
              print(f"Downloaded {destination} ({destination.stat().st_size} bytes)")
          PY

      - name: Verify video files
        run: |
          test -s assets/videos/osel-awakening-2026-desktop.mp4
          test -s assets/videos/osel-awakening-2026-mobile.mp4
          ls -lh assets/videos/osel-awakening-2026-*.mp4

      - name: Commit videos to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos/osel-awakening-2026-desktop.mp4 assets/videos/osel-awakening-2026-mobile.mp4
          if git diff --cached --quiet; then
            echo "Videos are already up to date."
            exit 0
          fi
          git commit -m "feat(books): 上架 2026 新書桌機與手機宣傳影片"
          git push origin HEAD:main
