name: One-time Fix Dragon Chant Article

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-fix-dragon-chant-article.yml
      - article-dragon-chant-youtube-awakening.js
  workflow_dispatch:

jobs:
  sync-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Firestore patch from article source
        run: |
          python3 - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path("article-dragon-chant-youtube-awakening.js").read_text(encoding="utf-8")
          title_match = re.search(r'title:\s*"([^"]*)"', source)
          content_match = re.search(r'content:\s*`([\s\S]*?)`\s*\n};', source)
          if not title_match or not content_match:
              raise SystemExit("Unable to parse article title/content")

          title = title_match.group(1)
          content = content_match.group(1).replace("*", "")
          expected = "元神所吟唱的靈音——它喚醒了一個人沉睡千年的元神"
          if title != expected:
              raise SystemExit(f"Unexpected title: {title}")
          if "*" in content:
              raise SystemExit("Asterisk cleanup failed")

          payload = {
              "fields": {
                  "title": {"stringValue": title},
                  "content": {"stringValue": content},
                  "updatedAt": {"timestampValue": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")},
              }
          }
          Path("/tmp/dragon-chant-patch.json").write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
          print(title)
          print(f"content chars: {len(content)}")
          PY

      - name: Patch Firestore article document
        run: |
          set -euo pipefail
          PROJECT_ID="lyyuan03-membership"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          URL="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/articles/dragon-chant-youtube-awakening?updateMask.fieldPaths=title&updateMask.fieldPaths=content&updateMask.fieldPaths=updatedAt"

          HTTP_STATUS="$(curl --silent --show-error \
            --output /tmp/firestore-response.json \
            --write-out "%{http_code}" \
            --request PATCH \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/dragon-chant-patch.json \
            "$URL")"

          cat /tmp/firestore-response.json | jq '{name, updateTime, title: .fields.title.stringValue}'
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            exit 1
          fi

      - name: Verify Firestore article
        run: |
          set -euo pipefail
          PROJECT_ID="lyyuan03-membership"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          URL="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/articles/dragon-chant-youtube-awakening"
          curl --silent --show-error \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            "$URL" > /tmp/verify.json

          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/verify.json', encoding='utf-8'))
          fields = data.get('fields', {})
          title = fields.get('title', {}).get('stringValue', '')
          content = fields.get('content', {}).get('stringValue', '')
          expected = '元神所吟唱的靈音——它喚醒了一個人沉睡千年的元神'
          if title != expected:
              raise SystemExit(f'Verification failed: title={title!r}')
          if '*' in content:
              raise SystemExit('Verification failed: asterisk still exists in content')
          print('Firestore verification passed')
          print(title)
          print(f'content chars: {len(content)}')
          PY

      - name: Write success marker
        run: |
          printf '%s\n' 'Firestore dragon chant article sync verified successfully.' > firestore-dragon-chant-sync-success.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore-dragon-chant-sync-success.txt
          git commit -m 'chore: record verified dragon chant Firestore sync' || exit 0
          git push
