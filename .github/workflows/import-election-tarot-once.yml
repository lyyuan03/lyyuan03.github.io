name: Import Election Tarot Photo Once
on:
  push:
    branches: [fix/election-tarot-first-thumbnail-20261017]
    paths:
      - '.github/workflows/import-election-tarot-once.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/election-tarot-first-thumbnail-20261017
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for portrait thumbnail
        run: python -m pip install pillow
      - name: Save unchanged divination photo and create Taiwan scene list thumbnail
        env:
          ORIGINAL_PHOTO_URL: 'https://d2ol7oe51mr4n9.cloudfront.net/user_3CC8OMVTj8bkUz71eKrO5BtBL9Y/db03a066-d51e-4ab6-88b1-841ca444ced0.jpg'
          ORIGINAL_PHOTO_SHA256: '6c321da24e00c7092af6352ece75985838b72e3006b592fef7925d975bcb8620'
        run: |
          python - <<'PY'
          import os, urllib.request, hashlib
          from pathlib import Path
          from PIL import Image
          root=Path("assets/articles/collective-unconscious-election-2026-part-2")
          root.mkdir(parents=True, exist_ok=True)
          req=urllib.request.Request(os.environ["ORIGINAL_PHOTO_URL"],headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=45) as res: data=res.read()
          assert hashlib.sha256(data).hexdigest()==os.environ["ORIGINAL_PHOTO_SHA256"],"User photo failed SHA-256 verification"
          (root/"01-tarot-divination.jpeg").write_bytes(data)
          source=Image.open(root/"00-cover.jpeg").convert("RGB")
          width,height=source.size
          crop_width=int(height*9/16)
          left=(width-crop_width)//2
          cropped=source.crop((left,0,left+crop_width,height))
          image=cropped.resize((450,800),Image.Resampling.LANCZOS)
          image.save(root/"thumbnail-taiwan-450x800.jpeg",quality=92,subsampling=0,optimize=True)
          assert Image.open(root/"thumbnail-taiwan-450x800.jpeg").size==(450,800)
          print("Verified real tarot photo and Taiwan-themed 9:16 thumbnail.")
          PY
      - name: Commit only the two article images to the update branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles/collective-unconscious-election-2026-part-2/01-tarot-divination.jpeg assets/articles/collective-unconscious-election-2026-part-2/thumbnail-taiwan-450x800.jpeg
          if ! git diff --cached --quiet; then
            git commit -m "Add real divination photo and Taiwan thumbnail"
            git push origin HEAD:fix/election-tarot-first-thumbnail-20261017
          fi
