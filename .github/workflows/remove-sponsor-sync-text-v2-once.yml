name: Remove sponsor sync text v2 once

on:
  push:
    branches:
      - fix/remove-sponsor-sync-text-v2
    paths:
      - scripts/remove_sponsor_sync_text_v2_once.py
      - .github/workflows/remove-sponsor-sync-text-v2-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-sponsor-sync-text-v2
          fetch-depth: 0
      - run: python3 scripts/remove_sponsor_sync_text_v2_once.py
      - run: |
          node --check sponsor-checkout.js
          ! grep -q '名額與付款連結已同步' sponsor-checkout.js
          ! grep -q 'sponsor-offer-sync' sponsor-checkout.js
          grep -q '20260806-remove-sync-text-2' articles.html
      - run: rm -f scripts/remove_sponsor_sync_text_v2_once.py .github/workflows/remove-sponsor-sync-text-v2-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "remove sponsor sync status text"
          git push origin HEAD:fix/remove-sponsor-sync-text-v2
