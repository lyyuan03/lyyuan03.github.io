name: one-shot-resolve-pr143-merge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-admin-checkout-metrics
          fetch-depth: 0

      - name: Merge main and resolve article cache conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge origin/main -m "merge(main): resolve articles cache conflicts for PR 143"; then
            echo "merge clean"
          else
            echo "merge conflicts — resolving articles.html and articles-v6.js to branch (metrics-auth-2) versions"
            git checkout --ours articles.html articles-v6.js || true
            git add articles.html articles-v6.js
            conflicting=$(git diff --name-only --diff-filter=U || true)
            for f in $conflicting; do
              echo "remaining conflict: $f — taking theirs (main)"
              git checkout --theirs -- "$f"
              git add -- "$f"
            done
            git commit -m "merge(main): resolve articles cache conflicts for PR 143"
          fi

      - name: Patch articles-core signed-out skip + photo-3 thumbnail import
        run: |
          python3 << 'PY'
          from pathlib import Path
          path = Path("articles-core-20260810-v6.js")
          text = path.read_text(encoding="utf-8")
          text2 = text.replace(
            'from "./article-thumbnail-url.js?v=20260916-clean-flow-5"',
            'from "./article-thumbnail-url.js?v=20260918-photo-3"',
          )
          needle = '  if (!articleId || !["views", "shares", "copies"].includes(metric)) return;\n'
          insert = needle + '  // Firestore rules now require signed-in users for metric writes.\n  if (!auth.currentUser) return;\n'
          if "Firestore rules now require signed-in users for metric writes." in text2:
              print("skip already present")
          elif needle not in text2:
              raise SystemExit("needle not found in articles-core")
          else:
              text2 = text2.replace(needle, insert, 1)
              print("skip patched")
          if text2 != text:
              path.write_text(text2, encoding="utf-8")
              print("articles-core updated")
          else:
              print("articles-core unchanged")
          PY
          git add articles-core-20260810-v6.js
          if git diff --cached --quiet; then
            echo "no core changes to commit"
          else
            git commit -m "fix(security): skip articleMetrics writes when signed out"
          fi

      - name: Push branch and remove this workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-resolve-pr143-merge.yml
          git add -A .github/workflows/one-shot-resolve-pr143-merge.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-shot PR143 merge resolver workflow"
          fi
          git push origin HEAD:fix/security-admin-checkout-metrics
