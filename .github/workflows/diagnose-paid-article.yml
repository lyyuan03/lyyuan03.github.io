name: Diagnose one paid article Firestore state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-paid-article.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Read Firestore article safely
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ID="lyyuan03-membership"
          ARTICLE_ID="yuanshen-awakening-old-manuscript"
          TOKEN="$(gcloud auth print-access-token)"
          BASE="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents"

          mkdir -p .github/diagnostics

          curl -sS -H "Authorization: Bearer $TOKEN"             "$BASE/articles/$ARTICLE_ID" > /tmp/direct.json || true

          cat > /tmp/query.json <<'JSON'
          {
            "structuredQuery": {
              "from": [{"collectionId": "articles"}],
              "where": {
                "fieldFilter": {
                  "field": {"fieldPath": "slug"},
                  "op": "EQUAL",
                  "value": {"stringValue": "yuanshen-awakening-old-manuscript"}
                }
              },
              "limit": 10
            }
          }
          JSON

          curl -sS -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             -X POST --data-binary @/tmp/query.json             "https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents:runQuery"             > /tmp/query-result.json

          python3 - <<'PY'
          import json, hashlib, os, urllib.request

          project="lyyuan03-membership"
          article_id="yuanshen-awakening-old-manuscript"
          token=os.popen("gcloud auth print-access-token").read().strip()
          base=f"https://firestore.googleapis.com/v1/projects/{project}/databases/(default)/documents"

          def sval(fields,key):
              v=(fields or {}).get(key,{})
              return v.get("stringValue","")
          def bval(fields,key):
              v=(fields or {}).get(key,{})
              return v.get("booleanValue",False)
          def ival(fields,key):
              v=(fields or {}).get(key,{})
              raw=v.get("integerValue",0)
              try: return int(raw)
              except: return 0
          def tval(fields,key):
              v=(fields or {}).get(key,{})
              return v.get("timestampValue") or v.get("stringValue") or ""
          def summarize(doc):
              fields=doc.get("fields",{})
              content=sval(fields,"content")
              marker="<!-- paid-only -->"
              name=doc.get("name","")
              return {
                  "documentName": name,
                  "documentId": name.rsplit("/",1)[-1] if name else "",
                  "slug": sval(fields,"slug"),
                  "status": sval(fields,"status"),
                  "accessType": sval(fields,"accessType"),
                  "privatePaidContent": bval(fields,"privatePaidContent"),
                  "contentChars": len(content),
                  "contentSha256": hashlib.sha256(content.encode()).hexdigest() if content else "",
                  "hasPaidMarker": marker in content,
                  "paidMarkerIndex": content.find(marker),
                  "updatedAt": tval(fields,"updatedAt"),
                  "paidContentVersion": ival(fields,"paidContentVersion"),
              }

          docs=[]
          try:
              direct=json.load(open("/tmp/direct.json"))
              if direct.get("name"):
                  docs.append(direct)
          except Exception:
              pass

          try:
              rows=json.load(open("/tmp/query-result.json"))
              for row in rows:
                  doc=row.get("document")
                  if doc and not any(d.get("name")==doc.get("name") for d in docs):
                      docs.append(doc)
          except Exception:
              pass

          summaries=[summarize(d) for d in docs]
          paid_bodies=[]
          for s in summaries:
              docid=s["documentId"]
              req=urllib.request.Request(f"{base}/paidArticleBodies/{docid}", headers={"Authorization":f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req) as resp:
                      bodydoc=json.loads(resp.read().decode())
                  fields=bodydoc.get("fields",{})
                  content=sval(fields,"content")
                  paid_bodies.append({
                      "documentId":docid,
                      "exists":True,
                      "contentChars":len(content),
                      "contentSha256":hashlib.sha256(content.encode()).hexdigest() if content else "",
                      "contentVersion":ival(fields,"contentVersion"),
                      "contentHashField":sval(fields,"contentHash"),
                      "updatedAt":tval(fields,"updatedAt"),
                  })
              except Exception as e:
                  paid_bodies.append({"documentId":docid,"exists":False,"error":str(e)[:160]})

          static_src=open("article-yuanshen-awakening-old-manuscript.js",encoding="utf-8").read()
          static_start=static_src.find("content: \`")
          static_body_start=static_start+len("content: \`") if static_start >= 0 else -1
          static_end=static_src.rfind("\`\\n};")
          static_content=static_src[static_body_start:static_end] if static_body_start >= 0 and static_end > static_body_start else ""
          firestore_content=""
          if docs:
              firestore_content=sval(docs[0].get("fields",{}),"content")
          first_diff=-1
          for i,(a,b) in enumerate(zip(static_content,firestore_content)):
              if a != b:
                  first_diff=i
                  break
          if first_diff < 0 and len(static_content) != len(firestore_content):
              first_diff=min(len(static_content),len(firestore_content))

          out={
              "articleId":article_id,
              "articleMatches":summaries,
              "matchCount":len(summaries),
              "paidArticleBodies":paid_bodies,
              "firestorePublicContent":firestore_content,
              "staticComparison":{
                  "staticContentChars":len(static_content),
                  "firestoreContentChars":len(firestore_content),
                  "sameContent":static_content == firestore_content,
                  "firstDifferenceIndex":first_diff,
                  "staticTail":static_content[-320:],
                  "firestoreTail":firestore_content[-320:]
              }
          }
          with open(".github/diagnostics/yuanshen-awakening-old-manuscript-firestore.json","w") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY

      - name: Commit diagnostic summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/yuanshen-awakening-old-manuscript-firestore.json
          git commit -m "Record paid article Firestore diagnostic" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
