name: Reencode Channeling First Image

on:
  push:
    branches:
      - fix/channeling-first-image-render-20260905
    paths:
      - .github/deploy-triggers/reencode-channeling-first-image-20260905.txt

permissions:
  contents: write

jobs:
  reencode:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/channeling-first-image-render-20260905
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Re-encode first image as baseline JPEG
        run: python scripts/reencode-channeling-first-image.py

      - name: Commit repaired image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles/channeling-ability-secrets-draft/00-photo-first.jpg
          if git diff --cached --quiet; then
            echo "No image byte changes detected"
          else
            git commit -m "重新編碼通靈文選首圖"
            git push origin HEAD:fix/channeling-first-image-render-20260905
          fi
