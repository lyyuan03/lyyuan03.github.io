name: Rebuild Channeling First Image

on:
  push:
    branches:
      - fix/channeling-first-image-render-20260905
    paths:
      - .github/deploy-triggers/reencode-channeling-first-image-20260905.txt

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/channeling-first-image-render-20260905
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild verified JPEG from staged chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/articles/channeling-ability-secrets-draft
          cat .tmp/channeling-first-image-v6/part*.txt | tr -d '\r\n' | base64 -d > assets/articles/channeling-ability-secrets-draft/00-photo-first-v2.jpg
          echo "17ecf59ffaebec0acdafb2cf50578b1ac7444cefe46e3cc64d8ea21d527f1834  assets/articles/channeling-ability-secrets-draft/00-photo-first-v2.jpg" | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          p = 'assets/articles/channeling-ability-secrets-draft/00-photo-first-v2.jpg'
          with Image.open(p) as im:
              im.load()
              assert im.format == 'JPEG', im.format
              assert im.size == (480, 270), im.size
              assert im.mode == 'RGB', im.mode
              print(f'IMAGE_VERIFY_OK format={im.format} size={im.size} mode={im.mode}')
          PY

      - name: Commit repaired image asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles/channeling-ability-secrets-draft/00-photo-first-v2.jpg
          if git diff --cached --quiet; then
            echo "No image byte changes detected"
          else
            git commit -m "修復通靈文選首圖檔案 V2"
            git push origin HEAD:fix/channeling-first-image-render-20260905
          fi
