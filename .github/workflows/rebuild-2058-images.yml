name: Diagnose 2058 image staging

on:
  push:
    paths:
      - ".github/workflows/rebuild-2058-images.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, struct

          src = Path('.github/image-rebuild-temp')
          out = []

          def ordered_merge(parts):
              merged = ''
              overlaps = []
              for part in parts:
                  p = part.strip()
                  if not merged:
                      merged = p
                      overlaps.append(0)
                      continue
                  if p in merged:
                      overlaps.append(len(p))
                      continue
                  max_overlap = min(len(merged), len(p))
                  overlap = 0
                  for n in range(max_overlap, 0, -1):
                      if merged[-n:] == p[:n]:
                          overlap = n
                          break
                  overlaps.append(overlap)
                  merged += p[overlap:]
              return merged, overlaps

          for prefix in ('bath','record','network'):
              files = sorted(src.glob(f'{prefix}.*.b64'))
              parts = [p.read_text(encoding='utf-8').strip() for p in files]
              merged, overlaps = ordered_merge(parts)
              out.append(f'[{prefix}]')
              out.append('files=' + ','.join(p.name for p in files))
              out.append('part_lengths=' + ','.join(str(len(p)) for p in parts))
              out.append('overlaps=' + ','.join(str(x) for x in overlaps))
              out.append(f'merged_b64_len={len(merged)} mod4={len(merged)%4}')
              try:
                  data = base64.b64decode(merged, validate=True)
                  out.append(f'decoded_len={len(data)}')
                  out.append(f'sha256={hashlib.sha256(data).hexdigest()}')
                  out.append(f'header={data[:12].hex()}')
                  if len(data) >= 12 and data[:4] == b"RIFF" and data[8:12] == b"WEBP":
                      out.append(f'riif_declared={struct.unpack("<I", data[4:8])[0] + 8}')
              except Exception as exc:
                  out.append(f'decode_error={type(exc).__name__}:{exc}')
              out.append('')

          Path('.github/image-rebuild-temp/diagnostics.txt').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/image-rebuild-temp/diagnostics.txt
          git commit -m "temp: diagnose 2058 image staging"
          git push
