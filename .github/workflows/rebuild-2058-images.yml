name: Rebuild 2058 article images

on:
  push:
    paths:
      - ".github/workflows/rebuild-2058-images.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify WebP images
        shell: bash
        run: |
          set -euo pipefail
          source_dir=".github/image-rebuild-temp"
          target_dir="assets/articles/2058-future-person-prophecy"
          mkdir -p "$target_dir"

          cat "$source_dir"/bath.*.b64 | base64 -d > "$target_dir/bath-test.webp"
          cat "$source_dir"/record.*.b64 | base64 -d > "$target_dir/prediction-record.webp"
          cat "$source_dir"/network.*.b64 | base64 -d > "$target_dir/consciousness-network.webp"

          test "$(wc -c < "$target_dir/bath-test.webp")" -eq 17514
          test "$(wc -c < "$target_dir/prediction-record.webp")" -eq 33904
          test "$(wc -c < "$target_dir/consciousness-network.webp")" -eq 43532

          file "$target_dir/bath-test.webp" | grep -q "Web/P image"
          file "$target_dir/prediction-record.webp" | grep -q "Web/P image"
          file "$target_dir/consciousness-network.webp" | grep -q "Web/P image"

      - name: Commit generated article images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles/2058-future-person-prophecy/bath-test.webp \
                  assets/articles/2058-future-person-prophecy/prediction-record.webp \
                  assets/articles/2058-future-person-prophecy/consciousness-network.webp
          git commit -m "Add 2058 prophecy article images"
          git push
