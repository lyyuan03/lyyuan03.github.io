name: Rebuild 2058 article images

# Verify decoded WebP files by RIFF structure before committing.
on:
  push:
    paths:
      - ".github/workflows/rebuild-2058-images.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify WebP images
        shell: bash
        run: |
          set -euo pipefail
          source_dir=".github/image-rebuild-temp"
          target_dir="assets/articles/2058-future-person-prophecy"
          mkdir -p "$target_dir"

          cat "$source_dir"/bath.*.b64 | base64 -d > "$target_dir/bath-test.webp"
          cat "$source_dir"/record.*.b64 | base64 -d > "$target_dir/prediction-record.webp"
          cat "$source_dir"/network.*.b64 | base64 -d > "$target_dir/consciousness-network.webp"

          python3 - <<'PY'
          from pathlib import Path
          import struct

          paths = [
              Path('assets/articles/2058-future-person-prophecy/bath-test.webp'),
              Path('assets/articles/2058-future-person-prophecy/prediction-record.webp'),
              Path('assets/articles/2058-future-person-prophecy/consciousness-network.webp'),
          ]
          for path in paths:
              data = path.read_bytes()
              if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'Invalid WebP RIFF header: {path}')
              declared = struct.unpack('<I', data[4:8])[0] + 8
              if declared != len(data):
                  raise SystemExit(f'WebP size mismatch: {path}: declared={declared}, actual={len(data)}')
              print(f'OK {path} {len(data)} bytes')
          PY

      - name: Commit generated article images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles/2058-future-person-prophecy/bath-test.webp \
                  assets/articles/2058-future-person-prophecy/prediction-record.webp \
                  assets/articles/2058-future-person-prophecy/consciousness-network.webp
          git commit -m "Add 2058 prophecy article images"
          git push
