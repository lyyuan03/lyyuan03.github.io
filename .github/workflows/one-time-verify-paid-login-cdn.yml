name: One-time verify paid login CDN

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-verify-paid-login-cdn.yml'

permissions:
  contents: write

jobs:
  verify-cdn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Poll production CDN and verify headers/content
        run: |
          set -euo pipefail
          VERSION='20260812-paid-login-modal-fix-1'
          HTML_URL='https://lyyuan.tw/articles.html'
          JS_URL="https://lyyuan.tw/articles-v6.js?v=${VERSION}"
          CORE_URL="https://lyyuan.tw/articles-core-20260810-v6.js?v=${VERSION}"

          for attempt in $(seq 1 12); do
            echo "===== CDN VERIFY ATTEMPT ${attempt} ====="
            echo '--- articles-v6.js HEAD ---'
            curl -fsS -I -H 'Cache-Control: no-cache' "$JS_URL" | grep -Ei '^(HTTP/|date:|last-modified:|etag:|age:|cache-control:|x-cache:|x-cache-hits:|via:|server:)' || true
            echo '--- core HEAD ---'
            curl -fsS -I -H 'Cache-Control: no-cache' "$CORE_URL" | grep -Ei '^(HTTP/|date:|last-modified:|etag:|age:|cache-control:|x-cache:|x-cache-hits:|via:|server:)' || true

            html="$(curl -fsS -H 'Cache-Control: no-cache' "$HTML_URL")"
            js="$(curl -fsS -H 'Cache-Control: no-cache' "$JS_URL")"
            core="$(curl -fsS -H 'Cache-Control: no-cache' "$CORE_URL")"

            html_ok=0; js_ok=0; core_ok=0
            grep -Fq "articles-v6.js?v=${VERSION}" <<<"$html" && html_ok=1 || true
            grep -Fq "articles-core-20260810-v6.js?v=${VERSION}" <<<"$js" && js_ok=1 || true
            grep -Fq 'document.getElementById("member-login-button")?.click();' <<<"$core" && core_ok=1 || true

            echo "CONTENT_CHECK html=${html_ok} js=${js_ok} core=${core_ok}"
            if [[ "$html_ok" == 1 && "$js_ok" == 1 && "$core_ok" == 1 ]]; then
              echo 'CDN_CONTENT_PASS'
              echo '--- production articles.html reference ---'
              grep -F "articles-v6.js?v=${VERSION}" <<<"$html" | tail -n 1
              echo '--- production articles-v6.js import ---'
              grep -F "articles-core-20260810-v6.js?v=${VERSION}" <<<"$js" | head -n 1
              echo '--- production core bindPaidLogin ---'
              grep -A5 -B1 -F 'function bindPaidLogin()' <<<"$core" | head -n 10
              exit 0
            fi
            sleep 20
          done

          echo 'CDN did not propagate expected content within polling window.' >&2
          exit 1

      - name: Remove one-time verifier
        if: success()
        run: |
          git config user.name "lyyuan03"
          git config user.email "lyyuan03@gmail.com"
          git rm .github/workflows/one-time-verify-paid-login-cdn.yml
          git commit -m "chore: remove paid login CDN verifier"
          git pull --rebase origin main
          git push origin main
