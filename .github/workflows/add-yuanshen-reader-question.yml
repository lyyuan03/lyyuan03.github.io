name: Add Reader Question to Yuanshen Article
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add-yuanshen-reader-question.py'
      - '.github/workflows/add-yuanshen-reader-question.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: python3 .github/scripts/add-yuanshen-reader-question.py
