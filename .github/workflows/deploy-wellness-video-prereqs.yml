name: Deploy wellness video prerequisites (functions + indexes + backfill dry run)

# 僅在 feat/wellness-video-first-join-month 分支修改本檔時執行。
# 不推送任何 commit、不部署 firestore.rules、不執行 --apply。
on:
  workflow_dispatch:
  push:
    branches: [feat/wellness-video-first-join-month]
    paths: [.github/workflows/deploy-wellness-video-prereqs.yml]

permissions:
  contents: read

concurrency:
  group: firebase-membership-backend
  cancel-in-progress: false

jobs:
  prereqs:
    if: github.repository == 'lyyuan03/lyyuan03.github.io' && github.ref == 'refs/heads/feat/wellness-video-first-join-month'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI and verify functions
        run: |
          npm install --global firebase-tools
          npm --prefix functions ci
          npm --prefix functions run lint
          npm --prefix functions run deploy-test

      - name: Deploy Cloud Functions only
        run: firebase deploy --only functions --project lyyuan03-membership --non-interactive

      - name: Deploy Firestore indexes only (no --force; unlisted indexes are kept)
        run: firebase deploy --only firestore:indexes --project lyyuan03-membership --non-interactive

      - name: Backfill DRY RUN (no writes, emails masked)
        working-directory: functions
        run: node backfill-wellness-first-join.mjs --mask
