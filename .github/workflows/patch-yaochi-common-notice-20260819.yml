name: Patch Yaochi common notice text

on:
  push:
    paths:
      - '.github/workflows/patch-yaochi-common-notice-20260819.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only requested phrases
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('yaochi-event-v2.html')
          s = p.read_text(encoding='utf-8')
          old1 = '<p>以上所有登記功德金，請參閱報名表。</p>'
          new1 = '<p>登記功德金，請參閱報名表。</p>'
          old2 = '<p>以上所有點燈及隨喜功德芳名，均入疏文宣讀迴向。</p>'
          new2 = '<p>點燈及隨喜功德芳名，均入疏文宣讀迴向。</p>'
          if old1 not in s or old2 not in s:
              raise SystemExit('Target text not found; no change made')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yaochi-event-v2.html
          git commit -m 'fix: shorten yaochi common notice text'
          git push
