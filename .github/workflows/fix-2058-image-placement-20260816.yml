name: Fix 2058 article image placement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-2058-image-placement-20260816.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply image repair
        run: python3 .github/fix_2058_images.py
      - name: Commit final fix
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix duplicate and missing 2058 article images"
          git pull --rebase origin main
          git push origin HEAD:main
