name: Fix 2058 article image placement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-2058-image-placement-20260816.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Restore missing image and fix front-end placement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, struct

          # 1) Decode the user's replacement politician image.
          staged = Path('.github/image-rebuild-temp/takaichi.b64')
          data = base64.b64decode(staged.read_text(encoding='utf-8').strip(), validate=True)
          if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Invalid politician WebP payload')
          declared = struct.unpack('<I', data[4:8])[0] + 8
          if declared != len(data):
              raise SystemExit(f'Politician WebP size mismatch: declared={declared}, actual={len(data)}')
          out = Path('assets/articles/2058-future-person-prophecy/takaichi-press-conference.webp')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          print('politician image:', len(data), hashlib.sha256(data).hexdigest())

          # 2) Fix the runtime article image placement. This is the source that also
          #    corrects Firestore-rendered content, so it cannot leave duplicates behind.
          toc_path = Path('article-2058-toc.js')
          toc = toc_path.read_text(encoding='utf-8')
          toc = re.sub(
              r'const NETWORK_SRC = "[^"]+";',
              'const NETWORK_SRC = "/assets/articles/2058-future-person-prophecy/consciousness-network.webp?v=20260816-3";\nconst POLITICIAN_SRC = "/assets/articles/2058-future-person-prophecy/takaichi-press-conference.webp?v=20260816-3";',
              toc,
              count=1,
          )

          replacement = r'''function removeExtraImageMatches(view, key, fragments) {
  const keep = view.querySelector(`p[data-article2058-image="${key}"]`);
  getParagraphs(view).forEach((paragraph) => {
    if (paragraph === keep) return;
    const images = paragraph.querySelectorAll(":scope > img");
    if (images.length !== 1 || cleanText(paragraph)) return;
    const imageSrc = images[0].getAttribute("src") || images[0].src || "";
    if (fragments.some((fragment) => imageSrc.includes(fragment))) paragraph.remove();
  });
}

function ensureImages(view) {
  removeBadFemaleImage(view);

  ensureImageAfter(
    view,
    "如果他的預言全部集中在政治與金融",
    "stadium",
    STADIUM_SRC,
    "日本職棒與足球冠軍賽現場",
    ["japanese-stadium-championship"]
  );
  removeExtraImageMatches(view, "stadium", ["japanese-stadium-championship"]);

  ensureImageAfter(
    view,
    "前六則有一個共同的弱點",
    "politician",
    POLITICIAN_SRC,
    "日本女性政治人物於記者會發表談話",
    ["takaichi-press-conference"]
  );
  removeExtraImageMatches(view, "politician", ["takaichi-press-conference"]);

  ensureImageAfter(
    view,
    "我在《喚醒天生好命》中談過一個概念",
    "network",
    NETWORK_SRC,
    "宇宙意識網與集體意識的連結",
    ["collective-consciousness-network", "consciousness-network"]
  );
  removeExtraImageMatches(view, "network", ["collective-consciousness-network", "consciousness-network"]);
}

function ensureToc'''
          toc, n = re.subn(r'function ensureImages\(view\) \{.*?\n\}\n\nfunction ensureToc', replacement, toc, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not patch ensureImages()')
          toc_path.write_text(toc, encoding='utf-8')

          # 3) Keep the static article source consistent with the live runtime output.
          article_path = Path('article-2058-future-person-prophecy.js')
          article = article_path.read_text(encoding='utf-8')
          article = re.sub(r'\n!\[\]\(assets/articles/2058-future-person-prophecy/collective-consciousness-network\.webp\?v=[^)]+\)\n', '\n', article)
          article = re.sub(
              r'assets/articles/2058-future-person-prophecy/consciousness-network\.webp\?v=[^)]+',
              'assets/articles/2058-future-person-prophecy/consciousness-network.webp?v=20260816-3',
              article,
          )
          politician_md = '![](assets/articles/2058-future-person-prophecy/takaichi-press-conference.webp?v=20260816-3)'
          if politician_md not in article:
              marker = '只有年份，晚了整整一年。\n\n'
              if marker not in article:
                  raise SystemExit('Could not find politician insertion point')
              article = article.replace(marker, marker + politician_md + '\n\n', 1)
          article = re.sub(r'updatedAt: "[^"]+"', 'updatedAt: "2026-08-16T02:55:00.000Z"', article, count=1)
          article_path.write_text(article, encoding='utf-8')

          # 4) Bump only the 2058 helper cache key so Chrome cannot reuse the old script.
          page_path = Path('articles.html')
          page = page_path.read_text(encoding='utf-8')
          page, n = re.subn(r'/article-2058-toc\.js\?v=[^"\']+', '/article-2058-toc.js?v=20260816-3', page, count=1)
          if n != 1:
              raise SystemExit('Could not bump article-2058-toc cache key')
          page_path.write_text(page, encoding='utf-8')

          # 5) Remove one-time staging/workflow files from the final state.
          staged.unlink(missing_ok=True)
          Path('.github/workflows/fix-2058-image-placement-20260816.yml').unlink(missing_ok=True)
          PY

      - name: Commit final fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix duplicate and missing 2058 article images"
          git pull --rebase origin main
          git push origin HEAD:main
