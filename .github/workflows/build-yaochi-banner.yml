name: Finalize Yaochi Event Banner

on:
  push:
    branches:
      - main
    paths:
      - 'yaochi-event-banner.avif'
      - '.github/workflows/build-yaochi-banner.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify banner asset
        shell: bash
        run: |
          set -euo pipefail
          test -s yaochi-event-banner.avif
          echo 'c1831a382504f69142aabac89b81fb23c67b898e9bb25f7c3a51f53bedcb8898  yaochi-event-banner.avif' | sha256sum -c -

      - name: Add banner to top of event page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('yaochi-event-v2.html')
          s = p.read_text(encoding='utf-8')

          css = ".top-banner{width:min(1120px,calc(100% - 32px));margin:20px auto 0;border-radius:18px;overflow:hidden;border:1px solid rgba(165,130,84,.18);background:rgba(10,15,8,.54);box-shadow:0 18px 48px #0004}.top-banner img{display:block;width:100%;height:auto}"
          if '.top-banner{' not in s:
              marker = '.hero{position:relative'
              if marker not in s:
                  raise SystemExit('Hero CSS marker not found')
              s = s.replace(marker, css + marker, 1)

          mobile_css = '.top-banner{width:min(100% - 18px,1120px);margin-top:10px;border-radius:14px}'
          mobile_marker = '@media(max-width:640px){body{background-attachment:scroll}'
          if mobile_css not in s:
              if mobile_marker not in s:
                  raise SystemExit('Mobile CSS marker not found')
              s = s.replace(mobile_marker, mobile_marker + mobile_css, 1)

          if 'class="top-banner"' not in s:
              marker = '<div class="page-content"><main class="main">'
              if marker not in s:
                  raise SystemExit('Page content marker not found')
              banner = '<section class="top-banner" aria-label="無極瑤池金母聖誕祝壽暨解冤赦業法儀活動主視覺"><img src="yaochi-event-banner.avif?v=20260816-1" alt="無極瑤池金母聖誕祝壽暨解冤赦業法儀，日期2026年8月29日" width="900" height="375" fetchpriority="high" decoding="async"></section>'
              s = s.replace(marker, marker + banner, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Clean staging files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/yaochi-banner-temp
          rm -rf .github/yaochi-avif-temp
          rm -f .github/workflows/build-yaochi-banner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add Yaochi event banner to page top'
          git pull --rebase origin main
          git push origin HEAD:main
