name: Stage Historical Yuanshen Evidence Photos
on:
  push:
    branches:
      - fix/historical-yuanshen-broken-inline-images-20261027
    paths:
      - '.github/workflows/stage-historical-yuanshen-photo-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and preserve original user photographs on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/articles/historical-yuanshen-destiny-cultivation
          curl --fail --show-error --location --retry 3 --connect-timeout 10 --max-time 75 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3CC8OMVTj8bkUz71eKrO5BtBL9Y/27cce1b9-4809-4686-9ee6-f7fd273d90e4.png' \
            -o assets/articles/historical-yuanshen-destiny-cultivation/03-tianwen-ai-cleaned.png
          curl --fail --show-error --location --retry 3 --connect-timeout 10 --max-time 75 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3CC8OMVTj8bkUz71eKrO5BtBL9Y/b13e09e5-c7fb-49cc-8a62-cf6cfcbb1f15.jpg' \
            -o assets/articles/historical-yuanshen-destiny-cultivation/04-tianwen-original-photo.jpg
          python3 - <<'PY'
          from pathlib import Path
          base=Path("assets/articles/historical-yuanshen-destiny-cultivation")
          ai=(base/"03-tianwen-ai-cleaned.png").read_bytes()
          original=(base/"04-tianwen-original-photo.jpg").read_bytes()
          assert ai.startswith(bytes.fromhex("89504e470d0a1a0a")) and len(ai)>500000
          assert original.startswith(bytes.fromhex("ffd8ff")) and len(original)>30000
          print("IMAGE_VALIDATION_OK",len(ai),len(original))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/articles/historical-yuanshen-destiny-cultivation/03-tianwen-ai-cleaned.png assets/articles/historical-yuanshen-destiny-cultivation/04-tianwen-original-photo.jpg
          git commit -m "Preserve the two original talisman photos as first-party site assets"
          git push origin HEAD:fix/historical-yuanshen-broken-inline-images-20261027
