name: Audit Love Article Image Availability
on:
  push:
    branches: [main]
    paths:
      - 'functions/audit-love-article-images.mjs'
      - '.github/workflows/audit-love-article-images.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix functions ci
      - name: Audit production image URLs and persisted article image references
        run: node functions/audit-love-article-images.mjs