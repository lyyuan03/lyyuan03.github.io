name: Rebuild Channeling First Image Valid

on:
  push:
    branches:
      - fix/channeling-first-image-final-20260905
    paths:
      - .github/deploy-triggers/rebuild-channeling-first-image-valid.txt

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/channeling-first-image-final-20260905
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild and verify first image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/articles/channeling-ability-secrets-draft
          cat .tmp/channeling-first-final/chunk*.txt | tr -d '\r\n' | base64 -d > assets/articles/channeling-ability-secrets-draft/00-photo-first.jpg
          echo "069663c7aa46525edf679047c27af19c2cdab7ad69f920b6f6dce6fe481dc8ef  assets/articles/channeling-ability-secrets-draft/00-photo-first.jpg" | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          p = 'assets/articles/channeling-ability-secrets-draft/00-photo-first.jpg'
          with Image.open(p) as im:
              im.load()
              assert im.format == 'JPEG', im.format
              assert im.size == (800, 450), im.size
              assert im.mode == 'RGB', im.mode
              print(f'IMAGE_VERIFY_OK format={im.format} size={im.size} mode={im.mode}')
          PY

      - name: Commit verified image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles/channeling-ability-secrets-draft/00-photo-first.jpg
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "重建通靈文選首圖完整檔案"
            git push origin HEAD:fix/channeling-first-image-final-20260905
          fi
