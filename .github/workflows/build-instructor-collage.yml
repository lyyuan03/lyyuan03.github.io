name: Build instructor collage

on:
  push:
    branches:
      - "feature/male-yoga-instructor-collage-20260930b"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode image and update instructor section
        run: |
          cat .tmp/instructor-collage.b64.0* | base64 -d > assets/course-male-yoga-instructor-collage.webp
          python <<'PY'
          from pathlib import Path

          p = Path("courses/male-yoga-energy.html")
          s = p.read_text(encoding="utf-8")

          old_src = "/assets/course-male-yoga-instructor.webp?v=20260930-hq3"
          new_src = "/assets/course-male-yoga-instructor-collage.webp?v=20260930-1"
          assert old_src in s, "current instructor image source not found"
          s = s.replace(old_src, new_src)

          old_layout = ".instructor-layout{position:relative;z-index:1;display:grid;grid-template-columns:minmax(320px,.82fr) minmax(0,1.18fr);gap:68px;align-items:center}"
          new_layout = ".instructor-layout{position:relative;z-index:1;display:grid;grid-template-columns:minmax(420px,1fr) minmax(0,1.08fr);gap:58px;align-items:center}"
          assert old_layout in s, "instructor layout CSS not found"
          s = s.replace(old_layout, new_layout)

          old_img = ".instructor-photo img{width:100%;height:640px;object-fit:cover;object-position:center 48%;filter:saturate(.82) contrast(1.04)}"
          new_img = ".instructor-photo img{display:block;width:100%;height:auto;aspect-ratio:1000/563;object-fit:cover;object-position:center;filter:saturate(.92) contrast(1.03)}"
          assert old_img in s, "instructor image CSS not found"
          s = s.replace(old_img, new_img)

          old_mobile = ".instructor-photo img{height:auto;aspect-ratio:2/3}"
          new_mobile = ".instructor-photo img{height:auto;aspect-ratio:1000/563}"
          assert old_mobile in s, "mobile instructor image CSS not found"
          s = s.replace(old_mobile, new_mobile)

          p.write_text(s, encoding="utf-8")
          PY

          rm -f .tmp/instructor-collage.b64.0*
          git rm -f .github/workflows/build-instructor-collage.yml

      - name: Commit finished page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/course-male-yoga-instructor-collage.webp courses/male-yoga-energy.html
          git add -u
          git commit -m "design: replace instructor image with new collage"
          git push origin HEAD
