name: Add Yaochi Banner 20260817 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-yaochi-banner-20260817-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add banner above title
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('yaochi-event-v2.html')
          text = path.read_text(encoding='utf-8')

          # Remove any prior top-banner block created for this event to avoid duplicates.
          text = re.sub(r'<div class="event-top-banner"[^>]*>.*?</div>\s*', '', text, flags=re.S)

          css = '''
.event-top-banner{width:min(1200px,calc(100% - 32px));margin:20px auto 0;overflow:hidden;border-radius:16px;border:1px solid rgba(165,130,84,.20);box-shadow:0 18px 44px rgba(0,0,0,.28);background:#efe3cf}.event-top-banner img{display:block;width:100%;height:auto;object-fit:contain}
'''
          if '.event-top-banner{' not in text:
              text = text.replace('</style>', css + '</style>', 1)

          mobile_css = '''
@media(max-width:640px){.event-top-banner{width:calc(100% - 18px);margin-top:10px;border-radius:12px}}
'''
          # Keep the small-screen banner rule after the main CSS; duplicate-safe.
          if '@media(max-width:640px){.event-top-banner{' not in text:
              text = text.replace('</style>', mobile_css + '</style>', 1)

          marker = '<div class="page-content"><main class="main">'
          banner = '''<div class="event-top-banner"><img src="yaochi-event-banner-20260817.webp?v=20260817-1636" alt="無極瑤池金母聖誕祝壽暨解冤赦業・護法續脈遠距祝壽懺儀｜2026年8月29日" width="1200" height="457" decoding="async" fetchpriority="high"></div>'''
          if marker not in text:
              raise SystemExit('page-content marker not found')
          text = text.replace(marker, marker + '\n' + banner, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit updated page
        run: |
          git config user.name "lyyuan03"
          git config user.email "lyyuan03@gmail.com"
          git add yaochi-event-v2.html
          git commit -m "Place Yaochi banner above event title" || exit 0
          git push
