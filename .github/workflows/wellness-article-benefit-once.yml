# Triggered after workflow registration and layout refinement.
name: Wellness article benefit once

on:
  push:
    branches:
      - fix/wellness-article-benefit-admin
    paths:
      - scripts/wellness_article_benefit_once.py
      - scripts/wellness_admin_layout_once.py
      - .github/workflows/wellness-article-benefit-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wellness-article-benefit-admin
          fetch-depth: 0

      - name: Apply wellness article benefit migration
        run: |
          python3 scripts/wellness_article_benefit_once.py
          python3 scripts/wellness_admin_layout_once.py

      - name: Validate benefit authorization
        run: |
          node --check wellness-member-admin.js
          node --check articles.js
          node --check member-dashboard.js
          node --check functions/index.js
          grep -q 'wellness-member-qualifying-purchase' admin.html
          grep -q 'membership-subsection-head' admin.html
          grep -q 'wellness-lingji-period-fields' admin.html
          grep -q 'syncWellnessArticleBenefit' wellness-member-admin.js
          grep -q 'hasWellnessArticleBenefit' articles.js
          grep -q 'activeWellnessArticleBenefit' member-dashboard.js
          grep -q 'ARTICLE_BENEFIT_THRESHOLD = 15000' functions/index.js
          grep -q '20260804-article-benefit-1' articles.html

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html wellness-member-admin.js articles.js articles.html member-dashboard.js member-dashboard.html functions/index.js
          git commit -m "feat: automate and reorganize wellness article benefits"
          git push origin HEAD:fix/wellness-article-benefit-admin
