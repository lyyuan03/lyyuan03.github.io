name: Firestore rules test (emulator only)

# 只在 Firestore 模擬器中驗證 firestore.rules，不使用任何憑證、不連正式資料、不部署。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - firestore.rules
      - zodiac-lamp-reader.js
      - scripts/tests/dingwei-zodiac-rules.test.mjs
      - .github/workflows/firestore-rules-test.yml

permissions:
  contents: read

jobs:
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install emulator test tools (temporary, not committed)
        run: |
          mkdir -p /tmp/rules-test && cd /tmp/rules-test
          npm init -y >/dev/null
          npm i --legacy-peer-deps firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10
      - name: Run 12-zodiac permission tests against unchanged firestore.rules
        run: |
          cp firestore.rules scripts/tests/dingwei-zodiac-rules.test.mjs /tmp/rules-test/
          cd /tmp/rules-test
          echo '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false}}}' > firebase.json
          npx firebase emulators:exec --only firestore --project demo-zodiac "node dingwei-zodiac-rules.test.mjs firestore.rules"
