name: Building patron full-resolution cache refresh

on:
  push:
    paths:
      - '.github/workflows/building-patron-fullres-cache.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh article script cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('articles.html')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'construction-patron-restored\.js\?v=[^"\']+',
              'construction-patron-restored.js?v=20260902-fullres-native-1',
              text,
          )
          if count < 1:
              raise SystemExit('construction-patron-restored.js cache token not found')
          path.write_text(updated, encoding='utf-8')
          print(f'updated {count} reference(s)')
          PY
      - name: Commit cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh full-resolution building article images"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
