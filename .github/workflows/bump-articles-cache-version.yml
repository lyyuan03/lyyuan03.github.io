name: Bump articles cache version

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bump-articles-cache-version.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update articles.js cache key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("articles.html")
          old = 'articles.js?v=20260805-loading-fix-1'
          new = 'articles.js?v=20260807-sort-fix-1'
          content = path.read_text(encoding="utf-8")
          count = content.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one cache key, found {count}")
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/bump-articles-cache-version.yml
          git add articles.html .github/workflows/bump-articles-cache-version.yml
          git commit -m "fix: bump articles.js cache version"
          git push
