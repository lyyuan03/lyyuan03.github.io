name: Secure Jinmu Event Series
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - jinmu-event-series.js
      - functions/jinmu-series-sync.mjs
      - .github/workflows/jinmu-event-series-sync.yml
permissions:
  contents: write
concurrency:
  group: jinmu-event-series-sync
  cancel-in-progress: false
jobs:
  secure-series:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Export service-account public key for sealed article imports
        run: |
          node --input-type=module <<'NODE'
          import { createPublicKey } from "node:crypto";
          import { mkdir, writeFile } from "node:fs/promises";
          const service = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON || "{}");
          if (!service.private_key) throw new Error("FIREBASE_SERVICE_ACCOUNT private_key missing");
          const publicKey = createPublicKey(service.private_key).export({ type: "spki", format: "pem" });
          await mkdir("secure-imports", { recursive: true });
          await writeFile("secure-imports/jinmu-service-public-key.pem", publicKey, "utf8");
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secure-imports/jinmu-service-public-key.pem
          if ! git diff --cached --quiet; then
            git commit -m "Export Jinmu service public key"
            git push origin HEAD:main
          fi
      - run: npm --prefix functions ci
      - name: Deploy Firestore security rules
        run: node functions/jinmu-series-sync.mjs rules
      - name: Migrate existing four bodies without duplicate articles
        run: node functions/jinmu-series-sync.mjs migrate
      - name: Verify six permission cases against live Firestore
        run: node functions/jinmu-series-sync.mjs test
      - name: Record building patron rewrite deployment
        run: |
          mkdir -p .github/deploy-triggers
          cat > .github/deploy-triggers/building-patron-rewrite-success.txt <<'EOF'
          article=2026-building-patron-record
          rewriteVersion=1
          contentHash=0b0757279e222f117143ccfe84bed5b26d74a270b9d80cc2a2b9ab0339175be9
          status=deployed-and-tested
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/deploy-triggers/building-patron-rewrite-success.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record building patron rewrite deployment"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
