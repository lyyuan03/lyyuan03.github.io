name: Yuanshen Article Additions 20261028
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/yuanshen-article-additions-20261028.py'
      - '.github/workflows/yuanshen-article-additions-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: python3 .github/scripts/yuanshen-article-additions-20261028.py
