name: Publish final love article to protected Firestore
on:
  push:
    branches: [main]
    paths:
      - 'functions/publish-love-final-secure.mjs'
      - '.github/workflows/publish-love-final-secure.yml'
      - 'secure-imports/love-universal-emotion-and-fidelity-20261115.final-rsa.json'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Firebase Admin dependencies
        run: npm --prefix functions ci
      - name: Verify local image files and safely publish paid article
        run: node functions/publish-love-final-secure.mjs