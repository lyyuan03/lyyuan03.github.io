name: Temporary import of author-supplied planting photos
on:
  push:
    branches:
      - content/tree-planting-real-photos-20261010
    paths:
      - .github/workflows/import-real-tree-photos.yml

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photograph optimizer
        run: python -m pip install --quiet pillow
      - name: Fetch the three original author-supplied photographs and convert faithfully to WebP
        env:
          PHOTO_PATH: 'https://d2ol7oe51mr4n9.cloudfront.net/user_3CC8OMVTj8bkUz71eKrO5BtBL9Y/d51079d1-6638-4d06-8283-56555a2bf74a.png'
          PHOTO_TREES: 'https://d2ol7oe51mr4n9.cloudfront.net/user_3CC8OMVTj8bkUz71eKrO5BtBL9Y/5c9d6dec-d81b-41f5-b4b2-88cd571687bc.png'
          PHOTO_TREES_ALT: 'https://d2ol7oe51mr4n9.cloudfront.net/user_3CC8OMVTj8bkUz71eKrO5BtBL9Y/1b268321-5d58-45dc-b9c5-fbc9479f1751.jpg'
        run: |
          python - <<'PY'
          import io
          import os
          from pathlib import Path
          from urllib.request import urlopen, Request
          from PIL import Image, ImageOps
          dest = Path("assets/articles/tree-spirits-nature-karma-reincarnation")
          dest.mkdir(parents=True, exist_ok=True)
          photos = [
              ("PHOTO_PATH","07-real-planting-path.webp"),
              ("PHOTO_TREES","08-real-planting-trees.webp"),
              ("PHOTO_TREES_ALT","09-real-planting-trees-alternate.webp")
          ]
          for name,filename in photos:
              url = os.environ[name]
              with urlopen(Request(url, headers={"User-Agent":"Mozilla/5.0"}),timeout=60) as response:
                  data = response.read()
                  if len(data)<50000 or len(data)>15000000:
                      raise RuntimeError("Photo size unexpected")
              with Image.open(io.BytesIO(data)) as original:
                  im = ImageOps.exif_transpose(original).convert("RGB")
                  im.thumbnail((1100,1500), Image.Resampling.LANCZOS)
                  im.save(dest/filename,"WEBP",quality=82,method=6)
              print(f"Photo stored: {filename}, {(dest/filename).stat().st_size} bytes")
          PY
      - name: Commit only the processed documentary photographs to the content branch
        run: |
          git config user.name "lyyuan-site-asset-bot"
          git config user.email "lyyuan-site-asset-bot@users.noreply.github.com"
          git add assets/articles/tree-spirits-nature-karma-reincarnation/07-real-planting-path.webp assets/articles/tree-spirits-nature-karma-reincarnation/08-real-planting-trees.webp assets/articles/tree-spirits-nature-karma-reincarnation/09-real-planting-trees-alternate.webp
          git commit -m "Add three documentary photos of the actual tree planting work"
          git push origin HEAD:content/tree-planting-real-photos-20261010
