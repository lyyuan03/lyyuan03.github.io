name: Upgrade 2026 Book Video Quality

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upgrade-2026-book-video-quality.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download web-optimized high-quality videos
        env:
          DESKTOP_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-a9bc-8206-8c89-a0e69a039c7f/raw?se=2026-08-13T10%3A24%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=8c100e29-83de-5727-a2a3-3dcad554b8b8&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-13T00%3A06%3A37Z&ske=2026-08-14T00%3A06%3A37Z&sks=b&skv=2026-02-06&sig=bKI3nowDqRuUznoesLM3fDQnf3rEDvIZqbyD18ZQ3Vg%3D'
          MOBILE_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-27d8-820b-804c-0104e9510184/raw?se=2026-08-13T10%3A25%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=be3f41db-e0d4-5e94-b9c6-16cb8854db5a&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T21%3A54%3A27Z&ske=2026-08-13T21%3A54%3A27Z&sks=b&skv=2026-02-06&sig=8u0pJnDw8Ms1jzPMNvMGOY/6iNzLMp/nLdJJfihxTuc%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 1 "$DESKTOP_URL" -o assets/videos/osel-awakening-2026-desktop.mp4
          curl --fail --location --retry 3 --retry-delay 1 "$MOBILE_URL" -o assets/videos/osel-awakening-2026-mobile.mp4
          python - <<'PY'
          from pathlib import Path
          expected = {
              Path('assets/videos/osel-awakening-2026-desktop.mp4'): 6256566,
              Path('assets/videos/osel-awakening-2026-mobile.mp4'): 2417138,
          }
          for path, expected_size in expected.items():
              data = path.read_bytes()
              if len(data) != expected_size:
                  raise SystemExit(f'{path}: unexpected size {len(data)} != {expected_size}')
              if b'ftyp' not in data[:64]:
                  raise SystemExit(f'{path} is not a valid MP4')
              print(f'{path}: {len(data)} bytes OK')
          PY

      - name: Bust video cache and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('analytics.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('/assets/videos/osel-awakening-2026-mobile.mp4?v=20260813-2', '/assets/videos/osel-awakening-2026-mobile.mp4?v=20260813-3')
          text = text.replace('/assets/videos/osel-awakening-2026-desktop.mp4?v=20260813-2', '/assets/videos/osel-awakening-2026-desktop.mp4?v=20260813-3')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/upgrade-2026-book-video-quality.yml

      - name: Commit high-quality assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/videos analytics.js .github/workflows/upgrade-2026-book-video-quality.yml
          git commit -m 'perf(books): 升級 2026 新書影片網頁畫質'
          git push origin HEAD:main
