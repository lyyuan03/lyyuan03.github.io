name: One-time gauge scale fix

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-gauge-scale.yml'

permissions:
  contents: write

jobs:
  fix-gauge-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Change gauge scale to yuan amounts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('member-dashboard.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '.gauge-scale{fill:#7A6957;font-family:var(--sans);font-size:8px;text-anchor:middle}': '.gauge-scale{fill:#7A6957;font-family:var(--sans);font-size:6px;text-anchor:middle}',
              '<text class="gauge-scale" x="28" y="39">2</text>': '<text class="gauge-scale" x="28" y="39">20,000</text>',
              '<text class="gauge-scale" x="65" y="12">4</text>': '<text class="gauge-scale" x="65" y="12">40,000</text>',
              '<text class="gauge-scale" x="115" y="12">6</text>': '<text class="gauge-scale" x="115" y="12">60,000</text>',
              '<text class="gauge-scale" x="152" y="39">8</text>': '<text class="gauge-scale" x="152" y="39">80,000</text>',
              '<text class="gauge-scale" x="166" y="101">10</text>': '<text class="gauge-scale" x="166" y="101">100,000</text>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected gauge text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-fix-gauge-scale.yml
          git add member-dashboard.html
          git commit -m '將會員中心指針刻度改為元'
          git pull --rebase origin main
          git push origin main
