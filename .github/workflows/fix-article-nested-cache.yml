name: Fix nested article module cache

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update article cache keys
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "articles.js": [
                  ('./static-articles.js?v=20260802-you-can-not-fear-death-3', './static-articles.js?v=20260807-article-sync-1'),
              ],
              "article-admin.js": [
                  ('./static-articles.js?v=20260802-backend-sync-1', './static-articles.js?v=20260807-article-sync-1'),
              ],
              "articles.html": [
                  ('articles.js?v=20260807-sort-fix-1', 'articles.js?v=20260807-nested-cache-fix-1'),
              ],
              "admin.html": [
                  ('article-admin.js?v=20260802-thumbnail-save-1', 'article-admin.js?v=20260807-nested-cache-fix-1'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected cache key not found in {filename}: {old}")
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f"No change made to {filename}")
              path.write_text(text, encoding="utf-8")

      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/fix-article-nested-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.js article-admin.js articles.html admin.html .github/workflows/fix-article-nested-cache.yml
          git commit -m "fix: bust nested article module caches"
          git push
