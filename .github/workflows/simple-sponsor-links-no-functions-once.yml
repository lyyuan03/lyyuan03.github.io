name: Simple sponsor links no functions once

on:
  push:
    branches:
      - fix/simple-sponsor-links-no-functions
    paths:
      - scripts/simple_sponsor_links_no_functions_once.py
      - .github/workflows/simple-sponsor-links-no-functions-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-sponsor-links-no-functions
          fetch-depth: 0

      - name: Apply simple sponsor link patch
        run: python3 scripts/simple_sponsor_links_no_functions_once.py

      - name: Validate JavaScript
        run: |
          node --check membership-admin.js
          node --check sponsor-checkout.js
          node --check articles.js
          grep -q 'currentPaymentUrl' sponsor-checkout.js
          grep -q 'systemRecord' articles.js
          grep -q '依名單判讀並開啟付款通知' admin.html
          ! grep -q 'getFunctions' membership-admin.js
          ! grep -q 'createPublicSponsorCheckout' sponsor-checkout.js

      - name: Remove one-time patch files
        run: |
          rm -f scripts/simple_sponsor_links_no_functions_once.py
          rm -f .github/workflows/simple-sponsor-links-no-functions-once.yml

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "簡化贊助閱讀為名單判讀與固定付款連結"
          git push origin HEAD:fix/simple-sponsor-links-no-functions
