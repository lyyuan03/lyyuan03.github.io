name: Assemble Blessing Discernment Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'assets/articles/blessing-discernment-spiritual-power/.parts/**'

permissions:
  contents: write

concurrency:
  group: assemble-blessing-discernment-assets
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble verified screenshot assets and sealed payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import shutil

          parts = Path("assets/articles/blessing-discernment-spiritual-power/.parts")
          if not parts.exists():
              print("No .parts directory; nothing to assemble.")
              raise SystemExit(0)

          images = [
              ("03-web-screenshot-monk.jpg", 6204, "558bf910bee7b72c1b91e836057ab4a08466f57a9b8ed42d9ffbe9105d5a7b4a"),
              ("04-web-screenshot-monk-woman.jpg", 7707, "7dc4f227f963fd897ca2d3e88731e4759c5b875870ca7c95908fdbfb0fdaefab"),
              ("05-web-screenshot-police.jpg", 10497, "5bc7051a387bde8ba3208ff615c938527dfe9a394b27b6c735ceb7dc3aa00ffc"),
          ]

          for name, expected_size, expected_sha in images:
              chunks = sorted(parts.glob(f"{name}.part*.b64"))
              if not chunks:
                  raise SystemExit(f"Missing chunks for {name}")
              encoded = "".join(chunk.read_text(encoding="ascii").strip() for chunk in chunks)
              raw = base64.b64decode(encoded, validate=True)
              digest = hashlib.sha256(raw).hexdigest()
              if len(raw) != expected_size:
                  raise SystemExit(f"{name}: size mismatch {len(raw)} != {expected_size}")
              if digest != expected_sha:
                  raise SystemExit(f"{name}: sha256 mismatch {digest} != {expected_sha}")
              destination = Path("assets/articles/blessing-discernment-spiritual-power") / name
              destination.write_bytes(raw)
              print(f"ASSEMBLED {destination} {len(raw)} bytes {digest}")

          payload_chunks = sorted(parts.glob("payload.part*.txt"))
          if not payload_chunks:
              raise SystemExit("Missing sealed payload chunks")
          payload = "".join(chunk.read_text(encoding="utf-8") for chunk in payload_chunks).encode("utf-8")
          payload_sha = hashlib.sha256(payload).hexdigest()
          if len(payload) != 10865:
              raise SystemExit(f"payload: size mismatch {len(payload)} != 10865")
          if payload_sha != "5704c7bd16db3be9eeae468070a86c513b6c9d1ffb969baec3cd240856a8c0a6":
              raise SystemExit(f"payload: sha256 mismatch {payload_sha}")
          payload_path = Path("secure-imports/blessing-discernment-spiritual-power-20260929.enc.json")
          payload_path.write_bytes(payload)
          print(f"ASSEMBLED {payload_path} {len(payload)} bytes {payload_sha}")

          shutil.rmtree(parts)
          PY

      - name: Commit assembled assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/articles/blessing-discernment-spiritual-power secure-imports/blessing-discernment-spiritual-power-20260929.enc.json
          if git diff --cached --quiet; then
            echo "No assembled changes to commit."
            exit 0
          fi
          git commit -m "組裝祈福文選馬賽克圖片與加密正文"
          git pull --rebase origin main
          git push origin HEAD:main
