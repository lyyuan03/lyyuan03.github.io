name: Test Canva image rendition
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-canva-rendition.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test exact and enlarged URLs
        shell: bash
        run: |
          set -u
          EXACT='https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F6fe9aead-0f5a-4ff7-a69f-2abd1a303a1f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAFkVx7T5tmp32KBDXmbo4k8wRyvmRP1bZu6fo8_6Jrt6&exp=1788026012&osig=AAAAAAAAAAAAAAAAAAAAAH6V_TKXMulPWNDvDYfox_yhsQVI6fyMshm-UseyukqY&signer=media-rpc&x-canva-quality=thumbnail'
          LARGE="$(printf '%s' "$EXACT" | sed 's/height:112/height:864/; s/quality:75/quality:90/; s/width:200/width:1536/')"
          : > canva-test-result.txt
          for item in exact large; do
            if [ "$item" = exact ]; then url="$EXACT"; else url="$LARGE"; fi
            code="$(curl -L -sS -o "/tmp/$item.jpg" -w '%{http_code}' "$url" || true)"
            bytes="$(wc -c < "/tmp/$item.jpg" 2>/dev/null || echo 0)"
            echo "$item http=$code bytes=$bytes" >> canva-test-result.txt
            python - "$item" >> canva-test-result.txt <<'PY'
import sys
from PIL import Image
p=f"/tmp/{sys.argv[1]}.jpg"
try:
    im=Image.open(p)
    print(f"{sys.argv[1]} size={im.size[0]}x{im.size[1]} mode={im.mode}")
except Exception as e:
    print(f"{sys.argv[1]} invalid={e}")
PY
          done
          rm -f .github/workflows/test-canva-rendition.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Test Canva rendition URL for article images'
          git push origin main
