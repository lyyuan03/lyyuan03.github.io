name: One-time paid gate restore cache bust

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-paid-gate-restore-cache-bust.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump articles v6 cache version
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('articles.html')
          text = path.read_text(encoding='utf-8')
          old = 'articles-v6.js?v=20260812-paid-login-modal-fix-1'
          new = 'articles-v6.js?v=20260812-paid-gate-restore-2'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'articles.html: expected exactly one target, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('updated articles.html cache version')
          PY

      - name: Verify active entry includes restored gate
        run: |
          grep -F 'articles-v6.js?v=20260812-paid-gate-restore-2' articles.html
          grep -F 'article-paid-gate-restore.js?v=20260812-paid-gate-restore-2' articles-v6.js
          node --check articles-v6.js
          node --check article-paid-gate-restore.js

      - name: Commit cache bust and remove one-time workflow
        run: |
          git config user.name "lyyuan03"
          git config user.email "lyyuan03@gmail.com"
          git rm .github/workflows/one-time-paid-gate-restore-cache-bust.yml
          git add articles.html articles-v6.js
          git commit -m "fix: activate restored paid article purchase gate"
          git pull --rebase origin main
          git push origin main
