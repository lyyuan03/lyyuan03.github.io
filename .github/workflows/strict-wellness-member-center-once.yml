name: Strict wellness member center once

on:
  push:
    branches:
      - fix/strict-wellness-member-center
    paths:
      - scripts/strict_wellness_member_center_once.py
      - .github/workflows/strict-wellness-member-center-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-wellness-member-center
          fetch-depth: 0

      - name: Apply strict wellness member-center patch
        run: python3 scripts/strict_wellness_member_center_once.py

      - name: Validate authorization logic
        run: |
          node --check member-dashboard.js
          node --check site-auth-nav.js
          node --check wellness-member-admin.js
          grep -q 'function isWellnessMemberRecord' member-dashboard.js
          grep -q 'member.paymentStatus === "paid"' member-dashboard.js
          grep -q 'member.memberType === "wellness-channel"' site-auth-nav.js
          grep -q 'wellnessMember().data.memberType == "wellness-channel"' firestore.rules
          grep -q '20260804-strict-wellness-1' member-dashboard.html

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add member-dashboard.js member-dashboard.html site-auth-nav.js wellness-member-admin.js firestore.rules *.html
          git commit -m "fix: require authoritative wellness membership for member center"
          git push origin HEAD:fix/strict-wellness-member-center
