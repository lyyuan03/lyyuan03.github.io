name: Repair Love Article Broken Image References
on:
  push:
    branches: [main]
    paths:
      - 'functions/repair-love-article-images.mjs'
      - '.github/workflows/repair-love-article-images.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: love-article-image-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix functions ci
      - run: node functions/repair-love-article-images.mjs --self-test
      - run: node scripts/lock-paid-article-access-policy.mjs
      - name: Repair exact article-only Firestore image references
        run: node functions/repair-love-article-images.mjs