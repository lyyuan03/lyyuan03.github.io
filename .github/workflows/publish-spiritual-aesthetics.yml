        { label: '福祿具足、正財順行，生活更加安穩', key: 'wealth', boost: [4, 19, 7, 1, 8, 5] },
        { label: '志業有路、願行合一，把心願逐步完成', key: 'career', boost: [5, 4, 19, 1, 3, 17] },
        { label: '善緣和合、關係清明，彼此多一分理解', key: 'love', boost: [8, 1, 3, 19, 4, 5] }
      ]
    },
    {
      question: '當事情不順、心念不定時，你最常落入哪一種狀態？',
      options: [
        { label: '感受格外敏銳，容易受環境氛圍與他人情緒影響', key: 'spirit', boost: [17, 1, 2, 5, 19, 7] },
        { label: '開始擔心財務，反覆盤算未來是否足夠', key: 'wealth', boost: [4, 19, 4, 1, 10, 5] },
        { label: '猶豫、拖延，原本想做的事失去節奏', key: 'career', boost: [6, 3, 19, 1, 4, 15] },
        { label: '過度在意他人的回應，很難回到自己的心', key: 'love', boost: [9, 1, 2, 18, 7, 4] }
      ]
    },
    {
      question: '此刻，你最希望哪一部分的命運重新轉動？',
      options: [
        { label: '靜心、睡眠、修持與元神安定', key: 'spirit', boost: [20, 1, 2, 3, 14, 12] },
        { label: '收入、財氣、福祿與生活安穩', key: 'wealth', boost: [3, 20, 6, 1, 7, 5] },
        { label: '工作、志業、機會與行動突破', key: 'career', boost: [4, 4, 20, 1, 3, 17] },
        { label: '感情、家人、人際與善緣圓滿', key: 'love', boost: [7, 1, 3, 20, 4, 5] }
      ]
    },
    {
      question: '最近，內在最常浮現哪一種提醒？',
      options: [
        { label: '心浮、夢多，精神始終沒有真正安住', key: 'spirit', boost: [18, 1, 2, 4, 18, 9] },
        { label: '對未來支出與資源不足有揮之不去的擔心', key: 'wealth', boost: [5, 19, 4, 1, 9, 5] },
        { label: '知道時機正在靠近，卻尚未跨出關鍵一步', key: 'career', boost: [5, 4, 18, 1, 3, 18] },
        { label: '某段關係、某個人或一句話仍停留在心裡', key: 'love', boost: [8, 1, 2, 19, 5, 5] }
      ]
    },
    {
      question: '完成觀照後，你最想向堂上眾仙佛發下哪一個願？',
      options: [
        { label: '願元神安住，在變動之中仍保持清明', key: 'spirit', boost: [20, 2, 2, 3, 14, 13] },
        { label: '願福祿增長，正財順行，生活安穩無虞', key: 'wealth', boost: [4, 20, 7, 1, 7, 6] },
        { label: '願志業開展，貴人助緣，所行有所成', key: 'career', boost: [5, 4, 20, 1, 3, 18] },
        { label: '願善緣和合，關係得到理解、修復與圓滿', key: 'love', boost: [8, 1, 3, 20, 4, 5] }
      ]
    }
  ];

  const results = {
    spirit: {
      energy: '元神安定・守正清明',
      name: '元神光彩御守',
      lead: '此刻先安元神、定心念，命運的方向才會逐漸清楚。',
      copy: '六象結果顯示，近期較需要護持的是元神安定與護身守正。當心念散亂，判斷、感應與行動也容易失去準心。元神光彩御守所承載的願，是提醒自己收攝心神、守住正念，在環境變動與修持過程中，不失本心與靈光。',
      target: 'product-spirit'
    },
    wealth: {
      energy: '福祿承接・正財順行',
      name: '財富滿堂御守',
      lead: '此刻需要的，不只是一份財運，更是承接福祿的安定與分寸。',
      copy: '六象結果顯示，近期較需要護持的是福祿承接與生活安穩。財富滿堂御守所承載的願，是祈求正財順行、福祿具足，也提醒自己以正念、勤勉與穩健的選擇承接資源，讓豐盛有可安住之處。',
      target: 'product-wealth'
    },
    career: {
      energy: '願行合一・志業開展',
      name: '事業成就御守',
      lead: '心中的願已經成形，接下來要讓願力與行動合一。',
      copy: '六象結果顯示，近期較需要護持的是願行開展與天命願力。事業成就御守所承載的願，是祈求志業有路、貴人助緣、判斷清楚，也提醒自己在該前進時勇於承擔，使所願有所行、所行有所成。',
