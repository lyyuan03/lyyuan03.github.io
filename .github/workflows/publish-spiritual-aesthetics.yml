              '護身結界': '護身守正',
              '揭曉此刻守護御守': '查看相應的祈願御守',
              '前往查看守護御守': '前往查看此款御守',
              '本測驗為靈性自我觀照與祈願選物參考，不等同神諭、問事、命理定論或醫療診斷。': '本測驗為靈性自我觀照與祈願選物參考，不作為神諭、問事、命理定論、醫療或心理診斷。祈願仍須配合自身正念、行動與責任。',
              "if(heading)heading.textContent='靈運六象自我觀照';": "if(heading)heading.textContent='靈運六象觀照';",
