              '視覺示意': '商品圖',
              '<script src="assets/spiritual-aesthetics-quiz.js" defer></script>': '<script src="assets/spiritual-aesthetics-quiz.js?v=6" defer></script>'
          }
          for old, new in template_replacements.items():
              template_text = template_text.replace(old, new)
