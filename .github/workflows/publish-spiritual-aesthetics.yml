          )
          loader_file.write_text(loader_text, encoding='utf-8')

          quiz_text = quiz_file.read_text(encoding='utf-8')
          new_quiz_copy = r"""  const axisLabels = {
    stability: '元神安定',
    abundance: '福祿承接',
    action: '願行開展',
    harmony: '因緣和合',
    protection: '護身守正',
    focus: '天命願力'
  };

  const questions = [
    {
      question: '最近一個月，你最希望哪一處運勢得到護持？',
      options: [
        { label: '心神容易浮動，常受外境與他人情緒牽引', key: 'spirit', boost: [20, 2, 1, 4, 15, 8] },
