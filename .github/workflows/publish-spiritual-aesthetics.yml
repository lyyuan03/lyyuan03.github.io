name: Publish spiritual aesthetics gallery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-spiritual-aesthetics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine gallery copy and publish production page
        shell: python
        run: |
          from pathlib import Path
          import re

          template = Path('spiritual-aesthetics-preview.html')
