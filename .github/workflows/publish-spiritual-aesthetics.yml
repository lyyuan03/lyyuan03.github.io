          wrapper_text = wrapper.read_text(encoding='utf-8')
          wrapper_replacements = {
              'src="spiritual-aesthetics-preview.html"': 'src="spiritual-aesthetics-preview.html?v=20260803-copy-1"',
              'SPIRITUAL FORTUNE · OMAMORI': 'LING YUAN · PRAYER · OMAMORI',
              '此刻，你的靈運需要哪一種護持？': '此刻，你的靈運最需要哪一種護持？',
              '透過六個生命面向，觀察元神、福祿、願行與因緣的流動，再找出此刻較需要的守護。': '透過六個生命面向，靜心觀照元神、福祿、願行、因緣、護身與天命的近況，作為選擇御守的祈願參考。',
              '你的靈運與願力輪廓': '你的靈運六象與願力輪廓',
