              '用於空間淨化、家宅護安與日常結界。預覽價格依三包套組呈現，一般與會員方案以綠界表單為準。': '供日常淨香、家宅護安與祈福之用。請依靈元院說明敬慎使用；一般與會員方案以綠界表單為準。',
