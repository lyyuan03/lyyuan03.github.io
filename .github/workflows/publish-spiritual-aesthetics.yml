                  raise SystemExit(f'Missing {path}')

          template_text = template.read_text(encoding='utf-8')
          template_replacements = {
              '靈元院靈性美學館預覽頁。以日式幽玄美學呈現御守與護安香品，點選商品前往綠界選購。': '靈元院靈性美學館，收錄祈願御守與鎮煞護安香粉，讓虔敬、守護與日常修持安住於生活之中。',
