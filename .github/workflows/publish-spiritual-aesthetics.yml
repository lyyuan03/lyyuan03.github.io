              '<span class="badge">財運祈願</span>': '<span class="badge">福祿財運</span>',
              '<span class="badge">志業成就</span>': '<span class="badge">志業開展</span>',
              '祈願安定心神、守護元神，在環境轉換與修持之中保持清明。': '祈願元神清明、心念安定，在修持、環境轉換與人生起伏之中，不失本心。',
              '祈願財氣流轉、心念安定，在金錢決策與生活選擇中保持穩健。': '祈願福祿具足、正財順行，提醒自己以正念、勤勉與穩健之心承接豐盛。',
