              '以靈元院的法脈精神為核心，選入御守與護香。保留宗教器物應有的莊重，也讓每一件作品能自然融入當代生活。': '靈性美學館收錄靈元院祈願御守與護安香品。每一件選物皆以虔敬之心承載願念，提醒我們在日常起心動念之間，守住正念、善念與行願之心。',
              '>瀏覽館藏<': '>瀏覽祈願選物<',
              '>直接前往綠界<': '>前往綠界選購<',
              '靜穆之物，承載一念之心': '一念虔誠，讓守護回到日常',
              '延續「宇色靈修著作」的留白、紙張質感與沉穩色系，加入日式神社、繪馬、金箔與幽玄森林的視覺語彙，形成靈元院一致而獨立的選物空間。': '靈性美學館所選之物，並非單純裝飾，而是承接祈願、提醒修持的日常助緣。願每一次看見、佩戴與使用，都能讓人收攝心念，記得自己所發的願，也記得以正念行於人間。',
              '<b>法脈與美學並存</b><span>不以喧鬧促銷為主，而以莊重、清楚的方式呈現每件商品的祈願意義。</span>': '<b>一念祈願</b><span>每一款御守皆承載不同的祈願方向，提醒佩戴者守心、正念，並以實際行動回應自己的願。</span>',
              '<b>御守能量自我覺察</b><span>首頁測驗依照近期生活狀態，提供四款御守之中較適合此刻的祈願方向。</span>': '<b>靈運六象觀照</b><span>從元神、福祿、願行、因緣、護身與天命六個面向，觀照近期狀態，作為選擇御守的祈願參考。</span>',
