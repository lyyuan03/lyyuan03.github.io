name: Probe Firebase Service Account

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-firebase-service-account.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Record active service account email
        run: |
          set -euo pipefail
          ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          test -n "$ACCOUNT"
          mkdir -p .github/deploy-triggers
          printf '%s
' "$ACCOUNT" > .github/deploy-triggers/firebase-service-account-email.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/deploy-triggers/firebase-service-account-email.txt
          git commit -m "Record Firebase service account email" || true
          git pull --rebase origin main
          git push origin HEAD:main
