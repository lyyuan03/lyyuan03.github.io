name: Fix Yuanshen Mobile Article
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-yuanshen-mobile-article.py'
      - '.github/workflows/fix-yuanshen-mobile-article.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: python3 .github/scripts/fix-yuanshen-mobile-article.py
