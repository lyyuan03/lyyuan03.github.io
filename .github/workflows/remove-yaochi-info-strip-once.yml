name: Remove Yaochi Info Strip Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-yaochi-info-strip-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove three info boxes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('yaochi-event-v2.html')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'<div class="info-strip" data-reveal>.*?</div></section>', re.S)
          m = pattern.search(text)
          if not m:
              raise SystemExit('info strip not found')
          replacement = '</section>'
          text = text[:m.start()] + replacement + text[m.end():]
          path.write_text(text, encoding='utf-8')

      - name: Commit updated page
        run: |
          git config user.name "lyyuan03"
          git config user.email "lyyuan03@gmail.com"
          git add yaochi-event-v2.html
          git commit -m "Remove Yaochi event info boxes" || exit 0
          git push
