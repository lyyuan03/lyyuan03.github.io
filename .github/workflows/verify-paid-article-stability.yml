name: Verify paid article stability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-paid-article-stability.yml

concurrency:
  group: verify-paid-article-stability
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for live deployment marker
        shell: bash
        run: |
          set -euo pipefail
          URL="https://lyyuan.tw/articles.html?id=yuanshen-awakening-old-manuscript"
          for i in $(seq 1 30); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$URL" | grep -q '20260902-observer-loop-fix-1'; then
              echo "Live deployment marker detected."
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment... $i/30"
            sleep 10
          done
          echo "Live deployment marker did not appear in time."
          exit 1

      - name: Install Chromium test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Reload same paid article five times
        shell: bash
        run: |
          mkdir -p .github/diagnostics
          cat > /tmp/verify-paid.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const url = 'https://lyyuan.tw/articles.html?id=yuanshen-awakening-old-manuscript';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              ignoreHTTPSErrors: true
            });
            const page = await context.newPage();
            const cdp = await context.newCDPSession(page);
            await cdp.send('Network.enable');
            await cdp.send('Network.setCacheDisabled', { cacheDisabled: true });

            const consoleErrors = [];
            const pageErrors = [];
            const requestFailures = [];
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text().slice(0, 500));
            });
            page.on('pageerror', err => pageErrors.push(String(err).slice(0, 500)));
            page.on('requestfailed', req => requestFailures.push({
              url: req.url(),
              error: req.failure()?.errorText || 'unknown'
            }));

            const runs = [];
            for (let i = 1; i <= 5; i++) {
              const started = Date.now();
              let navigationError = '';
              let loadCompleted = true;
              try {
                if (i === 1) {
                  await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                } else {
                  await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
                }
              } catch (e) {
                navigationError = String(e).slice(0, 500);
              }

              try {
                await page.waitForSelector('.article-view', { timeout: 15000 });
              } catch {}

              try {
                await page.waitForLoadState('load', { timeout: 15000 });
              } catch {
                loadCompleted = false;
              }

              await page.waitForTimeout(2500);

              const exists = async (selector, timeout = 3000) => {
                try {
                  await page.locator(selector).first().waitFor({ state: 'attached', timeout });
                  return true;
                } catch {
                  return false;
                }
              };
              const textOf = async (selector, timeout = 3000) => {
                try {
                  return (await page.locator(selector).first().innerText({ timeout })).trim();
                } catch {
                  return '';
                }
              };

              const articleView = await exists('.article-view', 5000);
              const simpleGate = await exists('.article-paid-gate', 2000);
              const restoredGate = await exists('[data-paid-gate-restored]', 5000);
              const paidLogin = await exists('.article-paid-login, [data-paid-member-login]', 3000);
              const navPresent = await exists('.site-header, nav', 3000);
              const rootText = await textOf('#article-root', 3000);
              const bodyText = await textOf('.article-view .article-body', 3000);
              let title = '';
              try { title = await page.title(); } catch {}

              const state = {
                readyState: loadCompleted ? 'complete' : 'not-complete',
                title,
                articleView,
                simpleGate,
                restoredGate,
                paidLogin,
                navPresent,
                rootTextChars: rootText.length,
                bodyTextChars: bodyText.length,
                bodyTail: bodyText.slice(-180),
                articleAccess: '',
                paidBodyState: '',
                rescued: '',
                navigationType: i === 1 ? 'navigate' : 'reload',
                transferSize: 0
              };

              const passed = state.articleView
                && (state.simpleGate || state.restoredGate)
                && state.paidLogin
                && state.navPresent
                && state.rootTextChars > 100
                && state.bodyTextChars > 100
                && !navigationError;

              runs.push({
                run: i,
                elapsedMs: Date.now() - started,
                loadCompleted,
                navigationError,
                passed,
                ...state
              });
            }

            const report = {
              url,
              checkedAt: new Date().toISOString(),
              allFiveStable: runs.every(r => r.passed),
              runs,
              consoleErrors,
              pageErrors,
              requestFailures: requestFailures.slice(-50)
            };

            fs.writeFileSync(
              '.github/diagnostics/paid-article-live-stability.json',
              JSON.stringify(report, null, 2)
            );
            await browser.close();

            if (!report.allFiveStable) process.exitCode = 2;
          })();
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/verify-paid.js

      - name: Commit browser verification report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f .github/diagnostics/paid-article-live-stability.json ]; then
            exit 0
          fi
          git add .github/diagnostics/paid-article-live-stability.json
          git commit -m "Record paid article live stability verification" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
