name: Verify paid article stability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-paid-article-stability.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for live deployment marker
        shell: bash
        run: |
          set -euo pipefail
          URL="https://lyyuan.tw/articles.html?id=yuanshen-awakening-old-manuscript"
          for i in $(seq 1 30); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$URL" | grep -q '20260902-single-detail-renderer-1'; then
              echo "Live deployment marker detected."
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment... $i/30"
            sleep 10
          done
          echo "Live deployment marker did not appear in time."
          exit 1

      - name: Install Chromium test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Reload same paid article five times
        shell: bash
        run: |
          mkdir -p .github/diagnostics
          cat > /tmp/verify-paid.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const url = 'https://lyyuan.tw/articles.html?id=yuanshen-awakening-old-manuscript';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              ignoreHTTPSErrors: true,
              extraHTTPHeaders: {
                'Cache-Control': 'no-cache, no-store, max-age=0',
                'Pragma': 'no-cache'
              }
            });
            const page = await context.newPage();
            const cdp = await context.newCDPSession(page);
            await cdp.send('Network.enable');
            await cdp.send('Network.setCacheDisabled', { cacheDisabled: true });

            const consoleErrors = [];
            const pageErrors = [];
            const requestFailures = [];
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text().slice(0, 500));
            });
            page.on('pageerror', err => pageErrors.push(String(err).slice(0, 500)));
            page.on('requestfailed', req => requestFailures.push({
              url: req.url(),
              error: req.failure()?.errorText || 'unknown'
            }));

            const runs = [];
            for (let i = 1; i <= 5; i++) {
              const started = Date.now();
              let navigationError = '';
              let loadCompleted = true;
              try {
                if (i === 1) {
                  await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                } else {
                  await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
                }
              } catch (e) {
                navigationError = String(e).slice(0, 500);
              }

              try {
                await page.waitForSelector('.article-view', { timeout: 15000 });
              } catch {}

              try {
                await page.waitForLoadState('load', { timeout: 15000 });
              } catch {
                loadCompleted = false;
              }

              await page.waitForTimeout(2500);

              const state = await page.evaluate(() => {
                const root = document.getElementById('article-root');
                const view = document.querySelector('.article-view');
                const simpleGate = document.querySelector('.article-paid-gate');
                const restoredGate = document.querySelector('[data-paid-gate-restored]');
                const paidLogin = document.querySelector('.article-paid-login, [data-paid-member-login]');
                const body = document.querySelector('.article-view .article-body');
                const nav = document.querySelector('.site-header, nav');
                const rootText = (root?.innerText || '').trim();
                const bodyText = (body?.innerText || '').trim();
                const navEntry = performance.getEntriesByType('navigation')[0];
                return {
                  readyState: document.readyState,
                  title: document.title,
                  articleView: Boolean(view),
                  simpleGate: Boolean(simpleGate),
                  restoredGate: Boolean(restoredGate),
                  paidLogin: Boolean(paidLogin),
                  navPresent: Boolean(nav),
                  rootTextChars: rootText.length,
                  bodyTextChars: bodyText.length,
                  bodyTail: bodyText.slice(-180),
                  articleAccess: view?.dataset?.articleAccess || '',
                  paidBodyState: view?.dataset?.paidBodyState || '',
                  rescued: root?.dataset?.articleRescued || '',
                  navigationType: navEntry?.type || '',
                  transferSize: navEntry?.transferSize || 0
                };
              });

              const passed = state.articleView
                && (state.simpleGate || state.restoredGate)
                && state.paidLogin
                && state.navPresent
                && state.rootTextChars > 100
                && state.bodyTextChars > 100
                && !navigationError;

              runs.push({
                run: i,
                elapsedMs: Date.now() - started,
                loadCompleted,
                navigationError,
                passed,
                ...state
              });
            }

            const report = {
              url,
              checkedAt: new Date().toISOString(),
              allFiveStable: runs.every(r => r.passed),
              runs,
              consoleErrors,
              pageErrors,
              requestFailures: requestFailures.slice(-50)
            };

            fs.writeFileSync(
              '.github/diagnostics/paid-article-live-stability.json',
              JSON.stringify(report, null, 2)
            );
            await browser.close();

            if (!report.allFiveStable) process.exitCode = 2;
          })();
          NODE
          node /tmp/verify-paid.js

      - name: Commit browser verification report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f .github/diagnostics/paid-article-live-stability.json ]; then
            exit 0
          fi
          git add .github/diagnostics/paid-article-live-stability.json
          git commit -m "Record paid article live stability verification" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
