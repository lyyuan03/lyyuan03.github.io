name: Verify 2058 Formal Site

on:
  push:
    branches:
      - verify-2058-formal-site
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare browser runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core
          which google-chrome
      - name: Inspect formal site and capture diagnostics
        run: |
          cat > verify-2058.js <<'JS'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true, executablePath:'/usr/bin/google-chrome'});
            const page = await browser.newPage({viewport:{width:1440,height:1000}, deviceScaleFactor:1});
            const consoleMessages = [];
            const pageErrors = [];
            const requestFailures = [];
            page.on('console', msg => consoleMessages.push(`${msg.type()}: ${msg.text()}`));
            page.on('pageerror', err => pageErrors.push(String(err)));
            page.on('requestfailed', req => requestFailures.push(`${req.url()} :: ${req.failure()?.errorText || ''}`));
            const url = `https://lyyuan.tw/articles.html?id=2058-future-person-prophecy&verify=20260812-2-${Date.now()}`;
            let responseStatus = null;
            try {
              const response = await page.goto(url, {waitUntil:'domcontentloaded', timeout:60000});
              responseStatus = response?.status() ?? null;
            } catch (e) {
              pageErrors.push(`goto: ${e}`);
            }
            await page.waitForTimeout(15000);
            const data = await page.evaluate(() => ({
              title: document.title,
              href: location.href,
              rootText: document.getElementById('article-root')?.innerText || '',
              bodyText: document.body?.innerText?.slice(0,12000) || '',
              scripts: [...document.scripts].map(s => s.src).filter(Boolean),
              articleCount: document.querySelectorAll('.article-view').length,
              targetCount: document.querySelectorAll('.article-view[data-article-id="2058-future-person-prophecy"]').length,
              coverSrc: document.querySelector('.article-cover')?.getAttribute('src') || null,
              recommendedText: document.querySelector('.recommended-book')?.innerText || null,
              nextText: document.querySelector('.next-reading')?.innerText || null,
              nextHref: document.querySelector('.next-reading a')?.getAttribute('href') || null,
              htmlSnippet: document.getElementById('article-root')?.innerHTML?.slice(0,12000) || ''
            }));
            const report = {url,responseStatus,...data,consoleMessages,pageErrors,requestFailures};
            fs.writeFileSync('formal-2058-diagnostic.json', JSON.stringify(report,null,2));
            await page.screenshot({path:'formal-2058-diagnostic.png', fullPage:true});
            console.log(JSON.stringify(report,null,2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node verify-2058.js
      - uses: actions/upload-artifact@v4
        with:
          name: formal-site-2058-diagnostic
          path: |
            formal-2058-diagnostic.png
            formal-2058-diagnostic.json
          if-no-files-found: error
