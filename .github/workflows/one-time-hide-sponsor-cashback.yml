name: One-time hide sponsor cashback

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-time-hide-sponsor-cashback.yml"

permissions:
  contents: write

concurrency:
  group: one-time-hide-sponsor-cashback
  cancel-in-progress: false

jobs:
  patch-member-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hide cashback for sponsor-only members
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("member-dashboard.js")
          text = path.read_text(encoding="utf-8")
          old = '["dashboard-spend", "dashboard-membership-status", "dashboard-tier-status", "dashboard-period-heading", "dashboard-progress", "dashboard-rights-summary"].forEach((id) => {'
          new = '["dashboard-spend", "dashboard-membership-status", "dashboard-tier-status", "dashboard-period-heading", "dashboard-progress", "dashboard-rights-summary", "dashboard-cashback"].forEach((id) => {'
          if old not in text:
              raise SystemExit("Expected wellness-only section list not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-hide-sponsor-cashback.yml
          git add member-dashboard.js
          git commit -m "贊助文章會員不顯示回饋金項目"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
