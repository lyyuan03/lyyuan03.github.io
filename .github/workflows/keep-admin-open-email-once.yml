name: Keep admin open for email once

on:
  push:
    branches:
      - fix/member-email-salutation-blessing
    paths:
      - scripts/keep_admin_open_for_email_once.py
      - .github/workflows/keep-admin-open-email-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/member-email-salutation-blessing
          fetch-depth: 0
      - run: python3 scripts/keep_admin_open_for_email_once.py
      - run: |
          node --check membership-admin.js
          ! grep -q 'location.href = url' membership-admin.js
          grep -q '目前後台頁面會保留不變' membership-admin.js
          grep -q '20260806-email-new-tab-1' admin.html
      - run: rm -f scripts/keep_admin_open_for_email_once.py .github/workflows/keep-admin-open-email-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "keep admin page open when composing member emails"
          git push origin HEAD:fix/member-email-salutation-blessing
