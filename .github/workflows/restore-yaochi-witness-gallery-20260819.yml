name: Restore Yaochi witness gallery

on:
  push:
    paths:
      - '.github/workflows/restore-yaochi-witness-gallery-20260819.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore three witness images only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('yaochi-event-v2.html')
          s = p.read_text(encoding='utf-8')
          if 'building-witness-gallery' in s:
              raise SystemExit('Gallery already present; no change made')
          marker = '<div class="building-witness-grid">'
          if marker not in s:
              raise SystemExit('Building witness grid marker not found; no change made')
          gallery = '''<div class="building-witness-gallery" aria-label="靈元院建院願景圖"><figure><img src="/images/dizhi-render-garden.jpg?v=20260819-1825" alt="靈元院新址庭院景觀3D示意圖"></figure><figure><img src="/images/dizhi-render-exterior.jpg?v=20260819-1825" alt="靈元院新址建築外觀3D示意圖"></figure><figure><img src="/images/dizhi-blueprint.jpg?v=20260819-1825" alt="靈元院新址3D藍圖"></figure></div>'''
          s = s.replace(marker, gallery + marker, 1)
          css_marker = '.building-witness-grid {'
          if css_marker not in s:
              raise SystemExit('Building witness CSS marker not found; no change made')
          gallery_css = '''
    .building-witness-gallery {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 20px;}
    .building-witness-gallery figure {margin:0;overflow:hidden;border:1px solid rgba(214,184,132,.36);border-radius:9px;background:rgba(8,16,10,.72);box-shadow:0 8px 22px rgba(0,0,0,.18);}
    .building-witness-gallery img {display:block;width:100%;height:210px;object-fit:cover;transition:transform .8s ease;}
    .building-witness-gallery figure:hover img {transform:scale(1.025);}
'''
          s = s.replace(css_marker, gallery_css + '    ' + css_marker, 1)
          mobile_marker = '.building-witness-grid { grid-template-columns: 1fr; }'
          if mobile_marker in s:
              s = s.replace(mobile_marker, '.building-witness-gallery { grid-template-columns: 1fr; gap:12px; }\n      .building-witness-gallery img { height:auto; aspect-ratio:16/9; }\n      ' + mobile_marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yaochi-event-v2.html
          git commit -m 'fix: restore yaochi witness gallery'
          git push
