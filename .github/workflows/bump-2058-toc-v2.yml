name: Refresh 2058 TOC cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-2058-toc-v2.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump 2058 TOC script version
        shell: python
        run: |
          from pathlib import Path
          page = Path('articles.html')
          text = page.read_text()
          text = text.replace('/article-2058-toc.js?v=20260816-1', '/article-2058-toc.js?v=20260816-2')
          page.write_text(text)
          Path('.github/workflows/bump-2058-toc-v2.yml').unlink(missing_ok=True)
      - name: Commit refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh 2058 TOC cache version"
          git push
