name: Fix Yaochi Banner Binary Once

# Rebuild the valid JPEG from verified base64 parts.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-yaochi-banner-binary-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild and verify banner
        run: |
          set -euo pipefail
          cat .tmp3/p00.b64 .tmp3/p01a.b64 .tmp3/p01b.b64 .tmp3/p02.b64 .tmp3/p03.b64 .tmp3/p04a.b64 .tmp3/p04b.b64 .tmp3/p05.b64 .tmp3/p06a.b64 .tmp3/p06b.b64 .tmp3/p07a.b64 .tmp3/p07b.b64 .tmp3/p08.b64 .tmp3/p09.b64 .tmp3/p10.b64 .tmp3/p11.b64 .tmp3/p12.b64 .tmp3/p13.b64 .tmp3/p14a.b64 .tmp3/p14b.b64 .tmp3/p15.b64 | base64 --decode > yaochi-event-banner-20260817.jpg
          echo "931b3125316d3c311cf169fbf88cca9ebb814dbf7468ab2fd38984fc63822ee0  yaochi-event-banner-20260817.jpg" | sha256sum -c -
          file yaochi-event-banner-20260817.jpg

      - name: Update page image reference
        shell: python
        run: |
          from pathlib import Path
          p = Path('yaochi-event-v2.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('yaochi-event-banner-20260817.webp?v=20260817-1636', 'yaochi-event-banner-20260817.jpg?v=20260817-1718')
          p.write_text(text, encoding='utf-8')

      - name: Commit repaired banner
        run: |
          rm -f yaochi-event-banner-20260817.webp
          rm -rf .tmp .tmp2 .tmp3
          git config user.name "lyyuan03"
          git config user.email "lyyuan03@gmail.com"
          git add -A
          git commit -m "Repair Yaochi event banner image" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
