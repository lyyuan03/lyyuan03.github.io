name: Fix Yaochi Banner Binary Once

# Diagnose staged base64.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-yaochi-banner-binary-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Diagnose staged part
        run: |
          wc -c .tmp2/banner-q15-part-00.b64
          sha1sum .tmp2/banner-q15-part-00.b64
          head -c 40 .tmp2/banner-q15-part-00.b64; echo
          tail -c 40 .tmp2/banner-q15-part-00.b64; echo
          python - <<'PY'
          from pathlib import Path
          s=Path('.tmp2/banner-q15-part-00.b64').read_text()
          bad=[(i,repr(c)) for i,c in enumerate(s) if c not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n']
          print('bad_count',len(bad),'first_bad',bad[:10])
          PY
