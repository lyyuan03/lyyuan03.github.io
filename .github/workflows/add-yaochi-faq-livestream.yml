name: Add Yaochi FAQ livestream note

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-yaochi-faq-livestream.yml'

permissions:
  contents: write

jobs:
  add-faq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add livestream FAQ item
        shell: python
        run: |
          from pathlib import Path

          path = Path('yaochi-event-v2.html')
          text = path.read_text(encoding='utf-8')

          if '本次法會有開放遠距直播共修嗎？' in text:
              raise SystemExit('FAQ item already exists')

          marker = '''          <article class="faq-card wide">\n            <span class="faq-no">04</span>'''
          start = text.find(marker)
          if start == -1:
              raise SystemExit('FAQ 04 marker not found')

          end_marker = '''          </article>\n        </div>\n      </div>\n    </section>'''
          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit('FAQ section end not found')

          article_end = end + len('          </article>')
          q5 = '''\n          <article class="faq-card wide">\n            <span class="faq-no">05</span>\n            <h3>本次法會有開放遠距直播共修嗎？</h3>\n            <p class="faq-highlight"><strong>本次法會未開放遠距直播共修。</strong></p>\n            <ul>\n              <li>信眾可透過線上表單完成登記，無須親臨道場。</li>\n              <li>法會當日，將由<strong>靈元院於佛堂依各項登記內容，恭行母娘祝壽、祈福及相關法儀</strong>，並為參與信眾宣疏迴向。</li>\n              <li>雖未安排線上同步直播，信眾仍可於法會期間，在方便之處保持一念恭敬與清淨，靜心祝禱，以虔誠之心與母娘聖誕祝壽願力相應。</li>\n            </ul>\n          </article>'''

          text = text[:article_end] + q5 + text[article_end:]
          path.write_text(text, encoding='utf-8')

      - name: Commit and push
        run: |
          if git diff --quiet -- yaochi-event-v2.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "lyyuan03"
          git config user.email "actions@users.noreply.github.com"
          git add yaochi-event-v2.html
          git commit -m "Add livestream participation FAQ to Yaochi page"
          git push
