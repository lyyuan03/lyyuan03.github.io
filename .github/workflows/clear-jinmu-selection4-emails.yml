name: Clear Jinmu Selection 4 Emails

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - functions/clear-jinmu-selection4-emails.mjs
      - .github/workflows/clear-jinmu-selection4-emails.yml

permissions:
  contents: read

jobs:
  clear-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - name: Remove all participant email access from Jinmu Selection 4
        run: node functions/clear-jinmu-selection4-emails.mjs
