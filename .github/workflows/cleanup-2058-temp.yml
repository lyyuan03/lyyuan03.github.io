name: Cleanup 2058 temporary staging

on:
  push:
    paths:
      - ".github/workflows/cleanup-2058-temp.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for and verify finalized article state
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            git fetch origin main
            git reset --hard origin/main
            if [ -f assets/articles/2058-future-person-prophecy/bath-test.webp ] \
               && [ -f assets/articles/2058-future-person-prophecy/prediction-record.webp ] \
               && [ -f assets/articles/2058-future-person-prophecy/consciousness-network.webp ]; then
              b=$(sha256sum assets/articles/2058-future-person-prophecy/bath-test.webp | awk '{print $1}')
              r=$(sha256sum assets/articles/2058-future-person-prophecy/prediction-record.webp | awk '{print $1}')
              n=$(sha256sum assets/articles/2058-future-person-prophecy/consciousness-network.webp | awk '{print $1}')
              if [ "$b" = "08502de8b499a362c74d261936912ecb7640cd5e14112e7eba1446895fd33b1f" ] \
                 && [ "$r" = "5fb706e98c36fa766e1598572fb1fb58842ba7d13ee0e9847692e04dad7771ad" ] \
                 && [ "$n" = "5f7dbd0f2a18f71bb71a6432165375281697b182225dae0ed9d234a31260122c" ] \
                 && grep -Fq 'prediction-record.webp?v=20260813-1' article-2058-future-person-prophecy.js \
                 && grep -Fq 'bath-test.webp?v=20260813-1' article-2058-future-person-prophecy.js \
                 && grep -Fq 'consciousness-network.webp?v=20260813-1' article-2058-future-person-prophecy.js \
                 && grep -Fq '<!-- paid-only -->' article-2058-future-person-prophecy.js \
                 && ! grep -Fq 'verification.webp' article-2058-future-person-prophecy.js; then
                ok=1
                break
              fi
            fi
            sleep 4
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Final article/image verification did not pass; refusing cleanup.' >&2
            exit 1
          fi
          echo 'Final article and all three WebP images verified.'

      - name: Remove temporary staging and one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/image-rebuild-temp
          rm -f .github/workflows/rebuild-2058-images.yml
          rm -f .github/workflows/rebuild-2058-images-final.yml
          rm -f .github/workflows/rebuild-2058-images-final2.yml
          rm -f .github/workflows/cleanup-2058-temp.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to clean.'
            exit 0
          fi
          git commit -m "Clean temporary 2058 image staging"
          git pull --rebase origin main
          git push origin HEAD:main
