name: Fix article loading

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-article-loading.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-article-loading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch article rendering order
        shell: python
        run: |
          from pathlib import Path

          articles_js = Path("articles.js")
          source = articles_js.read_text(encoding="utf-8")
          old = '''  loadedArticles = hydratedArticles.sort(sortPublished);
          renderTabs();
          await loadArticleMetrics();

          renderCurrentView();'''
          new = '''  loadedArticles = hydratedArticles.sort(sortPublished);
          renderTabs();

          // 文章內容優先顯示；閱讀統計改為背景載入，避免統計請求延遲時整頁卡在「文章載入中」。
          renderCurrentView();
          void loadArticleMetrics().then(() => {
            loadedArticles.forEach((article) => updateMetricSummary(articleKey(article)));
          });'''
          if old not in source:
              raise SystemExit("找不到預期的 articles.js 程式區段，已停止修改。")
          articles_js.write_text(source.replace(old, new, 1), encoding="utf-8")

          articles_html = Path("articles.html")
          html = articles_html.read_text(encoding="utf-8")
          old_version = 'articles.js?v=20260805-simple-links-1'
          new_version = 'articles.js?v=20260805-loading-fix-1'
          if old_version not in html:
              raise SystemExit("找不到 articles.html 的舊版快取參數，已停止修改。")
          articles_html.write_text(html.replace(old_version, new_version, 1), encoding="utf-8")

          Path(".github/workflows/fix-article-loading.yml").unlink()

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.js articles.html .github/workflows/fix-article-loading.yml
          git commit -m "Fix article page loading block"
          git push
