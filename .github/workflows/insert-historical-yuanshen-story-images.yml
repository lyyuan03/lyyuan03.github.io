name: Insert Two Historical Yuanshen Story Images
on:
  pull_request:
    paths:
      - '.github/scripts/insert-historical-yuanshen-story-images.mjs'
      - '.github/workflows/insert-historical-yuanshen-story-images.yml'
      - 'assets/articles/historical-yuanshen-destiny-cultivation/**'
      - 'articles.html'
  push:
    branches: [main]
    paths:
      - '.github/scripts/insert-historical-yuanshen-story-images.mjs'
      - '.github/workflows/insert-historical-yuanshen-story-images.yml'
      - 'assets/articles/historical-yuanshen-destiny-cultivation/**'
      - 'articles.html'

permissions:
  contents: read

concurrency:
  group: insert-historical-yuanshen-two-story-images
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact image placement and production safety
        run: |
          node --check .github/scripts/insert-historical-yuanshen-story-images.mjs
          node .github/scripts/insert-historical-yuanshen-story-images.mjs --self-test
          node scripts/lock-paid-article-access-policy.mjs
          node scripts/audit-paid-article-runtime.mjs
          node scripts/audit-production-stability.mjs
          file assets/articles/historical-yuanshen-destiny-cultivation/05-yuan-shikai-toad-bedroom.jpg
          file assets/articles/historical-yuanshen-destiny-cultivation/06-night-market-woman.jpg

  migrate:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use existing authenticated Firestore publisher
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Wait until both self-hosted JPEGs are live, then atomically update paid Markdown and hash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/insert-historical-yuanshen-story-images.mjs
      - name: Retain private-content-free verification proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: historical-yuanshen-two-story-images-proof
          path: /tmp/historical-yuanshen-two-story-image-proof.json
          retention-days: 7
