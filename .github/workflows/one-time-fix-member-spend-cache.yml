name: One-time member spend cache fix

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-member-spend-cache.yml'

permissions:
  contents: write

jobs:
  patch-cache-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Force new member dashboard modules
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard_js = Path('member-dashboard.js')
          text = dashboard_js.read_text(encoding='utf-8')
          old = 'from "./member-dashboard-logic.js";'
          new = 'from "./member-dashboard-logic.js?v=20260805-taipei-cycle-1";'
          if new not in text:
              if old not in text:
                  raise SystemExit('member-dashboard.js import not found')
              text = text.replace(old, new, 1)
              dashboard_js.write_text(text, encoding='utf-8')

          dashboard_html = Path('member-dashboard.html')
          html = dashboard_html.read_text(encoding='utf-8')
          old_html = '/member-dashboard.js?v=20260804-article-benefit-1'
          new_html = '/member-dashboard.js?v=20260805-taipei-cycle-1'
          if new_html not in html:
              if old_html not in html:
                  raise SystemExit('member-dashboard.html script version not found')
              html = html.replace(old_html, new_html, 1)
              dashboard_html.write_text(html, encoding='utf-8')
          PY
      - name: Commit cache version update
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add member-dashboard.js member-dashboard.html
          git commit -m '強制更新會員中心年度消費程式版本'
          git push
