name: Move Yaochi Pilgrimage Section Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/move-yaochi-pilgrimage-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move pilgrimage section below core patronage
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('yaochi-event-v2.html')
          text = path.read_text(encoding='utf-8')

          pilgrimage_re = re.compile(r'<section class="section narrow" id="pilgrimage">.*?</section>', re.S)
          items_re = re.compile(r'(<section class="section wide" id="items">.*?</section>)', re.S)

          pilgrimage_match = pilgrimage_re.search(text)
          if not pilgrimage_match:
              raise SystemExit('pilgrimage section not found')

          pilgrimage = pilgrimage_match.group(0)
          text_without = text[:pilgrimage_match.start()] + text[pilgrimage_match.end():]

          items_match = items_re.search(text_without)
          if not items_match:
              raise SystemExit('items section not found')

          insert_at = items_match.end()
          updated = text_without[:insert_at] + pilgrimage + text_without[insert_at:]
          path.write_text(updated, encoding='utf-8')

      - name: Commit reordered page
        run: |
          git config user.name "lyyuan03"
          git config user.email "lyyuan03@gmail.com"
          git add yaochi-event-v2.html
          git commit -m "Move first pilgrimage section below core patronage" || exit 0
          git push
