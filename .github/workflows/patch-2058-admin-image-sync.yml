name: Patch 2058 Admin Image Sync

on:
  push:
    branches:
      - fix-2058-admin-image-sync
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-2058-admin-image-sync
      - name: Patch admin image sync
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('article-admin-core.js')
          text = core.read_text(encoding='utf-8')

          text = text.replace(
              'import { staticArticles } from "./static-articles.js?v=20260807-article-sync-1";',
              'import { staticArticles } from "./static-articles.js?v=20260812-2058-image-sync-1";',
              1,
          )

          marker = '''const staticArticleSyncRevisions = new Map([\n  ["reading-you-can-not-fear-death", "20260802-backend-sync-1"]\n]);'''
          replacement = marker + '''\nconst staticImageSyncRevisions = new Map([\n  ["2058-future-person-prophecy", "20260812-2058-image-sync-1"]\n]);'''
          if marker not in text:
              raise SystemExit('staticArticleSyncRevisions marker not found')
          text = text.replace(marker, replacement, 1)

          insert_after = '''async function syncRevisedStaticArticles(snapshot) {\n  const firestoreById = new Map(snapshot.docs.map((item) => [item.id, item.data()]));\n  let didSync = false;\n  for (const [articleId, revision] of staticArticleSyncRevisions) {\n    const current = firestoreById.get(articleId);\n    if (current?.staticSyncRevision === revision) continue;\n    const article = staticArticles.find((item) => item.id === articleId);\n    if (!article) continue;\n    const payload = staticArticlePayload(article, revision);\n    if (!current) {\n      payload.createdAt = serverTimestamp();\n      if (payload.status === "published") payload.publishedAt = serverTimestamp();\n    }\n    await setDoc(doc(db, "articles", articleId), payload, { merge: true });\n    didSync = true;\n  }\n  return didSync;\n}\n'''
          image_sync = '''\nasync function syncRevisedStaticArticleImages(snapshot) {\n  const firestoreById = new Map(snapshot.docs.map((item) => [item.id, item.data()]));\n  let didSync = false;\n  for (const [articleId, revision] of staticImageSyncRevisions) {\n    const current = firestoreById.get(articleId);\n    const article = staticArticles.find((item) => item.id === articleId);\n    if (!current || !article) continue;\n    const desiredCoverImage = article.coverImage || "";\n    const desiredThumbnailImage = article.thumbnailImage || "";\n    if (\n      current.staticImageSyncRevision === revision\n      && (current.coverImage || "") === desiredCoverImage\n      && (current.thumbnailImage || "") === desiredThumbnailImage\n    ) continue;\n    await setDoc(doc(db, "articles", articleId), {\n      coverImage: desiredCoverImage,\n      thumbnailImage: desiredThumbnailImage,\n      staticImageSyncRevision: revision,\n      staticImageSourceUpdatedAt: article.updatedAt || "",\n      updatedAt: serverTimestamp()\n    }, { merge: true });\n    didSync = true;\n  }\n  return didSync;\n}\n'''
          if insert_after not in text:
              raise SystemExit('syncRevisedStaticArticles block not found')
          text = text.replace(insert_after, insert_after + image_sync, 1)

          old_load = '''    let snapshot = await getDocs(collection(db, "articles"));\n    if (await syncRevisedStaticArticles(snapshot)) {\n      snapshot = await getDocs(collection(db, "articles"));\n      showAdminToast("《你可以不怕死》前後台內容已完成同步。", "success");\n    }'''
          new_load = '''    let snapshot = await getDocs(collection(db, "articles"));\n    const didImageSync = await syncRevisedStaticArticleImages(snapshot);\n    const didContentSync = await syncRevisedStaticArticles(snapshot);\n    if (didImageSync || didContentSync) {\n      snapshot = await getDocs(collection(db, "articles"));\n      if (didContentSync) showAdminToast("《你可以不怕死》前後台內容已完成同步。", "success");\n      if (didImageSync) showAdminToast("2058 未來人文章前後台圖片已完成同步。", "success");\n    }'''
          if old_load not in text:
              raise SystemExit('loadArticles sync block not found')
          text = text.replace(old_load, new_load, 1)

          old_merge = '''    const mergedArticles = new Map(\n      staticArticles.map((article) => [article.id, { ...article, source: "github-static" }])\n    );\n    firestoreArticles.forEach((article) => mergedArticles.set(article.id, article));'''
          new_merge = '''    const mergedArticles = new Map(\n      staticArticles.map((article) => [article.id, { ...article, source: "github-static" }])\n    );\n    firestoreArticles.forEach((article) => {\n      const staticArticle = staticArticles.find((item) => item.id === article.id);\n      if (staticImageSyncRevisions.has(article.id) && staticArticle) {\n        mergedArticles.set(article.id, {\n          ...article,\n          coverImage: staticArticle.coverImage || article.coverImage || "",\n          thumbnailImage: staticArticle.thumbnailImage || article.thumbnailImage || ""\n        });\n      } else {\n        mergedArticles.set(article.id, article);\n      }\n    });'''
          if old_merge not in text:
              raise SystemExit('mergedArticles block not found')
          text = text.replace(old_merge, new_merge, 1)
          core.write_text(text, encoding='utf-8')

          wrapper = Path('article-admin.js')
          text = wrapper.read_text(encoding='utf-8')
          old = 'import "./article-admin-core.js?v=20260812-article-notify-1";'
          new = 'import "./article-admin-core.js?v=20260812-2058-image-sync-1";'
          if old not in text:
              raise SystemExit('article-admin core import not found')
          wrapper.write_text(text.replace(old, new, 1), encoding='utf-8')

          admin = Path('admin.html')
          text = admin.read_text(encoding='utf-8')
          old = 'article-admin.js?v=20260807-hide-sponsor-quota-1'
          new = 'article-admin.js?v=20260812-2058-image-sync-1'
          if old not in text:
              raise SystemExit('admin article-admin script version not found')
          admin.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/patch-2058-admin-image-sync.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Validate patch
        run: |
          grep -q '2058-future-person-prophecy", "20260812-2058-image-sync-1' article-admin-core.js
          grep -q 'syncRevisedStaticArticleImages' article-admin-core.js
          grep -q 'thumbnailImage: desiredThumbnailImage' article-admin-core.js
          grep -q 'coverImage: staticArticle.coverImage' article-admin-core.js
          grep -q 'article-admin-core.js?v=20260812-2058-image-sync-1' article-admin.js
          grep -q 'article-admin.js?v=20260812-2058-image-sync-1' admin.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix 2058 admin image sync'
          git push
