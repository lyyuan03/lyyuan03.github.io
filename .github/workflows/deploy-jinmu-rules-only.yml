name: Deploy Jinmu Firestore Rules Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - .github/workflows/deploy-jinmu-rules-only.yml

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - name: Deploy Firestore security rules only
        run: node functions/jinmu-series-sync.mjs rules
