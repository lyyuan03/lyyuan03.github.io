name: One-time sponsor article access cache refresh

on:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/fix-sponsor-article-access.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump article access cache keys
        run: |
          python - <<'PY'
          from pathlib import Path

          wrapper = Path("articles-v6.js")
          text = wrapper.read_text(encoding="utf-8")
          old = "./articles-core-20260810-v6.js?v=20260813-auth-rerender-fix-1"
          new = "./articles-core-20260810-v6.js?v=20260813-sponsor-only-access-fix-2"
          if old not in text:
              raise SystemExit("Expected core cache key not found")
          wrapper.write_text(text.replace(old, new, 1), encoding="utf-8")

          page = Path("articles.html")
          html = page.read_text(encoding="utf-8")
          old_html = 'articles-v6.js?v=20260813-auth-rerender-fix-1'
          new_html = 'articles-v6.js?v=20260813-sponsor-only-access-fix-2'
          if old_html not in html:
              raise SystemExit("Expected articles-v6 cache key not found")
          page.write_text(html.replace(old_html, new_html, 1), encoding="utf-8")
          PY

      - name: Verify cache refresh
        run: |
          grep -F 'articles-core-20260810-v6.js?v=20260813-sponsor-only-access-fix-2' articles-v6.js
          grep -F 'articles-v6.js?v=20260813-sponsor-only-access-fix-2' articles.html

      - name: Commit cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles-v6.js articles.html
          git commit -m "fix(articles): refresh sponsor access client cache"
          git push origin HEAD:main
