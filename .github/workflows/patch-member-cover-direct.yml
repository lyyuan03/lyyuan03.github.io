name: Patch direct member video covers

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-member-cover-direct.yml"

permissions:
  contents: write

concurrency:
  group: "patch-member-cover-direct"
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update cache versions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "admin.html": (
                  "member-video-admin.js?v=20260805-cover-upload-4",
                  "member-video-admin.js?v=20260805-cover-direct-1",
              ),
              "member-videos.html": (
                  "member-videos.js?v=20260805-cover-display-4",
                  "member-videos.js?v=20260805-cover-data-1",
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected version not found in {filename}: {old}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          workflow = Path(".github/workflows/patch-member-cover-direct.yml")
          workflow.unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html member-videos.html .github/workflows/patch-member-cover-direct.yml
          git commit -m "啟用直接儲存的會員影片封面"
          git push
