name: Clean love article Markdown emphasis only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clean-love-article-markdown.yml
      - functions/clean-love-article-markdown.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix functions ci
      - name: Remove literal double-asterisk Markdown styling from exactly one article
        run: node functions/clean-love-article-markdown.mjs