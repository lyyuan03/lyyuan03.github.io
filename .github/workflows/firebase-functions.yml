name: Deploy Firebase Membership Backend

# 可由 Actions 手動執行，或更新指定請求檔案後執行一次完整部署。
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/deploy-triggers/firebase-functions-request.txt"

concurrency:
  group: firebase-membership-backend
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Record backend workflow start
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          mkdir -p .github/deploy-triggers
          {
            echo "firebase membership backend: started"
            echo "run id: $GITHUB_RUN_ID"
            echo "started at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > .github/deploy-triggers/firebase-functions-started.txt
          git add .github/deploy-triggers/firebase-functions-started.txt
          git commit -m "Record Firebase membership deployment start" || true
          git push origin HEAD:main || true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: lyyuan03-membership

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify backend
        run: npm --prefix functions ci && npm --prefix functions test && npm --prefix functions run lint

      - name: Deploy all membership functions
        run: firebase deploy --only functions --project lyyuan03-membership --non-interactive

      - name: Verify sponsor checkout endpoints
        run: |
          offer_url="https://asia-east1-lyyuan03-membership.cloudfunctions.net/sponsorOfferStatus"
          checkout_url="https://asia-east1-lyyuan03-membership.cloudfunctions.net/createPublicSponsorCheckout"

          offer_status=""
          for attempt in $(seq 1 12); do
            offer_status=$(curl --silent --show-error --output /tmp/sponsor-offer.json --write-out "%{http_code}" \
              --header "Origin: https://lyyuan.tw" \
              "$offer_url?t=$GITHUB_RUN_ID")
            if [ "$offer_status" = "200" ]; then
              break
            fi
            sleep 5
          done
          if [ "$offer_status" != "200" ] || ! grep -q '"ready":true' /tmp/sponsor-offer.json; then
            echo "::error::sponsorOfferStatus 驗證失敗（HTTP $offer_status）。"
            cat /tmp/sponsor-offer.json || true
            exit 1
          fi

          checkout_status=$(curl --silent --show-error --output /tmp/sponsor-checkout.json --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Origin: https://lyyuan.tw" \
            --data '{"data":{"planMonths":1}}' \
            "$checkout_url")
          if [ "$checkout_status" = "404" ] || [ "$checkout_status" -ge 500 ]; then
            echo "::error::createPublicSponsorCheckout 不存在或無法回應（HTTP $checkout_status）。"
            cat /tmp/sponsor-checkout.json || true
            exit 1
          fi

      - name: Record successful backend deployment
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          mkdir -p .github/deploy-triggers
          {
            echo "firebase membership backend: success"
            echo "run id: $GITHUB_RUN_ID"
            echo "completed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > .github/deploy-triggers/firebase-functions-success.txt
          rm -f .github/deploy-triggers/firebase-functions-failed.txt
          git add -A .github/deploy-triggers
          git commit -m "Record successful Firebase membership deployment" || true
          git push origin HEAD:main || true

      - name: Record backend deployment failure
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .github/deploy-triggers
          {
            echo "firebase membership backend: failed"
            echo "run id: $GITHUB_RUN_ID"
            echo "failed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > .github/deploy-triggers/firebase-functions-failed.txt
          git add .github/deploy-triggers/firebase-functions-failed.txt
          git commit -m "Record failed Firebase membership deployment" || true
          git push origin HEAD:main || true
