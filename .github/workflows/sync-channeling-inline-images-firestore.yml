name: Sync Channeling Images To Firestore

on:
  push:
    branches:
      - media/channeling-inline-images-20260905
    paths:
      - .github/deploy-triggers/channeling-inline-images-firestore-20260905.txt

permissions:
  contents: read

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated media branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Firestore verification dependencies
        run: python -m pip install --disable-pip-version-check pillow requests google-cloud-firestore

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Verify live images, sync Firestore, and verify final state
        run: python scripts/sync-channeling-inline-images-static.py
