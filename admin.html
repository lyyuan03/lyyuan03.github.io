<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章後台｜靈元院</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<style>
:root{--gold:#A58254;--cream:#F5F0E8;--ink:#17130d;--deep:#071106;--panel:#10180d;--line:rgba(165,130,84,.28);--muted:rgba(245,240,232,.68);--sans:'Noto Sans TC','Arial',sans-serif;--serif:'Noto Serif TC','Georgia',serif}
*{box-sizing:border-box}body{margin:0;background:#071106;color:var(--cream);font-family:var(--sans);line-height:1.75;letter-spacing:.04em}.admin-shell{min-height:100vh}.admin-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 28px;background:rgba(7,17,6,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.brand{display:flex;flex-direction:column;gap:2px}.brand strong{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:.18em;color:var(--gold)}.brand span{font-size:12px;color:rgba(245,240,232,.55);letter-spacing:.16em}.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.admin-main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:24px;max-width:1280px;margin:0 auto;padding:28px}.panel{background:rgba(16,24,13,.94);border:1px solid var(--line);box-shadow:0 18px 60px rgba(0,0,0,.24)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid rgba(165,130,84,.18)}.panel-head h2{margin:0;font-family:var(--serif);font-weight:500;font-size:18px;letter-spacing:.14em}.article-list{max-height:calc(100vh - 164px);overflow:auto}.article-item{width:100%;display:block;text-align:left;padding:16px 18px;border:0;border-bottom:1px solid rgba(165,130,84,.14);background:transparent;color:var(--cream);cursor:pointer}.article-item:hover,.article-item.is-active{background:rgba(165,130,84,.1)}.article-item-title{font-size:15px;font-weight:500;margin-bottom:5px}.article-item-meta{font-size:12px;color:rgba(245,240,232,.48)}.editor{padding:22px;display:grid;gap:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px}.field label{font-size:13px;color:rgba(245,240,232,.72)}input,select,textarea{width:100%;border:1px solid rgba(165,130,84,.32);background:rgba(4,8,3,.62);color:var(--cream);font:inherit;padding:11px 12px;border-radius:0;outline:none}textarea{min-height:320px;resize:vertical;line-height:1.9}.content-preview{padding:18px;background:rgba(245,240,232,.06);border:1px solid rgba(165,130,84,.18);color:rgba(245,240,232,.8);max-height:360px;overflow:auto}.content-preview h1,.content-preview h2,.content-preview h3{font-family:var(--serif);color:var(--gold);font-weight:500}.content-preview p{margin:0 0 1em}.content-preview img{max-width:100%;height:auto;display:block;margin:18px auto;border:1px solid rgba(165,130,84,.18)}.editor-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.upload-note{font-size:12px;color:rgba(245,240,232,.48)}.btn{border:1px solid rgba(165,130,84,.55);background:rgba(165,130,84,.11);color:#CBAA77;padding:10px 16px;font-family:var(--sans);font-size:14px;letter-spacing:.08em;cursor:pointer}.btn:hover{background:rgba(165,130,84,.2)}.btn.primary{background:rgba(165,130,84,.24);color:#F5F0E8}.btn.danger{border-color:rgba(180,90,78,.55);color:#e2a09a;background:rgba(180,90,78,.1)}.btn:disabled{opacity:.55;cursor:wait}.status{font-size:13px;color:rgba(245,240,232,.58)}.empty{padding:28px;color:rgba(245,240,232,.48);text-align:center}.gate{max-width:460px;margin:12vh auto;padding:40px 34px;text-align:center;background:rgba(16,24,13,.94);border:1px solid var(--line)}.gate h1{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:.16em;color:var(--gold);margin:0 0 12px}.gate p{color:var(--muted);margin:0 0 24px}.hidden{display:none!important}@media(max-width:860px){.admin-main{grid-template-columns:1fr;padding:18px}.article-list{max-height:300px}.grid{grid-template-columns:1fr}.admin-top{align-items:flex-start;flex-direction:column}}
.metrics-box{border-bottom:1px solid rgba(165,130,84,.18);background:rgba(165,130,84,.035)}.metrics-head{padding:11px 18px 7px;font-size:11px;letter-spacing:.14em;color:rgba(203,170,119,.76)}.metrics-list{max-height:240px;overflow:auto;padding:0 12px 10px}.metrics-row{padding:9px 7px;border-bottom:1px solid rgba(165,130,84,.1)}.metrics-row:last-child{border-bottom:0}.metrics-title{font-size:12px;color:rgba(245,240,232,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metrics-values{display:flex;gap:10px;margin-top:3px;font-size:10px;color:rgba(245,240,232,.44)}.metrics-empty{padding:12px 7px;font-size:11px;color:rgba(245,240,232,.4)}
.membership-panel{grid-column:1/-1}.membership-layout{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(360px,1.2fr);gap:20px;padding:22px}.membership-card{border:1px solid rgba(165,130,84,.2);background:rgba(4,8,3,.28);padding:18px}.membership-card h3{margin:0 0 15px;color:#CBAA77;font-family:var(--serif);font-weight:500;letter-spacing:.12em}.membership-form{display:grid;gap:14px}.membership-list{display:grid;gap:9px;max-height:520px;overflow:auto}.member-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:13px;border:1px solid rgba(165,130,84,.16);background:rgba(165,130,84,.035)}.member-row strong{display:block;font-size:14px}.member-row small{display:block;color:rgba(245,240,232,.5);font-size:11px;margin-top:3px}.member-row-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.member-row .btn{padding:7px 10px;font-size:11px}.membership-help{font-size:12px;color:rgba(245,240,232,.5);line-height:1.8}.membership-summary{padding:11px 12px;border:1px solid rgba(165,130,84,.18);background:rgba(165,130,84,.06);font-size:13px;color:rgba(245,240,232,.72)}.check-field{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid rgba(165,130,84,.22);background:rgba(165,130,84,.05)}.check-field input{width:auto;margin-top:5px}.check-field strong{display:block;font-size:13px}.check-field small{display:block;color:rgba(245,240,232,.5);font-size:11px;margin-top:3px}@media(max-width:860px){.membership-layout{grid-template-columns:1fr;padding:16px}.member-row{grid-template-columns:1fr}.member-row-actions{justify-content:flex-start}}
</style>
<script src="/analytics-config.js"></script>
<script src="/analytics.js" defer></script>
</head>
<body>
<div id="login-gate" class="gate"><h1>靈元院文章後台</h1><p>請使用靈元院指定 Gmail 登入後，管理文章草稿與發布內容。</p><button id="admin-login" class="btn primary" type="button">使用 Google 登入</button><p id="gate-status" class="status"></p></div>
<div id="admin-app" class="admin-shell hidden">
<header class="admin-top"><div class="brand"><strong>靈元院文章後台</strong><span>ARTICLE MANAGEMENT</span></div><div class="top-actions"><span id="admin-user" class="status"></span><button id="export-articles" class="btn" type="button">匯出全部文章</button><span id="export-status" class="status" aria-live="polite"></span><a class="btn" href="articles.html" target="_blank">查看前台文章</a><a class="btn" href="index.html">回首頁</a><button id="admin-logout" class="btn" type="button">登出</button></div></header>
<main class="admin-main">
<section class="panel"><div class="panel-head"><h2>文章列表</h2><button id="new-article" class="btn" type="button">新增</button></div><div class="metrics-box"><div class="metrics-head">文章互動統計</div><div id="article-metrics" class="metrics-list"><div class="metrics-empty">載入中…</div></div></div><div id="article-list" class="article-list"><div class="empty">載入中…</div></div></section>
<section class="panel"><div class="panel-head"><h2>文章內容</h2><span id="save-status" class="status"></span></div><form id="article-form" class="editor"><div class="grid"><div class="field"><label for="title">標題</label><input id="title" name="title" required></div><div class="field"><label for="slug">網址代稱</label><input id="slug" name="slug" placeholder="可留空，系統會依標題產生"></div><div class="field"><label for="category">分類</label><select id="category" name="category"><option value="spiritual">靈．修行</option><option value="worldly">人．俗世</option><option value="spirit-world">異．靈界</option><option value="reading">思．讀物</option></select></div><div class="field"><label for="status">狀態</label><select id="status" name="status"><option value="draft">草稿</option><option value="published">發布</option></select></div></div><div class="field"><label for="excerpt">摘要</label><textarea id="excerpt" name="excerpt" style="min-height:96px"></textarea></div><div class="field"><label for="coverImage">封面圖片網址</label><input id="coverImage" name="coverImage" placeholder="https://..."></div><div class="field"><label for="content">內文</label><div class="editor-tools"><button id="upload-image" class="btn" type="button">插入圖片</button><input id="image-input" type="file" accept="image/*" multiple hidden><span id="upload-status" class="upload-note">可一次選擇多張圖片，系統會自動插入文章中。</span></div><textarea id="content" name="content" required></textarea></div><div class="field"><label>即時預覽</label><div id="preview" class="content-preview"></div></div><div class="top-actions"><button id="save-article" class="btn primary" type="submit">儲存文章</button><button id="delete-article" class="btn danger" type="button">刪除文章</button></div></form></section>
<section class="panel membership-panel"><div class="panel-head"><h2>贊助會員管理</h2><span id="membership-status" class="status" aria-live="polite"></span></div><div class="membership-layout"><div><div class="membership-card"><h3>方案與付款設定</h3><form id="membership-settings-form" class="membership-form"><div class="grid"><div class="field"><label for="price-1">一個月費用</label><input id="price-1" type="number" min="0" step="1" placeholder="例如 190"></div><div class="field"><label for="price-3">三個月費用</label><input id="price-3" type="number" min="0" step="1" placeholder="例如 570"></div><div class="field"><label for="price-12">十二個月費用</label><input id="price-12" type="number" min="0" step="1" placeholder="例如 1900"></div><div class="field"><label for="payment-days">付款期限（天）</label><input id="payment-days" type="number" min="1" max="30" value="3"></div></div><div class="field"><label for="ecpay-url">綠界付款連結</label><input id="ecpay-url" type="url" placeholder="https://..."></div><button class="btn primary" type="submit">儲存方案設定</button><p class="membership-help">綠界若為不同金額提供不同連結，可在建立單一會員時改填該筆專用網址。</p></form></div><div class="membership-card" style="margin-top:20px"><h3>新增／編輯會員</h3><form id="member-form" class="membership-form"><input id="member-original-email" type="hidden"><div class="grid"><div class="field"><label for="member-name">會員姓名</label><input id="member-name"></div><div class="field"><label for="member-email">登入 Gmail</label><input id="member-email" type="email" required></div><div class="field"><label for="member-months">會員月數</label><select id="member-months"><option value="1">一個月</option><option value="3">三個月</option><option value="12">十二個月</option><option value="custom">自訂月數</option></select></div><div class="field"><label for="member-custom-months">自訂月數</label><input id="member-custom-months" type="number" min="1" value="1" disabled></div><div class="field"><label for="member-amount">應繳金額</label><input id="member-amount" type="number" min="0" step="1" required></div><div class="field"><label for="member-payment-status">付款狀態</label><select id="member-payment-status"><option value="pending">待付款</option><option value="paid">已付款</option></select></div></div><div class="field"><label for="member-payment-url">本次付款連結</label><input id="member-payment-url" type="url" placeholder="預設帶入綠界付款連結"></div><div class="field"><label for="member-note">行政備註</label><textarea id="member-note" style="min-height:80px"></textarea></div><div id="member-summary" class="membership-summary">選擇方案後，系統將自動計算金額與效期。</div><div class="top-actions"><button class="btn primary" type="submit">儲存會員資料</button><button id="member-activate" class="btn" type="button">確認付款並開通</button><button id="member-email-payment" class="btn" type="button">開啟繳費通知 Email</button><button id="member-form-reset" class="btn" type="button">清除</button></div></form></div></div><div class="membership-card"><h3>會員名單</h3><div id="membership-list" class="membership-list"><div class="empty">載入中…</div></div></div></div></section>
<section class="panel membership-panel"><div class="panel-head"><h2>會員頻道管理</h2><span id="wellness-member-status" class="status" aria-live="polite"></span></div><div class="membership-layout"><div class="membership-card"><h3>新增／編輯會員頻道會員</h3><form id="wellness-member-form" class="membership-form"><input id="wellness-member-original-email" type="hidden"><div class="grid"><div class="field"><label for="wellness-member-name">會員姓名</label><input id="wellness-member-name"></div><div class="field"><label for="wellness-member-email">登入 Gmail</label><input id="wellness-member-email" type="email" required></div><div class="field"><label for="wellness-member-level">會員等級</label><select id="wellness-member-level"><option value="wellness">一般會員</option><option value="lingji">靈極會員</option></select></div><div class="field"><label for="wellness-member-state">會員狀態</label><select id="wellness-member-state"><option value="active">有效</option><option value="pending">未啟用</option></select></div><div class="field"><label for="wellness-member-first-joined-at">首次加入日期</label><input id="wellness-member-first-joined-at" type="date"></div><div class="field"><label for="wellness-member-starts-at">本次會期開始日</label><input id="wellness-member-starts-at" type="date"></div><div class="field"><label for="wellness-member-expires-at">到期日</label><input id="wellness-member-expires-at" type="date"></div><div class="field"><label for="wellness-member-total-spend">累積消費</label><input id="wellness-member-total-spend" type="number" min="0" step="1" value="0"></div><div class="field"><label for="wellness-member-reward-balance">回饋金餘額</label><input id="wellness-member-reward-balance" type="number" min="0" step="1" value="0"></div></div><label class="check-field" for="wellness-member-article-access"><input id="wellness-member-article-access" type="checkbox"><span><strong>開放付費文章閱讀</strong><small>一般會員可個別開啟；靈極會員會自動開啟。</small></span></label><div class="field"><label for="wellness-member-note">行政備註</label><textarea id="wellness-member-note" style="min-height:90px"></textarea></div><div class="top-actions"><button class="btn primary" type="submit">儲存會員資料</button><button id="wellness-member-reset" class="btn" type="button">清除</button></div></form></div><div class="membership-card"><h3>會員頻道名單</h3><p class="membership-help">會員頻道僅分為一般會員與靈極會員；文章閱讀權限獨立管理。</p><div id="wellness-member-list" class="membership-list"><div class="empty">載入中…</div></div></div></div></section>
</main></div>
<script type="module" src="article-admin.js?v=20260722-article-metrics-1"></script>
<script type="module" src="membership-admin.js?v=20260727-membership-1"></script>
<script type="module" src="wellness-member-admin.js?v=20260730-member-levels-2"></script>
</body>
</html>
